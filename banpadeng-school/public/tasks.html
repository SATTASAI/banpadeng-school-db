<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>จัดการงาน — ระบบจัดการโรงเรียนบ้านป่าเด็ง</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .task-toolbar { display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
  .task-list { margin-top:20px; display:flex; flex-direction:column; gap:12px; }
  .task-card { background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); padding:18px 20px; }
  .task-card.closed { opacity:0.6; }
  .task-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .task-title { font-size:16px; font-weight:600; margin:0; }
  .task-desc { color:var(--color-text-muted); font-size:14px; margin:6px 0 0; white-space:pre-wrap; }
  .task-meta { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; font-size:12px; }
  .badge { padding:3px 10px; border-radius:999px; font-weight:600; }
  .badge-low { background:rgba(63,122,85,0.12); color:var(--color-success); }
  .badge-normal { background:rgba(46,107,87,0.12); color:var(--color-forest-700); }
  .badge-high { background:var(--color-danger-bg); color:var(--color-danger); }
  .badge-overdue { background:var(--color-danger-bg); color:var(--color-danger); }
  .assignee-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid var(--color-border); font-size:14px; }
  .assignee-row:first-of-type { border-top:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--color-border); }
  .status-select { padding:4px 8px; border-radius:8px; border:1px solid var(--color-border); font-family:var(--font-body); background:var(--color-bg); font-size:13px; }
  .task-actions { display:flex; gap:8px; }
  .icon-btn { background:none; border:none; cursor:pointer; color:var(--color-text-muted); font-size:13px; text-decoration:underline; padding:0; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(28,38,32,0.4); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal { background:var(--color-surface); border-radius:var(--radius-lg); padding:28px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; }
  .assignee-checks { display:flex; flex-direction:column; gap:6px; max-height:160px; overflow-y:auto; border:1px solid var(--color-border); border-radius:var(--radius-md); padding:10px; }
  .assignee-checks label { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:400; }
  .modal-actions { display:flex; gap:10px; margin-top:20px; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="app-topbar">
    <div class="brand"><div class="brand-mark"></div>โรงเรียนบ้านป่าเด็ง</div>
    <div class="app-user">
      <a href="/dashboard.html">← กลับหน้าหลัก</a>
    </div>
  </div>

  <div class="app-main">
    <div class="task-toolbar">
      <div>
        <h2 style="margin-bottom:2px;">จัดการงาน</h2>
        <p style="color:var(--color-text-muted); margin:0;">มอบหมายงานและติดตามสถานะ</p>
      </div>
      <button class="btn btn-primary" style="width:auto;" id="newTaskBtn">+ มอบหมายงานใหม่</button>
    </div>

    <div class="error-box" id="errorBox"></div>
    <div class="task-list" id="taskList"></div>
    <div class="empty-state" id="emptyState" style="display:none;">ยังไม่มีงานในระบบ</div>
  </div>
</div>

<div class="modal-backdrop" id="taskModal" style="display:none;">
  <div class="modal">
    <h2 id="modalTitle">มอบหมายงานใหม่</h2>
    <div class="field">
      <label>ชื่องาน</label>
      <input type="text" id="fTitle" />
    </div>
    <div class="field">
      <label>รายละเอียด</label>
      <input type="text" id="fDescription" />
    </div>
    <div class="field">
      <label>ความสำคัญ</label>
      <select id="fPriority" style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--color-border); font-family:var(--font-body);">
        <option value="low">ต่ำ</option>
        <option value="normal" selected>ปกติ</option>
        <option value="high">สูง</option>
      </select>
    </div>
    <div class="field">
      <label>กำหนดส่ง</label>
      <input type="date" id="fDueDate" />
    </div>
    <div class="field">
      <label>ผู้รับผิดชอบ</label>
      <div class="assignee-checks" id="assigneeChecks"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelModalBtn">ยกเลิก</button>
      <button class="btn btn-primary" id="saveTaskBtn">บันทึก</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  let currentUser = null;
  let allUsers = [];
  let editingTaskId = null;

  const PRIORITY_LABEL = { low: "ต่ำ", normal: "ปกติ", high: "สูง" };
  const STATUS_LABEL = { pending: "ยังไม่เริ่ม", in_progress: "กำลังทำ", done: "เสร็จแล้ว" };

  function isOverdue(task) {
    if (!task.due_date || task.status === "closed") return false;
    return new Date(task.due_date) < new Date(new Date().toDateString());
  }

  function renderTask(task) {
    const canManage = currentUser.is_admin || task.created_by === currentUser.id;
    const overdue = isOverdue(task);

    const assigneeRows = task.assignees
      .map((a) => {
        const isMe = a.user_id === currentUser.id;
        const statusHtml = isMe
          ? `<select class="status-select" data-task="${task.id}" data-mystatus>
              ${Object.entries(STATUS_LABEL)
                .map(([v, l]) => `<option value="${v}" ${a.status === v ? "selected" : ""}>${l}</option>`)
                .join("")}
            </select>`
          : `<span>${STATUS_LABEL[a.status]}</span>`;
        return `<div class="assignee-row"><span>${a.full_name}${isMe ? " (คุณ)" : ""}</span>${statusHtml}</div>`;
      })
      .join("");

    return `
      <div class="task-card ${task.status === "closed" ? "closed" : ""}">
        <div class="task-head">
          <div>
            <p class="task-title">${task.title}</p>
            ${task.description ? `<p class="task-desc">${task.description}</p>` : ""}
          </div>
          ${
            canManage
              ? `<div class="task-actions">
                  <button class="icon-btn" data-edit="${task.id}">แก้ไข</button>
                  <button class="icon-btn" data-delete="${task.id}">ลบ</button>
                </div>`
              : ""
          }
        </div>
        <div class="task-meta">
          <span class="badge badge-${task.priority}">${PRIORITY_LABEL[task.priority]}</span>
          ${task.due_date ? `<span class="badge ${overdue ? "badge-overdue" : ""}">กำหนดส่ง ${task.due_date}${overdue ? " (เลยกำหนด)" : ""}</span>` : ""}
          ${task.status === "closed" ? `<span class="badge">ปิดงานแล้ว</span>` : ""}
          <span style="color:var(--color-text-muted);">โดย ${task.creator_name}</span>
        </div>
        ${assigneeRows}
      </div>`;
  }

  async function loadTasks() {
    const errorBox = document.getElementById("errorBox");
    errorBox.classList.remove("visible");
    try {
      const { tasks } = await apiRequest("/api/tasks");
      const list = document.getElementById("taskList");
      const emptyState = document.getElementById("emptyState");
      if (tasks.length === 0) {
        list.innerHTML = "";
        emptyState.style.display = "block";
        return;
      }
      emptyState.style.display = "none";
      list.innerHTML = tasks.map(renderTask).join("");

      list.querySelectorAll("[data-mystatus]").forEach((select) => {
        select.addEventListener("change", async () => {
          const taskId = select.getAttribute("data-task");
          select.disabled = true;
          try {
            await apiRequest(`/api/tasks/${taskId}/status`, { method: "PATCH", body: { status: select.value } });
            await loadTasks();
          } catch (err) {
            alert(err.message);
            select.disabled = false;
          }
        });
      });
      list.querySelectorAll("[data-edit]").forEach((btn) => {
        btn.addEventListener("click", () => openModal(tasks.find((t) => t.id == btn.getAttribute("data-edit"))));
      });
      list.querySelectorAll("[data-delete]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("ยืนยันลบงานนี้?")) return;
          try {
            await apiRequest(`/api/tasks/${btn.getAttribute("data-delete")}`, { method: "DELETE" });
            await loadTasks();
          } catch (err) {
            alert(err.message);
          }
        });
      });
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("visible");
    }
  }

  function renderAssigneeChecks(selectedIds) {
    const container = document.getElementById("assigneeChecks");
    container.innerHTML = allUsers
      .map(
        (u) => `<label>
          <input type="checkbox" value="${u.id}" ${selectedIds.includes(u.id) ? "checked" : ""} />
          ${u.full_name}
        </label>`
      )
      .join("");
  }

  function openModal(task) {
    editingTaskId = task ? task.id : null;
    document.getElementById("modalTitle").textContent = task ? "แก้ไขงาน" : "มอบหมายงานใหม่";
    document.getElementById("fTitle").value = task ? task.title : "";
    document.getElementById("fDescription").value = task ? task.description || "" : "";
    document.getElementById("fPriority").value = task ? task.priority : "normal";
    document.getElementById("fDueDate").value = task ? task.due_date || "" : "";
    renderAssigneeChecks(task ? task.assignees.map((a) => a.user_id) : []);
    document.getElementById("taskModal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("taskModal").style.display = "none";
  }

  document.getElementById("newTaskBtn").addEventListener("click", () => openModal(null));
  document.getElementById("cancelModalBtn").addEventListener("click", closeModal);

  document.getElementById("saveTaskBtn").addEventListener("click", async () => {
    const title = document.getElementById("fTitle").value.trim();
    const description = document.getElementById("fDescription").value.trim();
    const priority = document.getElementById("fPriority").value;
    const due_date = document.getElementById("fDueDate").value || null;
    const assignee_ids = Array.from(document.querySelectorAll("#assigneeChecks input:checked")).map((el) =>
      Number(el.value)
    );

    if (!title) return alert("กรุณากรอกชื่องาน");
    if (assignee_ids.length === 0) return alert("กรุณาเลือกผู้รับผิดชอบอย่างน้อย 1 คน");

    try {
      if (editingTaskId) {
        await apiRequest(`/api/tasks/${editingTaskId}`, {
          method: "PATCH",
          body: { title, description, priority, due_date, assignee_ids },
        });
      } else {
        await apiRequest("/api/tasks", { method: "POST", body: { title, description, priority, due_date, assignee_ids } });
      }
      closeModal();
      await loadTasks();
    } catch (err) {
      alert(err.message);
    }
  });

  (async () => {
    const { user } = await apiRequest("/api/auth/me");
    if (!user) { window.location.href = "/login.html"; return; }
    if (!user.role) { window.location.href = "/pending.html"; return; }
    currentUser = user;

    const { users } = await apiRequest("/api/users");
    allUsers = users;

    await loadTasks();
  })();
</script>
</body>
</html>
