<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>วันลา — ระบบจัดการโรงเรียนบ้านป่าเด็ง</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .section-title { margin-top:32px; margin-bottom:12px; }
  .leave-row { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid var(--color-border); gap:12px; flex-wrap:wrap; }
  .leave-row:last-child { border-bottom:none; }
  .leave-main { font-weight:600; }
  .leave-sub { font-size:13px; color:var(--color-text-muted); margin-top:2px; }
  .leave-actions { display:flex; gap:8px; }
  .leave-actions .btn { width:auto; padding:6px 14px; font-size:13px; }
  select.plain { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--color-border); font-family:var(--font-body); background:var(--color-bg); }
  .field-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="app-topbar">
    <div class="brand"><div class="brand-mark"></div>โรงเรียนบ้านป่าเด็ง</div>
    <div class="app-user"><a href="/dashboard.html">← กลับหน้าหลัก</a></div>
  </div>

  <div class="app-main">
    <h2 style="margin-bottom:2px;">วันลา</h2>
    <p style="color:var(--color-text-muted); margin:0;">ยื่นขอลาและติดตามสถานะการอนุมัติ</p>

    <div class="error-box" id="errorBox"></div>

    <div class="panel" style="margin-top:20px; padding:20px;">
      <h3 style="margin-top:0;">ยื่นขอลาใหม่</h3>
      <div class="field-row">
        <div class="field">
          <label>ประเภทการลา</label>
          <select class="plain" id="fType">
            <option value="sick">ลาป่วย</option>
            <option value="personal">ลากิจ</option>
            <option value="maternity">ลาคลอด</option>
            <option value="other">อื่นๆ</option>
          </select>
        </div>
        <div class="field" id="reasonField" style="display:none;">
          <label>เหตุผล (จำเป็นสำหรับ "อื่นๆ")</label>
          <input type="text" id="fReason" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>วันที่เริ่มลา</label>
          <input type="date" id="fStart" />
        </div>
        <div class="field">
          <label>วันที่สิ้นสุด</label>
          <input type="date" id="fEnd" />
        </div>
      </div>
      <button class="btn btn-primary" style="width:auto; padding:10px 20px;" id="submitBtn">ยื่นขอลา</button>
    </div>

    <div id="pendingSection" style="display:none;">
      <h3 class="section-title">รออนุมัติ</h3>
      <div class="panel" id="pendingPanel"></div>
    </div>

    <h3 class="section-title">ประวัติการลา</h3>
    <div class="panel" id="historyPanel"></div>
    <div class="empty-state" id="emptyState" style="display:none;">ยังไม่มีประวัติการลา</div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  let currentUser = null;
  const TYPE_LABEL = { sick: "ลาป่วย", personal: "ลากิจ", maternity: "ลาคลอด", other: "อื่นๆ" };
  const STATUS_LABEL = { pending: "รอดำเนินการ", approved: "อนุมัติแล้ว", rejected: "ไม่อนุมัติ" };

  document.getElementById("fType").addEventListener("change", (e) => {
    document.getElementById("reasonField").style.display = e.target.value === "other" ? "block" : "none";
  });

  document.getElementById("submitBtn").addEventListener("click", async () => {
    const leave_type = document.getElementById("fType").value;
    const reason = document.getElementById("fReason").value.trim();
    const start_date = document.getElementById("fStart").value;
    const end_date = document.getElementById("fEnd").value;

    if (!start_date || !end_date) return alert("กรุณาระบุวันที่เริ่มและสิ้นสุด");
    if (leave_type === "other" && !reason) return alert("กรุณาระบุเหตุผลเมื่อเลือกประเภท 'อื่นๆ'");

    try {
      await apiRequest("/api/leave-requests", { method: "POST", body: { leave_type, reason, start_date, end_date } });
      document.getElementById("fReason").value = "";
      document.getElementById("fStart").value = "";
      document.getElementById("fEnd").value = "";
      await loadLeaveRequests();
    } catch (err) {
      alert(err.message);
    }
  });

  function renderRow(lr, showRequester) {
    const canCancel = lr.status === "pending" && (lr.user_id === currentUser.id || currentUser.is_admin);
    const canApprove = currentUser.is_admin && lr.status === "pending";
    return `
      <div class="leave-row" data-id="${lr.id}">
        <div>
          <div class="leave-main">${showRequester ? lr.full_name + " — " : ""}${TYPE_LABEL[lr.leave_type]} (${lr.start_date} ถึง ${lr.end_date})</div>
          ${lr.reason ? `<div class="leave-sub">${lr.reason}</div>` : ""}
          <div class="leave-sub">สถานะ: ${STATUS_LABEL[lr.status]}${lr.approver_name ? " โดย " + lr.approver_name : ""}</div>
        </div>
        <div class="leave-actions">
          ${canApprove ? `<button class="btn btn-primary" data-approve="${lr.id}">อนุมัติ</button><button class="btn btn-ghost" data-reject="${lr.id}">ไม่อนุมัติ</button>` : ""}
          ${canCancel ? `<button class="btn btn-ghost" data-cancel="${lr.id}">ยกเลิกคำขอ</button>` : ""}
        </div>
      </div>`;
  }

  async function loadLeaveRequests() {
    const errorBox = document.getElementById("errorBox");
    errorBox.classList.remove("visible");
    try {
      const { leave_requests } = await apiRequest("/api/leave-requests");

      if (currentUser.is_admin) {
        const pending = leave_requests.filter((lr) => lr.status === "pending");
        document.getElementById("pendingSection").style.display = pending.length > 0 ? "block" : "none";
        document.getElementById("pendingPanel").innerHTML = pending.map((lr) => renderRow(lr, true)).join("");
      }

      const history = currentUser.is_admin ? leave_requests : leave_requests;
      const historyPanel = document.getElementById("historyPanel");
      const emptyState = document.getElementById("emptyState");
      if (history.length === 0) {
        historyPanel.innerHTML = "";
        emptyState.style.display = "block";
      } else {
        emptyState.style.display = "none";
        historyPanel.innerHTML = history.map((lr) => renderRow(lr, currentUser.is_admin)).join("");
      }

      document.querySelectorAll("[data-approve]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          try {
            await apiRequest(`/api/leave-requests/${btn.getAttribute("data-approve")}`, { method: "PATCH", body: { status: "approved" } });
            await loadLeaveRequests();
          } catch (err) {
            alert(err.message);
          }
        });
      });
      document.querySelectorAll("[data-reject]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          try {
            await apiRequest(`/api/leave-requests/${btn.getAttribute("data-reject")}`, { method: "PATCH", body: { status: "rejected" } });
            await loadLeaveRequests();
          } catch (err) {
            alert(err.message);
          }
        });
      });
      document.querySelectorAll("[data-cancel]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("ยืนยันยกเลิกคำขอลานี้?")) return;
          try {
            await apiRequest(`/api/leave-requests/${btn.getAttribute("data-cancel")}`, { method: "DELETE" });
            await loadLeaveRequests();
          } catch (err) {
            alert(err.message);
          }
        });
      });
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("visible");
    }
  }

  (async () => {
    const { user } = await apiRequest("/api/auth/me");
    if (!user) { window.location.href = "/login.html"; return; }
    if (!user.role) { window.location.href = "/pending.html"; return; }
    currentUser = user;
    await loadLeaveRequests();
  })();
</script>
</body>
</html>
