<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ลืมรหัสผ่าน — โรงเรียนบ้านป่าเด็ง</title>
<link rel="stylesheet" href="/css/style.css">
<style>.reset-message{padding:14px;border-radius:12px;background:#e8f6ee;color:#217248;margin-bottom:16px;line-height:1.6}.reset-message[hidden]{display:none}</style>
</head>
<body><main class="auth-shell"><div class="auth-card">
<div class="auth-mark"><img src="/logo.jpg" alt="ตราโรงเรียน"></div>
<h1>ลืมรหัสผ่าน</h1><p class="auth-subtitle">กรอกอีเมลที่ใช้สมัครสมาชิก เพื่อรับลิงก์ตั้งรหัสผ่านใหม่</p>
<div class="error-box" id="errorBox" role="alert"></div>
<div class="reset-message" id="message" role="status" hidden></div>
<form id="forgotForm">
<div class="field"><label for="email">อีเมล</label><input type="email" id="email" autocomplete="email" maxlength="254" required></div>
<button class="btn btn-primary" id="sendButton" type="submit">ส่งลิงก์ตั้งรหัสผ่านใหม่</button>
</form>
<div class="auth-footer"><a href="/login.html">กลับเข้าสู่ระบบ</a></div>
</div></main>
<script src="/js/api.js"></script>
<script>
const form=document.getElementById('forgotForm'),button=document.getElementById('sendButton'),errorBox=document.getElementById('errorBox'),message=document.getElementById('message');
form.addEventListener('submit',async event=>{
 event.preventDefault();button.disabled=true;button.textContent='กำลังส่งคำขอ...';errorBox.classList.remove('visible');message.hidden=true;
 try{const result=await apiRequest('/api/auth/forgot-password',{method:'POST',body:{email:document.getElementById('email').value}});message.textContent=result.message;message.hidden=false}
 catch(error){errorBox.textContent=error.message;errorBox.classList.add('visible')}
 finally{button.disabled=false;button.textContent='ส่งลิงก์ตั้งรหัสผ่านใหม่'}
});
</script></body></html>
