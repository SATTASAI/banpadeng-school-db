<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ระบบเอกสารโครงการและขอเบิกจ่าย</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/project-workflow.css"><link rel="stylesheet" href="/css/project-balance.css"></head>
<body><div class="app-shell"><div class="app-topbar"><div class="brand"><div class="brand-mark"><img src="/logo.jpg" alt="ตราโรงเรียน"></div>โรงเรียนบ้านป่าเด็ง</div><div class="app-user"><a href="/dashboard.html">← หน้าหลัก</a></div></div><main class="app-main wf-page"><h1>ระบบเอกสารโครงการและขอเบิกจ่าย</h1><p>เลือกข้อมูลโครงการจากระบบ กรอกรายการเบิกจ่าย บันทึก แล้วส่งเอกสารให้ฝ่ายงบประมาณ</p><div class="wf-steps">บันทึกร่าง → ส่งเอกสาร → เจ้าหน้าที่รับเรื่อง → ดำเนินการเสร็จสิ้น → ยืนยันการเบิกจ่าย<br>แนบเอกสารเพิ่มเติมได้ทั้งก่อนและหลังส่งคำขอ</div><div class="wf-tools"><a class="btn btn-ghost" id="backDepartment" href="/departments.html">กลับฝ่ายงาน</a><button class="btn btn-ghost" id="refreshWorkflow">รีเฟรชข้อมูล</button></div><div id="workflow"></div></main></div><script src="/js/api.js"></script><script src="/js/project-balance.js"></script><script src="/js/project-workflow.js"></script><script>
(async()=>{const me=await apiRequest('/api/auth/me');if(!me.user){location.href='/login.html';return}const q=new URLSearchParams(location.search);const department=q.get('dept');if(department)document.getElementById('backDepartment').href='/department.html?dept='+encodeURIComponent(department);const app=ProjectWorkflow.mount(document.getElementById('workflow'),{department,project:Number(q.get('project')),documents:true});document.getElementById('refreshWorkflow').onclick=()=>app.refresh();await app.refresh();if(q.get('new')==='1')app.newRequest(Number(q.get('project')));})().catch(e=>{document.getElementById('workflow').textContent=e.message});
</script></body></html>
