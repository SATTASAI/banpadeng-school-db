<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>จัดการงาน — ระบบจัดการโรงเรียนบ้านป่าเด็ง</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-shell">
  <div class="app-topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      โรงเรียนบ้านป่าเด็ง
    </div>
    <div class="app-user">
      <a href="/dashboard.html">← กลับหน้าหลัก</a>
    </div>
  </div>

  <div class="app-main">
    <div class="page-header">
      <div>
        <h2>จัดการงาน</h2>
        <p style="color: var(--color-text-muted); margin: 0;">มอบหมายงาน ติดตามสถานะของแต่ละคน</p>
      </div>
      <button class="btn btn-primary" id="newTaskBtn" style="width: auto;">+ มอบหมายงานใหม่</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-view="assigned">งานของฉัน</button>
      <button class="tab-btn" data-view="created">งานที่ฉันมอบหมาย</button>
      <button class="tab-btn" data-view="all" id="allTab" style="display: none;">ทั้งหมดในระบบ</button>
    </div>

    <div class="task-list" id="taskList"></div>
    <div class="empty-state" id="emptyState" style="display: none;">ยังไม่มีงานในหมวดนี้</div>
  </div>
</div>

<!-- Modal: มอบหมายงานใหม่ -->
<div class="modal-overlay" id="taskModal">
  <div class="modal-box">
    <h2>มอบหมายงานใหม่</h2>
    <div class="error-box" id="modalError"></div>

    <div class="field">
      <label>ชื่องาน</label>
      <input type="text" id="fTitle" />
    </div>
    <div class="field">
      <label>รายละเอียด</label>
      <textarea id="fDescription" placeholder="(ไม่บังคับ)"></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label>ความสำคัญ</label>
        <select id="fPriority">
          <option value="low">ต่ำ</option>
          <option value="normal" selected>ปกติ</option>
          <option value="high">สูง</option>
          <option value="urgent">เร่งด่วน</option>
        </select>
      </div>
      <div class="field">
        <label>กำหนดส่ง</label>
        <input type="date" id="fDueDate" />
      </div>
    </div>
    <div class="field">
      <label>ผู้รับผิดชอบ</label>
      <div class="checkbox-list" id="assigneeList"></div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelTaskBtn">ยกเลิก</button>
      <button class="btn btn-primary" id="saveTaskBtn">บันทึก</button>
    </div>
  </div>
</div>

<!-- Modal: รายละเอียดงาน -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
      <h2 id="detailTitle" style="margin-bottom: 4px;"></h2>
      <span class="badge" id="detailPriority"></span>
    </div>
    <p style="color: var(--color-text-muted); font-size: 13px; margin: 0 0 12px;" id="detailMeta"></p>
    <p id="detailDescription" style="white-space: pre-wrap;"></p>

    <div>
      <label style="display: block; font-size: 14px; font-weight: 500; margin: 16px 0 8px; color: var(--color-forest-900);">ผู้รับผิดชอบ</label>
      <div id="detailAssignees"></div>
    </div>

    <div id="ownerActions" style="display: none;">
      <div class="field" style="margin-top: 16px;">
        <label>เพิ่มผู้รับผิดชอบ</label>
        <div class="checkbox-list" id="addAssigneeList"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="toggleStatusBtn"></button>
        <button class="btn btn-danger" id="deleteTaskBtn">ลบงาน</button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="closeDetailBtn">ปิดหน้าต่าง</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/tasks.js"></script>
</body>
</html>
