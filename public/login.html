<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>เข้าสู่ระบบ — ระบบจัดการโรงเรียนบ้านป่าเด็ง</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3L3 8l9 5 9-5-9-5z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M6 10.5V16c0 1.1 2.7 3 6 3s6-1.9 6-3v-5.5" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>เข้าสู่ระบบ</h1>
    <p class="auth-subtitle">ระบบจัดการงานและข้อมูลโรงเรียนบ้านป่าเด็ง</p>

    <div class="error-box" id="errorBox"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">อีเมล</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">เข้าสู่ระบบ</button>
    </form>

    <div class="auth-footer">
      ยังไม่มีบัญชี? <a href="/register.html">สมัครสมาชิก</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  const form = document.getElementById("loginForm");
  const errorBox = document.getElementById("errorBox");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("visible");
    submitBtn.disabled = true;
    submitBtn.textContent = "กำลังเข้าสู่ระบบ...";

    try {
      const { user } = await apiRequest("/api/auth/login", {
        method: "POST",
        body: {
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        },
      });
      window.location.href = user.role ? "/dashboard.html" : "/pending.html";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("visible");
      submitBtn.disabled = false;
      submitBtn.textContent = "เข้าสู่ระบบ";
    }
  });
</script>
</body>
</html>
