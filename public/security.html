<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ความปลอดภัยและสำรองข้อมูล</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="app-main"><a href="/dashboard.html">← กลับแดชบอร์ด</a><h2>ความปลอดภัยและสถานะฐานข้อมูล</h2><p>ตรวจสอบจำนวนข้อมูลและประวัติการดำเนินการล่าสุด</p><div class="overview-grid" id="counts"></div><h3>Audit log ล่าสุด</h3><div class="panel" id="logs">กำลังโหลด...</div></main><script src="/js/api.js"></script><script>(async()=>{const d=await apiRequest('/api/security/overview');counts.innerHTML=Object.entries(d.counts).map(([k,v])=>`<div class="overview-card"><div class="overview-number">${v}</div><div class="overview-label">${k}</div></div>`).join('');logs.innerHTML=d.logs.length?'<table><tr><th>วันเวลา</th><th>ผู้ใช้</th><th>การดำเนินการ</th><th>รายการ</th></tr>'+d.logs.map(x=>`<tr><td>${x.created_at}</td><td>${x.full_name||'-'}</td><td>${x.action}</td><td>${x.resource}</td></tr>`).join('')+'</table>':'ยังไม่มีประวัติ'})().catch(e=>{document.body.innerHTML+='<p>'+e.message+'</p>'})</script></body></html>
