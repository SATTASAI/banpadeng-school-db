<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>จัดครูสอนแทน — โรงเรียนบ้านป่าเด็ง</title><link rel="stylesheet" href="/css/style.css"><style>
  .page{max-width:1100px;margin:auto;padding:24px}.page h1{color:#163e67}.lead{color:#607991}.filters{display:grid;grid-template-columns:1fr 1.5fr auto;gap:12px;align-items:end;margin:20px 0}.filters label{display:grid;gap:5px}.filters input,.filters select,.lesson select,.lesson input{width:100%;padding:10px;border:1px solid #cbdbe8;border-radius:10px;background:#fff;font:inherit}.filters button{width:auto}.notice{padding:12px 14px;border:1px solid #cfdfec;background:#f3f9fd;border-radius:12px}.notice.error{color:#9e3131;background:#fff2f2}.lesson-list{display:grid;gap:12px;margin-top:16px}.lesson{display:grid;grid-template-columns:1.3fr 1.3fr auto;align-items:end;gap:12px;padding:16px;border:1px solid #d5e2ed;border-radius:14px;background:#fff}.lesson strong{display:block;color:#1c507c}.lesson p{margin:3px 0 0;color:#5d758b}.lesson button{width:auto}.section-title{margin-top:30px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #dde8f0;text-align:left}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions>*{width:auto}@media(max-width:760px){.page{padding:14px}.filters,.lesson{grid-template-columns:1fr}}@media print{@page{size:A4 portrait;margin:15mm}.app-topbar,.filters,.notice,.lesson-list,.actions,.lead{display:none!important}.page{padding:0}h1{text-align:center;font-size:20pt}table{font-size:16pt}th,td{border:1px solid #aaa}.section-title{margin-top:15mm}}
</style></head><body><div class="app-topbar"><div class="brand"><div class="brand-mark"><img src="/logo.jpg" alt="ตราโรงเรียน"></div>โรงเรียนบ้านป่าเด็ง</div><div class="app-user"><a href="/dashboard.html">← กลับหน้าหลัก</a></div></div><main class="page"><h1>จัดสอนแทน</h1><p class="lead">เลือกใบลาจากระบบการลาเพื่อจัดครูสอนแทน ระบบแสดงคาบจากตารางที่เผยแพร่และครูที่ว่างในวันนั้น</p>
<div class="filters"><label>วันที่<input type="date" id="date"></label><label>ครูที่ลา / ใบลา<select id="absentTeacher"></select></label><button class="btn btn-primary" id="find">ค้นหาคาบ</button></div><div class="notice" id="status" role="status">กำลังโหลดข้อมูลการลา...</div><div class="notice" id="leaveInfo" hidden></div><div class="lesson-list" id="lessons"></div>
<h2 class="section-title">คำสั่งสอนแทนประจำวัน <span id="printDate"></span></h2><div class="actions"><button class="btn btn-primary" id="exportDocx" disabled>ดาวน์โหลด Word (.docx)</button><button class="btn btn-primary" id="exportPdf" disabled>ดาวน์โหลด PDF</button><button class="btn btn-ghost" id="print">พิมพ์คำสั่งสอนแทน</button><a class="btn btn-ghost" href="/timetable.html">เปิดตารางสอน</a><a class="btn btn-ghost" href="/import-center.html?template=staff&amp;download=1">แม่แบบข้อมูลครู</a></div><div class="filters"><label>เลขที่คำสั่ง<input id="orderNumber" placeholder="เช่น 123/2569" maxlength="100"></label><label>ชื่อผู้อำนวยการ<input id="directorName" placeholder="ดึงจากทะเบียนบุคลากร" readonly aria-readonly="true"></label><label>วันที่ออกคำสั่ง<input type="date" id="issueDate"></label></div><div class="table-wrap" id="assignments"></div></main>
<script src="/js/api.js"></script><script src="/js/substitute-order-export.js"></script><script>
(()=>{const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);let me=null,coverage=null,assignments=[],leaveRequests=[],loadVersion=0,searchVersion=0;
const leaveTypes={sick:"ลาป่วย",personal:"ลากิจ",maternity:"ลาคลอด",lenient:"ลาอนุโลม",other:"ลาอื่น ๆ"};
function say(message,error=false){$("status").textContent=message;$("status").classList.toggle("error",error)}
async function loadAssignments(){const date=$("date").value;if(!date)return;$("printDate").textContent=date;$("exportDocx").disabled=$("exportPdf").disabled=true;assignments=[];$("assignments").innerHTML='<div class="notice">กำลังโหลดคำสั่งสอนแทน...</div>';const data=await apiRequest(`/api/substitutes/assignments?date=${encodeURIComponent(date)}`);if(date!==$("date").value)return;assignments=data.assignments;$("exportDocx").disabled=$("exportPdf").disabled=!assignments.length;$("assignments").innerHTML=data.assignments.length?`<table><thead><tr><th>คาบ</th><th>ชั้น/ห้อง</th><th>วิชา</th><th>ครูที่ไม่อยู่</th><th>ครูสอนแทน</th><th>ใบลาอ้างอิง</th></tr></thead><tbody>${data.assignments.map(a=>`<tr><td>${a.period}</td><td>${esc(a.grade_level)}/${esc(a.classroom)}</td><td>${esc(a.subject)}</td><td>${esc(a.absent_name)}</td><td>${esc(a.substitute_name)}</td><td>${a.leave_request_id?`#${a.leave_request_id} · ${a.leave_status==='approved'?'อนุมัติแล้ว':a.leave_status==='pending'?'รอพิจารณา':'ไม่อนุมัติ — ตรวจคำสั่ง'}`:"ไม่ได้ผูกใบลา"}</td></tr>`).join("")}</tbody></table>`:'<div class="notice">ยังไม่มีคำสั่งสอนแทนในวันนี้</div>'}
function selectedLeave(){return leaveRequests.find(r=>String(r.leave_request_id)===$("absentTeacher").value)}
function showLeave(){const r=selectedLeave();$("leaveInfo").hidden=!r;if(!r)return;
 $("leaveInfo").textContent=`${r.full_name} · ${leaveTypes[r.leave_type]||r.leave_type} · ${r.start_date} ถึง ${r.end_date} · ${r.leave_days??"ไม่ระบุ"} วัน · ${r.status==='approved'?'อนุมัติแล้ว':'รอพิจารณา (การจัดสอนแทนไม่ใช่การอนุมัติลา)'} · ใบลา #${r.leave_request_id} — เลือกเฉพาะคาบที่ต้องสอนแทน โดยเฉพาะกรณีลาครึ่งวัน`;
}
async function loadLeaves(){const date=$("date").value,version=++loadVersion;++searchVersion;leaveRequests=[];coverage=null;$("lessons").innerHTML="";$("leaveInfo").hidden=true;$("find").disabled=true;$("absentTeacher").innerHTML='<option value="">กำลังโหลดใบลา...</option>';
 try{const data=await apiRequest(`/api/substitutes/leaves?date=${encodeURIComponent(date)}`);if(version!==loadVersion)return;leaveRequests=data.leave_requests||[];
 $("absentTeacher").innerHTML='<option value="">เลือกครูที่ลา</option>'+leaveRequests.map(r=>`<option value="${r.leave_request_id}">${esc(r.full_name)} · ${esc(leaveTypes[r.leave_type]||r.leave_type)} · ${r.status==='approved'?'อนุมัติแล้ว':'รอพิจารณา'} · #${r.leave_request_id}</option>`).join("");
 $("find").disabled=!leaveRequests.length;say(leaveRequests.length?`พบ ${leaveRequests.length} ใบลาในวันที่เลือก เลือกครูเพื่อจัดสอนแทน`:'ไม่มีใบลาในวันที่เลือก (ไม่รวมรายการไม่อนุมัติหรือยกเลิก)');
 }catch(e){if(version===loadVersion){$("absentTeacher").innerHTML='<option value="">โหลดใบลาไม่สำเร็จ</option>';say(e.message,true)}}
}
async function find(){const date=$("date").value,leave=selectedLeave(),teacher=leave?.teacher_id,version=++searchVersion;if(!date||!teacher){say("เลือกวันที่และใบลาก่อน",true);return}showLeave();
try{const data=await apiRequest(`/api/substitutes/coverage?date=${encodeURIComponent(date)}&teacher_id=${teacher}`);if(version!==searchVersion||date!==$("date").value||leave!==selectedLeave())return;coverage=data;const lessons=coverage.lessons;$("lessons").innerHTML=lessons.length?lessons.map(l=>`<div class="lesson" data-entry="${l.id}"><div><strong>คาบ ${l.period} · ${esc(l.subject)}</strong><p>${esc(l.grade_level)}/${esc(l.classroom)}${l.room_name?` · ${esc(l.room_name)}`:""}</p></div><label>ครูที่ว่าง<select ${l.assignment_id||!me.can_manage_substitutes?"disabled":""}><option value="">${l.assignment_id?esc(l.substitute_name):l.available_teachers.length?"เลือกครูสอนแทน":"ไม่มีครูว่าง"}</option>${l.assignment_id?"":l.available_teachers.map(t=>`<option value="${t.id}">${esc(t.full_name)}</option>`).join("")}</select></label>${l.assignment_id?'<span>มอบหมายแล้ว</span>':me.can_manage_substitutes?`<button type="button" class="btn btn-primary" ${l.available_teachers.length?"":"disabled"}>บันทึก</button>`:""}</div>`).join(""):'<div class="notice">ครูคนนี้ไม่มีคาบในวันที่เลือกตามตารางที่เผยแพร่</div>';
$("lessons").querySelectorAll(".lesson button").forEach(button=>button.onclick=async()=>{const card=button.closest(".lesson"),subId=Number(card.querySelector("select").value);if(!subId){say("เลือกครูสอนแทนก่อน",true);return}button.disabled=true;try{await apiRequest("/api/substitutes/assignments",{method:"POST",body:{date,leave_request_id:leave.leave_request_id,teacher_id:Number(teacher),entry_id:Number(card.dataset.entry),substitute_teacher_id:subId}});await Promise.all([find(),loadAssignments()]);say("บันทึกครูสอนแทนแล้ว")}catch(e){say(e.message,true);button.disabled=false}});
say(`พบ ${lessons.length} คาบ · ภาคเรียน ${coverage.term.name} ปี ${coverage.term.year_be}`);await loadAssignments();
}catch(e){if(version===searchVersion){coverage=null;$("lessons").innerHTML="";say(e.message,true)}}}
async function exportOrder(format){const buttons=[$("exportDocx"),$("exportPdf")];buttons.forEach(b=>b.disabled=true);try{const latest=await apiRequest('/api/staff');const directorName=SubstituteOrderExport.director(latest.staff);$("directorName").value=directorName;await SubstituteOrderExport.exportFile(format,assignments,{date:$("date").value,issue_date:$("issueDate").value,order_number:$("orderNumber").value,director_name:directorName});say(format==='print'?'เปิดคำสั่งสำหรับพิมพ์แล้ว':'ดาวน์โหลดคำสั่งสอนแทนแล้ว')}catch(e){say(e.message,true)}finally{buttons.forEach(b=>b.disabled=!assignments.length)}}
$("exportDocx").onclick=()=>exportOrder('docx');$("exportPdf").onclick=()=>exportOrder('pdf');
$("find").onclick=find;$("date").onchange=()=>{Promise.all([loadLeaves(),loadAssignments()]).catch(e=>say(e.message,true))};$("absentTeacher").onchange=()=>{++searchVersion;coverage=null;$("lessons").innerHTML="";showLeave();if(selectedLeave())find()};$("print").onclick=()=>exportOrder('print');
(async()=>{const auth=await apiRequest('/api/auth/me');me=auth.user;if(!me){location.href='/login.html';return}const permission=await apiRequest('/api/substitutes/permissions');me.can_manage_substitutes=permission.can_manage;
if(!permission.can_manage){document.querySelectorAll('.filters,.actions').forEach(e=>e.style.display='none');say('เฉพาะเจ้าหน้าที่ฝ่ายบุคลากรที่ได้รับมอบหมายเท่านั้น',true);return}
const staff=await apiRequest('/api/staff');$("date").value=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Bangkok"});$("issueDate").value=$("date").value;try{$("directorName").value=SubstituteOrderExport.director(staff.staff)}catch(e){$("directorName").placeholder=e.message;}await loadLeaves();await loadAssignments()})().catch(e=>say(e.message,true));
})();</script></body></html>
