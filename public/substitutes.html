<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>จัดครูสอนแทน — โรงเรียนบ้านป่าเด็ง</title><link rel="stylesheet" href="/css/style.css"><style>
  .page{max-width:1100px;margin:auto;padding:24px}.page h1{color:#163e67}.lead{color:#607991}.filters{display:grid;grid-template-columns:1fr 1.5fr auto;gap:12px;align-items:end;margin:20px 0}.filters label{display:grid;gap:5px}.filters input,.filters select,.lesson select,.lesson input{width:100%;padding:10px;border:1px solid #cbdbe8;border-radius:10px;background:#fff;font:inherit}.filters button{width:auto}.notice{padding:12px 14px;border:1px solid #cfdfec;background:#f3f9fd;border-radius:12px}.notice.error{color:#9e3131;background:#fff2f2}.lesson-list{display:grid;gap:12px;margin-top:16px}.lesson{display:grid;grid-template-columns:1.3fr 1.3fr auto;align-items:end;gap:12px;padding:16px;border:1px solid #d5e2ed;border-radius:14px;background:#fff}.lesson strong{display:block;color:#1c507c}.lesson p{margin:3px 0 0;color:#5d758b}.lesson button{width:auto}.section-title{margin-top:30px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #dde8f0;text-align:left}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions>*{width:auto}@media(max-width:760px){.page{padding:14px}.filters,.lesson{grid-template-columns:1fr}}@media print{@page{size:A4 portrait;margin:15mm}.app-topbar,.filters,.notice,.lesson-list,.actions,.lead{display:none!important}.page{padding:0}h1{text-align:center;font-size:20pt}table{font-size:16pt}th,td{border:1px solid #aaa}.section-title{margin-top:15mm}}
</style></head><body><div class="app-topbar"><div class="brand"><div class="brand-mark"><img src="/logo.jpg" alt="ตราโรงเรียน"></div>โรงเรียนบ้านป่าเด็ง</div><div class="app-user"><a href="/dashboard.html">← กลับหน้าหลัก</a></div></div><main class="page"><h1>จัดครูสอนแทน</h1><p class="lead">เลือกครูที่ไม่อยู่ ระบบจะแสดงคาบจากตารางที่เผยแพร่และเฉพาะครูที่ว่างในคาบนั้น</p>
<div class="filters"><label>วันที่<input type="date" id="date"></label><label>ครูที่ไม่อยู่<select id="absentTeacher"></select></label><button class="btn btn-primary" id="find">ค้นหาคาบ</button></div><div class="notice" id="status" role="status">กำลังตรวจข้อมูลครู...</div><div class="lesson-list" id="lessons"></div>
<h2 class="section-title">คำสั่งสอนแทนประจำวัน <span id="printDate"></span></h2><div class="actions"><button class="btn btn-ghost" id="print">พิมพ์คำสั่งสอนแทน</button><a class="btn btn-ghost" href="/timetable.html">เปิดตารางสอน</a><a class="btn btn-ghost" href="/import-center.html?template=staff&amp;download=1">แม่แบบข้อมูลครู</a></div><div class="table-wrap" id="assignments"></div></main>
<script src="/js/api.js"></script><script>
(()=>{const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);let me=null,coverage=null;
function say(message,error=false){$("status").textContent=message;$("status").classList.toggle("error",error)}
async function loadAssignments(){const date=$("date").value;if(!date)return;$("printDate").textContent=date;const data=await apiRequest(`/api/substitutes/assignments?date=${encodeURIComponent(date)}`);$("assignments").innerHTML=data.assignments.length?`<table><thead><tr><th>คาบ</th><th>ชั้น/ห้อง</th><th>วิชา</th><th>ครูที่ไม่อยู่</th><th>ครูสอนแทน</th></tr></thead><tbody>${data.assignments.map(a=>`<tr><td>${a.period}</td><td>${esc(a.grade_level)}/${esc(a.classroom)}</td><td>${esc(a.subject)}</td><td>${esc(a.absent_name)}</td><td>${esc(a.substitute_name)}</td></tr>`).join("")}</tbody></table>`:'<div class="notice">ยังไม่มีคำสั่งสอนแทนในวันนี้</div>'}
async function find(){const date=$("date").value,teacher=$("absentTeacher").value;if(!date||!teacher){say("เลือกวันที่และครูก่อน",true);return}
try{coverage=await apiRequest(`/api/substitutes/coverage?date=${encodeURIComponent(date)}&teacher_id=${teacher}`);const lessons=coverage.lessons;$("lessons").innerHTML=lessons.length?lessons.map(l=>`<div class="lesson" data-entry="${l.id}"><div><strong>คาบ ${l.period} · ${esc(l.subject)}</strong><p>${esc(l.grade_level)}/${esc(l.classroom)}${l.room_name?` · ${esc(l.room_name)}`:""}</p></div><label>ครูที่ว่าง<select ${l.assignment_id||!me.is_admin?"disabled":""}><option value="">${l.assignment_id?esc(l.substitute_name):l.available_teachers.length?"เลือกครูสอนแทน":"ไม่มีครูว่าง"}</option>${l.assignment_id?"":l.available_teachers.map(t=>`<option value="${t.id}">${esc(t.full_name)}</option>`).join("")}</select></label>${l.assignment_id?'<span>มอบหมายแล้ว</span>':me.is_admin?`<button type="button" class="btn btn-primary" ${l.available_teachers.length?"":"disabled"}>บันทึก</button>`:""}</div>`).join(""):'<div class="notice">ครูคนนี้ไม่มีคาบในวันที่เลือกตามตารางที่เผยแพร่</div>';
$("lessons").querySelectorAll(".lesson button").forEach(button=>button.onclick=async()=>{const card=button.closest(".lesson"),subId=Number(card.querySelector("select").value);if(!subId){say("เลือกครูสอนแทนก่อน",true);return}button.disabled=true;try{await apiRequest("/api/substitutes/assignments",{method:"POST",body:{date,teacher_id:Number(teacher),entry_id:Number(card.dataset.entry),substitute_teacher_id:subId}});await Promise.all([find(),loadAssignments()]);say("บันทึกครูสอนแทนแล้ว")}catch(e){say(e.message,true);button.disabled=false}});
say(`พบ ${lessons.length} คาบ · ภาคเรียน ${coverage.term.name} ปี ${coverage.term.year_be}`);await loadAssignments();
}catch(e){coverage=null;$("lessons").innerHTML="";say(e.message,true)}}
$("find").onclick=find;$("date").onchange=()=>{coverage=null;$("lessons").innerHTML="";loadAssignments().catch(e=>say(e.message,true))};$("print").onclick=()=>window.print();
(async()=>{const [auth,staff]=await Promise.all([apiRequest("/api/auth/me"),apiRequest("/api/staff")]);me=auth.user;if(!me){location.href="/login.html";return}$("date").value=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Bangkok"});$("absentTeacher").innerHTML='<option value="">เลือกครูที่ไม่อยู่</option>'+staff.staff.map(p=>`<option value="${p.id}">${esc(p.full_name)}</option>`).join("");say(staff.staff.length?"เลือกวันที่และครู แล้วกดค้นหาคาบ":"ยังไม่มีทะเบียนครู กรุณาดาวน์โหลดแม่แบบข้อมูลครู",!staff.staff.length);await loadAssignments()})().catch(e=>say(e.message,true));
})();</script></body></html>
