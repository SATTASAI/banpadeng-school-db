<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>จัดครูสอนแทน — โรงเรียนบ้านป่าเด็ง</title><link rel="stylesheet" href="/css/style.css"><style>
  .page{max-width:1100px;margin:auto;padding:24px}.page h1{color:#163e67}.lead{color:#607991}.filters{display:grid;grid-template-columns:1fr 1.5fr auto;gap:12px;align-items:end;margin:20px 0}.filters label{display:grid;gap:5px}.filters label[hidden],.filters [hidden]{display:none}.filters input,.filters select,.lesson select,.lesson input{width:100%;padding:10px;border:1px solid #cbdbe8;border-radius:10px;background:#fff;font:inherit}.filters button{width:auto}.notice{padding:12px 14px;border:1px solid #cfdfec;background:#f3f9fd;border-radius:12px}.notice.error{color:#9e3131;background:#fff2f2}.lesson-list{display:grid;gap:12px;margin-top:16px}.lesson{display:grid;grid-template-columns:1.3fr 1.3fr auto;align-items:end;gap:12px;padding:16px;border:1px solid #d5e2ed;border-radius:14px;background:#fff}.lesson.assigned{border-color:#b9dcc4;background:#f6fcf8}.lesson strong{display:block;color:#1c507c}.lesson p{margin:3px 0 0;color:#5d758b}.lesson button{width:auto}.lesson .done{color:#1f7a45;font-weight:600}.lesson .row-actions{display:flex;gap:8px;flex-wrap:wrap}.section-title{margin-top:30px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #dde8f0;text-align:left}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions>*{width:auto}
  .mode{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.mode button{width:auto;padding:9px 16px;border-radius:999px;border:1px solid #cbdbe8;background:#fff;color:#1c507c;font:inherit;cursor:pointer}.mode button.active{background:#1c507c;color:#fff;border-color:#1c507c}
  .btn-danger{background:#fff;color:#a12f2f;border:1px solid #e6b9b9}.btn-danger:hover{background:#fff2f2}.cell-actions button{width:auto;padding:6px 10px;font-size:13px}
  @media(max-width:760px){.page{padding:14px}.filters,.lesson{grid-template-columns:1fr}}@media print{@page{size:A4 portrait;margin:15mm}.app-topbar,.filters,.notice,.lesson-list,.actions,.lead,.mode,.cell-actions{display:none!important}.page{padding:0}h1{text-align:center;font-size:20pt}table{font-size:16pt}th,td{border:1px solid #aaa}.section-title{margin-top:15mm}}
</style></head><body><div class="app-topbar"><div class="brand"><div class="brand-mark"><img src="/logo.jpg" alt="ตราโรงเรียน"></div>โรงเรียนบ้านป่าเด็ง</div><div class="app-user"><a href="/dashboard.html">← กลับหน้าหลัก</a></div></div><main class="page"><h1>จัดสอนแทน</h1><p class="lead">เลือกครูที่ไม่อยู่ (จากใบลา หรือกรณีไปราชการ/อบรมที่ไม่มีใบลา) ระบบดึงคาบจากตารางสอนที่เผยแพร่ และแสดงครูที่ว่างในคาบนั้นให้เลือก ครูสอนแทนได้รับแจ้งทางกระดิ่งและ LINE</p>
<div class="mode" role="group" aria-label="ประเภทการไม่อยู่"><button type="button" class="active" id="modeLeave">จากใบลา</button><button type="button" id="modeOther">ไม่มีใบลา (ไปราชการ / อบรม / อื่น ๆ)</button></div>
<div class="filters"><label>วันที่<input type="date" id="date"></label><label id="leaveWrap">ครูที่ลา / ใบลา<select id="absentTeacher"></select></label><label id="otherWrap" hidden>ครูที่ไม่อยู่<select id="otherTeacher"></select></label><button class="btn btn-primary" id="find">ค้นหาคาบ</button></div>
<div class="filters" id="reasonRow" hidden><label>เหตุที่ไม่อยู่<select id="reasonType"><option value="ไปราชการ">ไปราชการ</option><option value="อบรม/ประชุม/สัมมนา">อบรม / ประชุม / สัมมนา</option><option value="พานักเรียนไปร่วมกิจกรรม/แข่งขัน">พานักเรียนไปร่วมกิจกรรม / แข่งขัน</option><option value="ปฏิบัติหน้าที่อื่นที่ได้รับมอบหมาย">ปฏิบัติหน้าที่อื่นที่ได้รับมอบหมาย</option><option value="other">อื่น ๆ (ระบุ)</option></select></label><label id="reasonTextWrap" hidden>ระบุเหตุผล<input id="reasonText" maxlength="200" placeholder="เช่น ไปส่งเอกสารที่ สพป."></label></div>
<div class="notice" id="status" role="status">กำลังโหลดข้อมูลการลา...</div><div class="notice" id="leaveInfo" hidden></div><div class="lesson-list" id="lessons"></div>
<h2 class="section-title">คำสั่งสอนแทนประจำวัน <span id="printDate"></span></h2><div class="actions"><button class="btn btn-primary" id="exportDocx" disabled>ดาวน์โหลด Word (.docx)</button><button class="btn btn-primary" id="exportPdf" disabled>ดาวน์โหลด PDF</button><button class="btn btn-ghost" id="print">พิมพ์คำสั่งสอนแทน</button><a class="btn btn-ghost" href="/timetable.html">เปิดตารางสอน</a><a class="btn btn-ghost" href="/substitute-stats.html">สถิติการสอนแทน</a></div><div class="filters"><label>เลขที่คำสั่ง<input id="orderNumber" placeholder="เช่น 123/2569" maxlength="100"></label><label>ชื่อผู้อำนวยการ<input id="directorName" placeholder="ดึงจากทะเบียนบุคลากร" readonly aria-readonly="true"></label><label>วันที่ออกคำสั่ง<input type="date" id="issueDate"></label></div><div class="table-wrap" id="assignments"></div></main>
<script src="/js/api.js"></script><script src="/js/substitute-order-export.js"></script><script>
(()=>{const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);let me=null,coverage=null,assignments=[],leaveRequests=[],dayTeachers=[],mode='leave',loadVersion=0,searchVersion=0;
const leaveTypes={sick:"ลาป่วย",personal:"ลากิจ",maternity:"ลาคลอด",lenient:"ลาอนุโลม",other:"ลาอื่น ๆ"};
function say(message,error=false){$("status").textContent=message;$("status").classList.toggle("error",error)}
function reasonValue(){return $("reasonType").value==='other'?String($("reasonText").value||'').trim():$("reasonType").value}
async function loadAssignments(){const date=$("date").value;if(!date)return;$("printDate").textContent=date;$("exportDocx").disabled=$("exportPdf").disabled=true;assignments=[];$("assignments").innerHTML='<div class="notice">กำลังโหลดคำสั่งสอนแทน...</div>';const data=await apiRequest(`/api/substitutes/assignments?date=${encodeURIComponent(date)}`);if(date!==$("date").value)return;assignments=data.assignments;$("exportDocx").disabled=$("exportPdf").disabled=!assignments.length;
 $("assignments").innerHTML=data.assignments.length?`<table><thead><tr><th>คาบ</th><th>ชั้น/ห้อง</th><th>วิชา</th><th>ครูที่ไม่อยู่</th><th>ครูสอนแทน</th><th>อ้างอิง</th><th class="cell-actions"></th></tr></thead><tbody>${data.assignments.map(a=>`<tr><td>${a.period}</td><td>${esc(a.grade_level)}/${esc(a.classroom)}</td><td>${esc(a.subject)}</td><td>${esc(a.absent_name)}</td><td>${esc(a.substitute_name)}</td><td>${a.leave_request_id?`ใบลา #${a.leave_request_id} · ${a.leave_status==='approved'?'อนุมัติแล้ว':a.leave_status==='pending'?'รอพิจารณา':'ไม่อนุมัติ — ตรวจคำสั่ง'}`:esc(a.absence_reason||"ไม่ได้ผูกใบลา")}</td><td class="cell-actions">${me?.can_manage_substitutes?`<button type="button" class="btn btn-danger" data-cancel="${a.id}">ยกเลิก</button>`:''}</td></tr>`).join("")}</tbody></table>`:'<div class="notice">ยังไม่มีคำสั่งสอนแทนในวันนี้</div>';
 $("assignments").querySelectorAll("[data-cancel]").forEach(button=>button.onclick=()=>cancel(Number(button.dataset.cancel),button));
}
async function cancel(id,button){const a=assignments.find(x=>x.id===id)||(coverage?.lessons||[]).map(l=>({id:l.assignment_id,period:l.period,substitute_name:l.substitute_name})).find(x=>x.id===id);
 if(!confirm(`ยกเลิกการสอนแทนคาบ ${a?.period??''} ของ ${a?.substitute_name??'ครู'} ใช่ไหม?\nระบบจะแจ้งครูท่านนี้ว่าไม่ต้องเข้าสอนแทนคาบนี้`))return;
 button.disabled=true;try{await apiRequest(`/api/substitutes/assignments/${id}`,{method:'DELETE'});await Promise.all([coverage?find():null,loadAssignments()]);say("ยกเลิกการสอนแทนแล้ว และแจ้งครูที่ถูกยกเลิกแล้ว")}catch(e){say(e.message,true);button.disabled=false}}
function selectedLeave(){return leaveRequests.find(r=>String(r.leave_request_id)===$("absentTeacher").value)}
function selectedAbsent(){if(mode==='other'){const t=dayTeachers.find(x=>String(x.id)===$("otherTeacher").value);return t?{teacher_id:t.id,full_name:t.full_name,leave:null}:null}const r=selectedLeave();return r?{teacher_id:r.teacher_id,full_name:r.full_name,leave:r}:null}
function showLeave(){if(mode==='other'){const t=selectedAbsent();$("leaveInfo").hidden=!t;if(t)$("leaveInfo").textContent=`${t.full_name} · ไม่มีใบลา — ระบุเหตุที่ไม่อยู่ด้านบน แล้วเลือกเฉพาะคาบที่ต้องสอนแทน`;return}
 const r=selectedLeave();$("leaveInfo").hidden=!r;if(!r)return;
 $("leaveInfo").textContent=`${r.full_name} · ${leaveTypes[r.leave_type]||r.leave_type} · ${r.start_date} ถึง ${r.end_date} · ${r.leave_days??"ไม่ระบุ"} วัน · ${r.status==='approved'?'อนุมัติแล้ว':'รอพิจารณา (การจัดสอนแทนไม่ใช่การอนุมัติลา)'} · ใบลา #${r.leave_request_id} — เลือกเฉพาะคาบที่ต้องสอนแทน โดยเฉพาะกรณีลาครึ่งวัน`;
}
async function loadLeaves(){const date=$("date").value,version=++loadVersion;++searchVersion;leaveRequests=[];dayTeachers=[];coverage=null;$("lessons").innerHTML="";$("leaveInfo").hidden=true;$("find").disabled=true;$("absentTeacher").innerHTML='<option value="">กำลังโหลดใบลา...</option>';$("otherTeacher").innerHTML='<option value="">กำลังโหลดรายชื่อครู...</option>';
 try{const data=await apiRequest(`/api/substitutes/leaves?date=${encodeURIComponent(date)}`);if(version!==loadVersion)return;leaveRequests=data.leave_requests||[];
 $("absentTeacher").innerHTML='<option value="">เลือกครูที่ลา</option>'+leaveRequests.map(r=>`<option value="${r.leave_request_id}">${esc(r.full_name)} · ${esc(leaveTypes[r.leave_type]||r.leave_type)} · ${r.status==='approved'?'อนุมัติแล้ว':'รอพิจารณา'} · #${r.leave_request_id}</option>`).join("");
 if(mode==='leave'){$("find").disabled=!leaveRequests.length;say(leaveRequests.length?`พบ ${leaveRequests.length} ใบลาในวันที่เลือก เลือกครูเพื่อจัดสอนแทน`:'ไม่มีใบลาในวันที่เลือก (ไม่รวมรายการไม่อนุมัติหรือยกเลิก) — กรณีไปราชการหรืออบรม เลือก "ไม่มีใบลา"')}
 }catch(e){if(version===loadVersion){$("absentTeacher").innerHTML='<option value="">โหลดใบลาไม่สำเร็จ</option>';say(e.message,true)}}
 if(mode==='other')await loadDayTeachers(version);
}
async function loadDayTeachers(version=loadVersion){const date=$("date").value;if(!date)return;
 try{const data=await apiRequest(`/api/substitutes/teachers?date=${encodeURIComponent(date)}`);if(version!==loadVersion||date!==$("date").value)return;dayTeachers=data.teachers||[];
 const onLeave=new Set(leaveRequests.map(r=>r.teacher_id));
 $("otherTeacher").innerHTML='<option value="">เลือกครูที่ไม่อยู่</option>'+dayTeachers.map(t=>`<option value="${t.id}">${esc(t.full_name)} · ${Number(t.lesson_count)} คาบ${onLeave.has(t.id)?' · มีใบลาวันนี้':''}${t.absence_reason?' · '+esc(t.absence_reason):''}</option>`).join("");
 $("find").disabled=!dayTeachers.length;say(dayTeachers.length?`วันนี้มีครูที่มีคาบสอน ${dayTeachers.length} คน เลือกครูที่ไม่อยู่และระบุเหตุผล`:'ไม่มีคาบสอนในวันที่เลือกตามตารางที่เผยแพร่');
 }catch(e){if(version===loadVersion){dayTeachers=[];$("otherTeacher").innerHTML='<option value="">โหลดรายชื่อไม่สำเร็จ</option>';$("find").disabled=true;say(e.message,true)}}
}
function setMode(next){if(next===mode)return;mode=next;++searchVersion;coverage=null;$("lessons").innerHTML="";$("leaveInfo").hidden=true;
 $("modeLeave").classList.toggle("active",mode==='leave');$("modeOther").classList.toggle("active",mode==='other');
 $("leaveWrap").hidden=mode!=='leave';$("otherWrap").hidden=mode!=='other';$("reasonRow").hidden=mode!=='other';
 if(mode==='other'){$("find").disabled=true;loadDayTeachers()}else{$("find").disabled=!leaveRequests.length;say(leaveRequests.length?`พบ ${leaveRequests.length} ใบลาในวันที่เลือก เลือกครูเพื่อจัดสอนแทน`:'ไม่มีใบลาในวันที่เลือก')}}
function teacherOptions(list,placeholder){return `<option value="">${placeholder}</option>`+list.map(t=>`<option value="${t.id}">${esc(t.full_name)} · สอนแทนสัปดาห์นี้ ${Number(t.week_count||0)} / เดือนนี้ ${Number(t.month_count||0)} คาบ</option>`).join("")}
function lessonCard(l){const can=me?.can_manage_substitutes,where=`${esc(l.grade_level)}/${esc(l.classroom)}${l.room_name?` · ${esc(l.room_name)}`:""}`;
 if(l.assignment_id)return `<div class="lesson assigned" data-entry="${l.id}" data-assignment="${l.assignment_id}"><div><strong>คาบ ${l.period} · ${esc(l.subject)}</strong><p>${where}</p><p class="done">ครูสอนแทน: ${esc(l.substitute_name)}</p></div><label>เปลี่ยนเป็นครู<select data-change ${can?"":"disabled"}>${teacherOptions(l.available_teachers,l.available_teachers.length?"เลือกครูคนใหม่":"ไม่มีครูว่างคนอื่น")}</select></label>${can?`<div class="row-actions"><button type="button" class="btn btn-primary" data-act="change" ${l.available_teachers.length?"":"disabled"}>เปลี่ยน</button><button type="button" class="btn btn-danger" data-act="cancel">ยกเลิก</button></div>`:""}</div>`;
 return `<div class="lesson" data-entry="${l.id}"><div><strong>คาบ ${l.period} · ${esc(l.subject)}</strong><p>${where}</p></div><label>ครูที่ว่าง<select ${can?"":"disabled"}>${teacherOptions(l.available_teachers,l.available_teachers.length?"เลือกครูสอนแทน":"ไม่มีครูว่าง")}</select></label>${can?`<button type="button" class="btn btn-primary" data-act="assign" ${l.available_teachers.length?"":"disabled"}>บันทึก</button>`:""}</div>`}
async function find(){const date=$("date").value,absent=selectedAbsent(),leave=absent?.leave||null,teacher=absent?.teacher_id,version=++searchVersion;if(!date||!teacher){say(mode==='other'?"เลือกวันที่และครูที่ไม่อยู่ก่อน":"เลือกวันที่และใบลาก่อน",true);return}showLeave();
try{const data=await apiRequest(`/api/substitutes/coverage?date=${encodeURIComponent(date)}&teacher_id=${teacher}`);if(version!==searchVersion||date!==$("date").value||teacher!==selectedAbsent()?.teacher_id)return;coverage=data;const lessons=coverage.lessons;$("lessons").innerHTML=lessons.length?lessons.map(lessonCard).join(""):'<div class="notice">ครูคนนี้ไม่มีคาบในวันที่เลือกตามตารางที่เผยแพร่</div>';
$("lessons").querySelectorAll('.lesson button[data-act="assign"]').forEach(button=>button.onclick=async()=>{const card=button.closest(".lesson"),subId=Number(card.querySelector("select").value);if(!subId){say("เลือกครูสอนแทนก่อน",true);return}
 const reason=leave?null:reasonValue();if(!leave&&!reason){say("ระบุเหตุที่ครูไม่อยู่ก่อนบันทึก",true);return}
 button.disabled=true;try{await apiRequest("/api/substitutes/assignments",{method:"POST",body:leave?{date,leave_request_id:leave.leave_request_id,teacher_id:Number(teacher),entry_id:Number(card.dataset.entry),substitute_teacher_id:subId}:{date,leave_request_id:null,reason,teacher_id:Number(teacher),entry_id:Number(card.dataset.entry),substitute_teacher_id:subId}});await Promise.all([find(),loadAssignments()]);say("บันทึกครูสอนแทนแล้ว ระบบแจ้งครูสอนแทนทางกระดิ่งและ LINE")}catch(e){say(e.message,true);button.disabled=false}});
$("lessons").querySelectorAll('.lesson button[data-act="change"]').forEach(button=>button.onclick=async()=>{const card=button.closest(".lesson"),subId=Number(card.querySelector("select[data-change]").value);if(!subId){say("เลือกครูคนใหม่ก่อน",true);return}
 button.disabled=true;try{await apiRequest(`/api/substitutes/assignments/${card.dataset.assignment}`,{method:"PATCH",body:{substitute_teacher_id:subId}});await Promise.all([find(),loadAssignments()]);say("เปลี่ยนครูสอนแทนแล้ว ระบบแจ้งทั้งครูคนเดิมและครูคนใหม่")}catch(e){say(e.message,true);button.disabled=false}});
$("lessons").querySelectorAll('.lesson button[data-act="cancel"]').forEach(button=>button.onclick=()=>cancel(Number(button.closest(".lesson").dataset.assignment),button));
say(`พบ ${lessons.length} คาบ · ภาคเรียน ${coverage.term.name} ปี ${coverage.term.year_be}`);await loadAssignments();
}catch(e){if(version===searchVersion){coverage=null;$("lessons").innerHTML="";say(e.message,true)}}}
async function exportOrder(format){const buttons=[$("exportDocx"),$("exportPdf")];buttons.forEach(b=>b.disabled=true);try{const latest=await apiRequest('/api/staff');const directorName=SubstituteOrderExport.director(latest.staff);$("directorName").value=directorName;await SubstituteOrderExport.exportFile(format,assignments,{date:$("date").value,issue_date:$("issueDate").value,order_number:$("orderNumber").value,director_name:directorName});say(format==='print'?'เปิดคำสั่งสำหรับพิมพ์แล้ว':'ดาวน์โหลดคำสั่งสอนแทนแล้ว')}catch(e){say(e.message,true)}finally{buttons.forEach(b=>b.disabled=!assignments.length)}}
$("exportDocx").onclick=()=>exportOrder('docx');$("exportPdf").onclick=()=>exportOrder('pdf');
$("modeLeave").onclick=()=>setMode('leave');$("modeOther").onclick=()=>setMode('other');
$("reasonType").onchange=()=>{$("reasonTextWrap").hidden=$("reasonType").value!=='other'};
$("find").onclick=find;$("date").onchange=()=>{Promise.all([loadLeaves(),loadAssignments()]).catch(e=>say(e.message,true))};$("absentTeacher").onchange=()=>{++searchVersion;coverage=null;$("lessons").innerHTML="";showLeave();if(selectedLeave())find()};
$("otherTeacher").onchange=()=>{++searchVersion;coverage=null;$("lessons").innerHTML="";showLeave();if(selectedAbsent())find()};$("print").onclick=()=>exportOrder('print');
(async()=>{const auth=await apiRequest('/api/auth/me');me=auth.user;if(!me){location.href='/login.html';return}const permission=await apiRequest('/api/substitutes/permissions');me.can_manage_substitutes=permission.can_manage;
if(!permission.can_manage){document.querySelectorAll('.filters,.actions,.mode').forEach(e=>e.style.display='none');say('เฉพาะเจ้าหน้าที่ฝ่ายบุคลากรหรือผู้ดูแลระบบเท่านั้น',true);return}
const staff=await apiRequest('/api/staff');$("date").value=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Bangkok"});$("issueDate").value=$("date").value;try{$("directorName").value=SubstituteOrderExport.director(staff.staff)}catch(e){$("directorName").placeholder=e.message;}await loadLeaves();await loadAssignments()})().catch(e=>say(e.message,true));
})();</script></body></html>
