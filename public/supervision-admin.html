<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>นิเทศการสอน — โรงเรียนบ้านป่าเด็ง</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/supervision.css"><link rel="stylesheet" href="/css/mobile.css"></head>
<body><div class="app-topbar"><div class="brand"><div class="brand-mark"><img src="/logo.jpg" alt="ตราโรงเรียน"></div>โรงเรียนบ้านป่าเด็ง</div><div class="app-user"><a href="/dashboard.html">← กลับหน้าหลัก</a></div></div>
<main class="sv-page">
 <div class="sv-head"><div><h1>นิเทศการสอน</h1><p class="sv-lead" id="lead">คำขอรับการนิเทศจากครู การรับนิเทศ การบันทึกคะแนน และผลการนิเทศ</p></div></div>
 <div class="sv-tabs" role="tablist" id="tabs"></div>
 <div id="view"><div class="sv-notice">กำลังโหลด...</div></div>
</main>
<script src="/js/api.js"></script><script src="/js/supervision-ui.js"></script>
<script>
(()=>{
const U=SupervisionUI,{esc}=U,$=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const state={perm:null,view:params.get('view'),filter:'all',teacher:'all',sumType:'all',list:[],draft:null,focus:Number(params.get('request'))||null};
const TABS=[['requests','คำขอนิเทศ',p=>p.evaluate],['evaluate','บันทึกคะแนน',p=>p.evaluate],['results','ผลการนิเทศ',p=>p.view_all||p.evaluate],['summary','ประเมินผลการนิเทศ',p=>p.view_all],['evaluators','ผู้มีสิทธิ์ประเมิน',p=>p.manage_evaluators],['away','วันไม่ว่าง',p=>p.evaluate]];
const allowed=()=>TABS.filter(t=>t[2](state.perm));
const sortAsc=(a,b)=>a.visit_date===b.visit_date?a.period-b.period:a.visit_date<b.visit_date?-1:1;
const me=()=>state.perm.user.id;

function renderTabs(){
 const mineOpen=state.list.filter(r=>r.status==='confirmed'&&r.supervisor_user_id===me()).length,pend=state.list.filter(r=>r.status==='pending').length;
 $('tabs').innerHTML=allowed().map(([k,l])=>`<button type="button" role="tab" data-tab="${k}" aria-selected="${state.view===k}">${l}${k==='requests'&&pend?`<span class="count">${pend}</span>`:''}${k==='evaluate'&&mineOpen?`<span class="count">${mineOpen}</span>`:''}</button>`).join('');
}
async function load(){if(state.perm.evaluate||state.perm.view_all)state.list=(await apiRequest('/api/supervision/requests?scope=all')).requests;}
async function render(reload=true){
 try{
  if(reload)await load();renderTabs();
  await ({requests:viewRequests,evaluate:viewEvaluate,results:viewResults,summary:viewSummary,evaluators:viewEvaluators,away:viewAway})[state.view]();
 }catch(e){$('view').innerHTML=`<div class="sv-notice error">${esc(e.message)}</div>`;}
}
/* ---------- คำขอนิเทศ ---------- */
function clashFor(r){return state.list.find(x=>x.id!==r.id&&x.supervisor_user_id===me()&&['confirmed','evaluated'].includes(x.status)&&x.visit_date===r.visit_date&&x.period===r.period);}
function reqRow(r){
 let acts='',owner='';
 if(r.status==='pending'){
  const clash=clashFor(r);
  if(r.teacher_user_id===me()){owner='<span class="owner">คำขอของคุณเอง — ให้ผู้บริหารท่านอื่นรับนิเทศ</span>';}
  else if(clash){acts=`<button type="button" class="sv-btn sm primary" disabled>รับนิเทศ</button>`;owner=`<span class="sv-conflict">คุณรับนิเทศ ${esc(clash.teacher_name)} ในวันและคาบเดียวกันไว้แล้ว</span>`;}
  else{acts=`<button type="button" class="sv-btn sm primary" data-accept="${r.id}">รับนิเทศ</button>`;owner='<span class="owner">ยังไม่มีผู้รับผิดชอบ</span>';}
 }else if(r.status==='confirmed'){
  if(r.supervisor_user_id===me()){acts=`<button type="button" class="sv-btn sm" data-release="${r.id}">ถอนการรับ</button><button type="button" class="sv-btn sm primary" data-eval="${r.id}">บันทึกคะแนน</button>`;owner=`<span class="owner">ผู้รับผิดชอบ: <b>คุณ</b></span>`;}
  else owner=`<span class="owner">ผู้รับผิดชอบ: <b>${esc(r.supervisor_name)}</b></span>`;
 }else{
  owner=`<span class="owner">นิเทศโดย <b>${esc(r.supervisor_name)}</b>${r.evaluation?` · ${U.pct(r.evaluation.percent)}% ${esc(r.evaluation.level)}`:''}</span>`;
  if(r.evaluation)acts=`<button type="button" class="sv-btn sm" data-result="${r.id}">ดูผล</button>`;
 }
 return `<div class="sv-row${state.focus===r.id?' focus':''}" id="q-${r.id}"><div class="when"><b>${U.date(r.visit_date)}</b><small>คาบ ${r.period}</small><div style="margin-top:4px;font-weight:600">${esc(r.teacher_name)}</div></div>
  <div class="meta"><div class="line"><span>${esc(r.subject)}</span>${U.classLabel(r)?`<span class="sv-tag">${esc(U.classLabel(r))}</span>`:''}<span class="sv-tag">${esc(r.type_label)}</span></div>
  <div class="topic">${r.topic?'หัวข้อที่ต้องการข้อเสนอแนะ: '+esc(r.topic):'ไม่ได้ระบุหัวข้อเพิ่มเติม'}</div><div class="line">${U.pill(r.status)}${U.overdue(r)}${owner}</div></div><div class="acts">${acts}</div></div>`;
}
function viewRequests(){
 const all=[...state.list].sort(sortAsc),f=state.filter;
 const list=f==='all'?all:f==='mine'?all.filter(r=>r.supervisor_user_id===me()):all.filter(r=>r.status===f);
 const chip=(k,l)=>`<button type="button" class="sv-chip" data-filter="${k}" aria-pressed="${f===k}">${l}</button>`;
 $('view').innerHTML=U.stats(all)+`<section class="sv-card" style="display:flex;flex-direction:column;gap:14px;margin-top:16px">
  <div class="sv-chips" role="group" aria-label="กรองสถานะ">${chip('all','ทั้งหมด')}${chip('pending','รอผู้บริหารรับนิเทศ')}${chip('confirmed','ยืนยันนัดหมายแล้ว')}${chip('evaluated','ประเมินแล้ว')}${chip('mine','ที่ฉันรับผิดชอบ')}</div>
  <div class="sv-list">${list.length?list.map(reqRow).join(''):`<div class="sv-empty"><b>${all.length?'ไม่มีรายการในสถานะนี้':'ยังไม่มีคำขอนิเทศ'}</b>${all.length?'ลองเลือกตัวกรองอื่น':'เมื่อครูลงทะเบียนรับการนิเทศ รายการจะแสดงที่นี่และมีแจ้งเตือน'}</div>`}</div></section>`;
 if(state.focus)document.getElementById('q-'+state.focus)?.scrollIntoView({block:'center'});
}
async function act(id,action,okMessage){
 try{await apiRequest(`/api/supervision/requests/${id}/${action}`,{method:'POST',body:{}});U.toast(okMessage);}catch(e){U.toast(e.message,true);}
 await render();
}
/* ---------- บันทึกคะแนน ---------- */
function viewEvaluate(){
 const mine=state.list.filter(r=>r.status==='confirmed'&&r.supervisor_user_id===me()).sort(sortAsc);
 if(state.draft&&!mine.some(r=>r.id===state.draft.id))state.draft=null;
 if(!state.draft&&mine.length===1)state.draft={id:mine[0].id,scores:Array(state.perm.form.sections.reduce((a,x)=>a+x.items.length,0)).fill(null),suggestion:''};
 if(!mine.length){$('view').innerHTML=`<section class="sv-card"><div class="sv-empty"><b>ยังไม่มีนัดหมายที่รอบันทึกคะแนน</b>ไปที่แท็บ “คำขอนิเทศ” แล้วกดรับนิเทศก่อน<div style="margin-top:12px"><button type="button" class="sv-btn primary" data-tab="requests">ไปที่คำขอนิเทศ</button></div></div></section>`;return;}
 const d=state.draft;
 const sel=`<label class="sv-field">นัดหมายที่คุณรับนิเทศไว้ (${mine.length} รายการ)<select id="evalSel"><option value="">— เลือกครูและนัดหมาย —</option>${mine.map(r=>`<option value="${r.id}"${d?.id===r.id?' selected':''}>${esc(r.teacher_name)} · ${U.date(r.visit_date)} คาบ ${r.period} · ${esc(r.type_label)}</option>`).join('')}</select></label>`;
 if(!d){$('view').innerHTML=`<section class="sv-card">${sel}</section>`;return;}
 const r=state.list.find(x=>x.id===d.id),secs=state.perm.form.sections;let n=0;
 $('view').innerHTML=`<section class="sv-card" style="display:flex;flex-direction:column;gap:14px">${sel}
  <div class="sv-info"><div><span>ครูผู้รับการนิเทศ</span>${esc(r.teacher_name)}</div><div><span>วันที่ / คาบ</span>${U.date(r.visit_date)} · คาบ ${r.period}</div><div><span>วิชา / ชั้น</span>${esc(r.subject)}${U.classLabel(r)?' · '+esc(U.classLabel(r)):''}</div><div><span>ประเภท</span>${esc(r.type_label)}</div>
  ${r.topic?`<div style="grid-column:1/-1"><span>หัวข้อที่ครูต้องการรับข้อเสนอแนะ</span>${esc(r.topic)}</div>`:''}</div></section>
  <div class="sv-eval" style="margin-top:16px"><section class="sv-card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><h2 style="margin:0;color:#163e67;font-size:19px">แบบประเมิน${esc(state.perm.form.label.replace('นิเทศ',''))}</h2><span class="sv-hint">1 = ต้องปรับปรุง · 3 = ดี · 5 = ดีเยี่ยม</span></div>
  <div>${secs.map(sec=>`<h3 style="margin:16px 0 4px;color:#163e67;font-size:16px">${esc(sec.label)}</h3>`+sec.items.map(q=>{const i=n++;return `<div class="sv-item"><div class="q"><span class="n">${i+1}</span><span>${esc(q)}</span></div><div class="sv-scale" role="radiogroup" aria-label="${esc(q)}">${[1,2,3,4,5].map(v=>`<input type="radio" name="s${i}" id="s${i}v${v}" value="${v}"${d.scores[i]===v?' checked':''}><label for="s${i}v${v}">${v}</label>`).join('')}</div></div>`;}).join('')).join('')}</div>
  <label class="sv-field" style="margin-top:8px">ข้อเสนอแนะเพื่อพัฒนา<textarea id="sugg" maxlength="3000" placeholder="จุดเด่นที่พบ และสิ่งที่ควรพัฒนาต่อ">${esc(d.suggestion)}</textarea></label></section>
  <aside class="sv-card sv-summary" id="summary" aria-live="polite"></aside></div>`;
 summary();
}
function summary(){
 const box=$('summary');if(!box||!state.draft)return;const s=state.draft.scores;
 const N=s.length,M=state.perm.max_score,done=s.filter(v=>v!=null).length,total=s.reduce((a,v)=>a+(v||0),0),p=total/M*100,complete=done===N;
 box.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0;color:#163e67">สรุปผล</h3>${complete?'<span class="sv-pill st-evaluated">ครบทุกข้อ</span>':'<span class="sv-prov">ผลชั่วคราว</span>'}</div>
  <div class="sv-big"><b>${U.pct(p)}</b><span style="color:#607991">ร้อยละ</span></div><div class="sv-bar"><i style="width:${p}%"></i></div>
  <div><div class="sv-kv"><span>ประเมินแล้ว</span><b>${done} / ${N} ข้อ</b></div><div class="sv-kv"><span>คะแนนรวม</span><b>${total} / ${M}</b></div><div class="sv-kv"><span>ระดับคุณภาพ</span><span class="lv lv-${U.level(p)}">${done?U.level(p):'—'}</span></div></div>
  ${complete?'':'<p class="sv-hint">ยังให้คะแนนไม่ครบ ผลนี้เป็นผลชั่วคราว ต้องให้คะแนนครบ ${N} ข้อจึงบันทึกได้</p>'}
  <button type="button" class="sv-btn primary" id="saveEval"${complete?'':' disabled'}>บันทึกผลการนิเทศ</button>
  <p class="sv-hint">เกณฑ์: ร้อยละ 90 ขึ้นไป ดีเยี่ยม · 80–89 ดีมาก · 70–79 ดี · 60–69 พอใช้ · ต่ำกว่า 60 ควรพัฒนา</p>`;
 $('saveEval').onclick=saveEval;
}
async function saveEval(){
 const d=state.draft,btn=$('saveEval');btn.disabled=true;
 try{await apiRequest(`/api/supervision/requests/${d.id}/evaluate`,{method:'POST',body:{scores:d.scores,suggestion:d.suggestion}});
  U.toast('บันทึกผลการนิเทศแล้ว ครูจะเห็นผลและข้อเสนอแนะทันที');state.focus=d.id;state.draft=null;state.view='results';await render();
 }catch(e){U.toast(e.message,true);btn.disabled=false;}
}
/* ---------- ผลการนิเทศ ---------- */
/* ---------- ปฏิทินการจองนิเทศของครูทุกคน (รายสัปดาห์ วัน × คาบ) ---------- */
const addD=(s,n)=>{const d=U.parse(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
async function calendarHtml(){
 const w=await apiRequest('/api/supervision/week'+(state.calStart?`?start=${state.calStart}`:''));state.calStart=w.start;state.calWeek=w;
 const times=(w.terms[0]?.times)||w.default_times,dates=w.days.map(d=>d.date);
 const booked=state.list.filter(r=>dates.includes(r.visit_date));
 let head='<th class="pcol">วัน</th>';for(let p=1;p<=6;p++)head+=`<th><b>คาบ ${p}</b><span style="color:#607991">${times[p-1].start}–${times[p-1].end}</span></th>`;
 const rows=w.days.map(d=>{
  let tr=`<tr${d.date===w.now.date?' class="today"':''}><th class="pcol" scope="row"><b>${U.DAYS[d.weekday]}</b>${U.shortDate(d.date)}${d.holiday?`<small style="display:block;color:${d.holiday.kind==='activity'?'#187E6B':'#c8483d'}">${d.holiday.kind==='activity'?'วันกิจกรรม':'วันหยุด'}</small>`:''}</th>`;
  for(let p=1;p<=6;p++){
   const list=booked.filter(r=>r.visit_date===d.date&&r.period===p);
   if(!d.term_id){tr+='<td><div class="sv-slot off">นอกภาคเรียน</div></td>';continue;}
   if(d.holiday?.kind==='holiday'){tr+=`<td><div class="sv-slot off">วันหยุด</div></td>`;continue;}
   tr+=list.length?`<td><button type="button" class="sv-slot booked ${list.every(r=>r.status==='evaluated')?'evaluated':list.some(r=>r.status==='pending')?'pending':'confirmed'}" data-calslot="${d.date}|${p}"><b>${list.length} คน</b>${list.slice(0,3).map(r=>`<small>${esc(r.teacher_name)}</small>`).join('')}</button></td>`
    :'<td><div class="sv-slot none" aria-hidden="true">·</div></td>';
  }
  return tr+'</tr>';
 }).join('');
 const lbl=`${U.shortDate(dates[0])} – ${U.parse(dates[4]).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}`;
 return `<section class="sv-card" style="display:flex;flex-direction:column;gap:14px;margin-top:16px"><h2 style="margin:0;color:#163e67;font-size:19px">ปฏิทินการจองนิเทศ</h2>
  <div class="sv-weekbar"><button type="button" class="sv-btn sm" data-calweek="-7" aria-label="สัปดาห์ก่อน">‹</button><b>${lbl}</b><button type="button" class="sv-btn sm" data-calweek="7" aria-label="สัปดาห์ถัดไป">›</button>
  <button type="button" class="sv-btn sm" data-calweek="0">สัปดาห์ปัจจุบัน</button><span class="meta">ลงทะเบียน ${booked.length} คาบ · กดที่คาบเพื่อดูรายชื่อ</span></div>
  <div class="sv-legend"><span><i style="background:#fff1dc"></i>มีรายการรอผู้รับนิเทศ</span><span><i style="background:#e6f0fb"></i>ยืนยันแล้ว</span><span><i style="background:#e3f4ec"></i>ประเมินครบแล้ว</span></div>
  <div class="sv-scroll"><table class="sv-grid"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
function openCalSlot(key){
 const [date,p]=key.split('|'),period=Number(p),list=state.list.filter(r=>r.visit_date===date&&r.period===period).sort((a,b)=>a.teacher_name.localeCompare(b.teacher_name,'th'));
 const t=((state.calWeek?.terms[0]?.times)||state.calWeek?.default_times||[])[period-1];
 U.modal(`<header><h2>${U.date(date,true)} · คาบ ${period}${t?` (${t.start}–${t.end} น.)`:''}</h2></header><div class="body"><div class="sv-list">${list.map(r=>`<div class="sv-row" style="grid-template-columns:1fr"><div class="meta">
  <div class="line"><b>${esc(r.teacher_name)}</b></div><div class="line"><span>${esc(r.subject)}</span>${U.classLabel(r)?`<span class="sv-tag">${esc(U.classLabel(r))}</span>`:''}<span class="sv-tag">${esc(r.type_label)}</span></div>
  <div class="line">${U.pill(r.status)}${U.overdue(r)}<span class="owner">${r.supervisor_name?`ผู้นิเทศ: <b>${esc(r.supervisor_name)}</b>`:'ยังไม่มีผู้รับนิเทศ'}</span></div></div></div>`).join('')}</div></div>
  <footer><button type="button" class="sv-btn" data-close data-autofocus>ปิด</button></footer>`);
}
async function viewResults(){
 const all=state.list,teachers=[...new Map(all.map(r=>[r.teacher_user_id,r.teacher_name])).entries()].sort((a,b)=>a[1].localeCompare(b[1],'th'));
 let done=all.filter(r=>r.evaluation);if(state.teacher!=='all')done=done.filter(r=>String(r.teacher_user_id)===state.teacher);
 done.sort((a,b)=>String(b.evaluation.evaluated_at).localeCompare(String(a.evaluation.evaluated_at)));
 const scope=state.perm.view_all?'ผลการนิเทศของครูทุกคน':'ผลการนิเทศที่คุณเป็นผู้ประเมิน';
 const cal=await calendarHtml();
 $('view').innerHTML=cal+'<div style="height:16px"></div>'+U.stats(state.teacher==='all'?all:all.filter(r=>String(r.teacher_user_id)===state.teacher))+
  `<div class="sv-toolbar" style="margin-top:16px"><span style="color:#607991">${scope}</span><label class="sv-field" style="flex-direction:row;align-items:center;display:flex;gap:8px;margin-left:auto">ครู<select id="teacherSel"><option value="all">ครูทุกคน</option>${teachers.map(([id,n])=>`<option value="${id}"${state.teacher===String(id)?' selected':''}>${esc(n)}</option>`).join('')}</select></label></div>
  <div class="sv-list" style="margin-top:12px">${done.length?done.map(r=>U.result(r,state.focus===r.id)).join(''):'<section class="sv-card"><div class="sv-empty"><b>ยังไม่มีผลการนิเทศ</b>ผลจะแสดงเมื่อผู้นิเทศบันทึกคะแนนครบและกดบันทึกผล</div></section>'}</div>`;
 if(state.focus)document.getElementById('r-'+state.focus)?.scrollIntoView({block:'center'});
}
/* ---------- ประเมินผลการนิเทศ (สรุปสำหรับผู้บริหาร) ---------- */
const LEVELS=[['ดีเยี่ยม','#187E6B'],['ดีมาก','#2B86E5'],['ดี','#5B6FD8'],['พอใช้','#d98a1f'],['ควรพัฒนา','#c8483d']];
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function summaryData(){
 const done=state.list.filter(r=>r.evaluation&&(state.sumType==='all'||r.type_label===state.sumType));
 const levels=Object.fromEntries(LEVELS.map(([l])=>[l,0]));done.forEach(r=>{if(levels[r.evaluation.level]!=null)levels[r.evaluation.level]++;});
 // ค่าเฉลี่ยรายข้อ แยกตามประเภทการนิเทศ (ข้อประเมินแต่ละประเภทไม่เหมือนกัน)
 const groups=new Map();
 done.forEach(r=>{let g=groups.get(r.type_label);if(!g){g={label:r.type_label,count:0,items:new Map()};groups.set(r.type_label,g);}g.count++;
  r.evaluation.items.forEach(it=>{const k=it.label;if(!g.items.has(k))g.items.set(k,[]);g.items.get(k).push(Number(it.score));});});
 const teachers=new Map();
 [...done].sort((a,b)=>String(a.evaluation.evaluated_at).localeCompare(String(b.evaluation.evaluated_at))).forEach(r=>{
  let t=teachers.get(r.teacher_user_id);if(!t){t={name:r.teacher_name,position:r.teacher_position,list:[]};teachers.set(r.teacher_user_id,t);}t.list.push(r);});
 const rows=[...teachers.values()].map(t=>{const p=t.list.map(r=>Number(r.evaluation.percent)),last=t.list[t.list.length-1];
  return {name:t.name,position:t.position,count:t.list.length,avg:avg(p),last:p[p.length-1],lastLevel:last.evaluation.level,lastDate:last.visit_date,trend:p.length>1?p[p.length-1]-p[0]:null};})
  .sort((a,b)=>a.avg-b.avg||a.name.localeCompare(b.name,'th'));
 const requested=new Set(state.list.filter(r=>state.sumType==='all'||r.type_label===state.sumType).map(r=>r.teacher_user_id));
 return {done,levels,groups,rows,requested,mean:avg(done.map(r=>Number(r.evaluation.percent)))};
}
function viewSummary(){
 const d=summaryData(),types=[...new Set(state.list.filter(r=>r.evaluation).map(r=>r.type_label))].map(l=>[l,l]);
 const chip=(k,l)=>`<button type="button" class="sv-chip" data-sumtype="${esc(k)}" aria-pressed="${state.sumType===k}">${esc(l)}</button>`;
 const card=(l,v,c)=>`<div class="sv-stat"><span><i style="background:${c}"></i>${l}</span><b>${v}</b></div>`;
 const top=`<div class="sv-toolbar"><div class="sv-chips" role="group" aria-label="ประเภทการนิเทศ">${chip('all','ทุกประเภท')}${types.map(([k,l])=>chip(k,l)).join('')}</div>
  <button type="button" class="sv-btn sm" data-export style="margin-left:auto"${d.done.length?'':' disabled'}>ส่งออก Excel (CSV)</button></div>`;
 if(!d.done.length){$('view').innerHTML=top+'<section class="sv-card" style="margin-top:16px"><div class="sv-empty"><b>ยังไม่มีผลการนิเทศให้ประเมิน</b>เมื่อผู้นิเทศบันทึกคะแนนแล้ว ภาพรวม ระดับคุณภาพ และจุดที่ควรพัฒนาจะสรุปที่นี่</div></section>';return;}
 const stats=`<div class="sv-stats" style="margin-top:16px">${card('ครูที่ได้รับการนิเทศ',`${d.rows.length}<small style="font-size:14px;font-weight:500;color:#607991"> / ${d.requested.size} ที่ลงทะเบียน</small>`,'#2B86E5')}${card('ครั้งที่ประเมินแล้ว',d.done.length,'#187E6B')}${card('คะแนนเฉลี่ย',U.pct(d.mean)+'%','#5B6FD8')}${card('ระดับคุณภาพเฉลี่ย',U.level(d.mean),'#d98a1f')}</div>`;
 const maxL=Math.max(1,...Object.values(d.levels));
 const bar=(label,value,max,color,text)=>`<div style="display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:14px"><span>${label}</span><span style="background:#eef3f8;border-radius:99px;height:10px;overflow:hidden"><i style="display:block;height:100%;width:${Math.round(value/max*100)}%;background:${color};border-radius:99px"></i></span><b style="min-width:48px;text-align:right">${text}</b></div>`;
 const levelCard=`<section class="sv-card" style="display:flex;flex-direction:column;gap:10px"><h2 style="margin:0;font-size:17px">การกระจายระดับคุณภาพ</h2>${LEVELS.map(([l,c])=>bar(esc(l),d.levels[l],maxL,c,`${d.levels[l]} ครั้ง`)).join('')}</section>`;
 const itemCards=[...d.groups.values()].map(g=>{const items=[...g.items.entries()].map(([label,sc])=>({label,mean:avg(sc)}));
  const lo=Math.min(...items.map(i=>i.mean)),hi=Math.max(...items.map(i=>i.mean));
  return `<section class="sv-card" style="display:flex;flex-direction:column;gap:10px"><h2 style="margin:0;font-size:17px">ค่าเฉลี่ยรายข้อ — ${esc(g.label)} <small style="font-weight:500;color:#607991">(${g.count} ครั้ง, เต็ม 5)</small></h2>
   ${items.map(i=>bar(esc(i.label)+(i.mean===lo&&lo<hi?' <span class="sv-tag" style="background:#fdecea;color:#b23b30">ควรพัฒนา</span>':i.mean===hi&&lo<hi?' <span class="sv-tag" style="background:#e3f4ef;color:#187E6B">จุดเด่น</span>':''),i.mean,5,i.mean===lo&&lo<hi?'#c8483d':'#2B86E5',i.mean.toFixed(2))).join('')}</section>`;}).join('');
 const trend=t=>t==null?'<span style="color:#8aa0b4">—</span>':t>0?`<span style="color:#187E6B">▲ ${U.pct(t)}</span>`:t<0?`<span style="color:#c8483d">▼ ${U.pct(-t)}</span>`:'<span style="color:#607991">คงที่</span>';
 const table=`<section class="sv-card" style="display:flex;flex-direction:column;gap:10px"><h2 style="margin:0;font-size:17px">ผลรายครู <small style="font-weight:500;color:#607991">เรียงจากคะแนนเฉลี่ยน้อยไปมาก เพื่อวางแผนนิเทศติดตาม</small></h2>
  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px;min-width:560px"><thead><tr style="text-align:left;color:#607991;border-bottom:1px solid #e3eaf1">
  <th style="padding:8px 6px">ครู</th><th style="padding:8px 6px;text-align:center">ครั้ง</th><th style="padding:8px 6px;text-align:right">เฉลี่ย</th><th style="padding:8px 6px;text-align:right">ครั้งล่าสุด</th><th style="padding:8px 6px">ระดับล่าสุด</th><th style="padding:8px 6px;text-align:right">พัฒนาการ</th></tr></thead>
  <tbody>${d.rows.map(r=>`<tr style="border-bottom:1px solid #f0f4f8"><td style="padding:8px 6px"><b>${esc(r.name)}</b>${r.position?`<div style="color:#8aa0b4;font-size:12px">${esc(r.position)}</div>`:''}</td><td style="padding:8px 6px;text-align:center">${r.count}</td>
   <td style="padding:8px 6px;text-align:right">${U.pct(r.avg)}%</td><td style="padding:8px 6px;text-align:right">${U.pct(r.last)}%<div style="color:#8aa0b4;font-size:12px">${U.shortDate(r.lastDate)}</div></td>
   <td style="padding:8px 6px"><span class="lv lv-${esc(r.lastLevel)}">${esc(r.lastLevel)}</span></td><td style="padding:8px 6px;text-align:right">${trend(r.trend)}</td></tr>`).join('')}</tbody></table></div>
  <p class="sv-hint" style="margin:0">พัฒนาการ = ร้อยละครั้งล่าสุด − ครั้งแรก (แสดงเมื่อได้รับการนิเทศมากกว่า 1 ครั้ง)</p></section>`;
 $('view').innerHTML=top+stats+`<div style="display:grid;gap:16px;margin-top:16px">${levelCard}${itemCards}${table}</div>`;
}
function exportSummary(){
 const d=summaryData(),q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
 const lines=[['ครู','ตำแหน่ง','วันที่นิเทศ','คาบ','ประเภท','วิชา','ชั้น/ห้อง','ผู้นิเทศ','คะแนนรวม (25)','ร้อยละ','ระดับ','ข้อเสนอแนะ'].map(q).join(',')];
 [...d.done].sort((a,b)=>a.teacher_name.localeCompare(b.teacher_name,'th')||a.visit_date.localeCompare(b.visit_date)).forEach(r=>{const e=r.evaluation;
  lines.push([r.teacher_name,r.teacher_position,r.visit_date,r.period,r.type_label,r.subject,U.classLabel(r),e.evaluator_name,e.total,Number(e.percent).toFixed(2),e.level,e.suggestion].map(q).join(','));});
 const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download=`ประเมินผลการนิเทศ-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
/* ---------- วันไม่ว่างของผู้ประเมิน ---------- */
async function viewAway(){
 const {items}=await apiRequest('/api/supervision/unavailability');
 const row=a=>`<div class="sv-row" style="grid-template-columns:auto 1fr auto"><div class="when"><b>${U.date(a.unavailable_date)}</b><small>${a.period?`คาบ ${a.period}`:'ทั้งวัน'}</small></div>
  <div class="meta"><div class="line"><b>${esc(a.full_name)}</b>${a.mine?'<span class="sv-tag">ของคุณ</span>':''}</div>${a.note?`<div class="topic">${esc(a.note)}</div>`:''}</div>
  <div class="acts">${a.mine?`<button type="button" class="sv-btn sm danger" data-away-del="${a.id}">ลบ</button>`:''}</div></div>`;
 $('view').innerHTML=`<section class="sv-card" style="display:flex;flex-direction:column;gap:14px">
  <div><h2 style="margin:0 0 4px;color:#163e67;font-size:19px">แจ้งวันหรือคาบที่ไม่ว่างนิเทศ</h2><p class="sv-hint">เช่น ลา ไปราชการ ประชุม หรือมีสอน ระบบจะลดจำนวนคำขอที่ครูลงทะเบียนได้ในคาบนั้นลงตามจำนวนผู้ประเมินที่ไม่ว่าง (ปกติ 3 คำขอต่อคาบ) และคุณจะรับนิเทศคาบนั้นไม่ได้ คำขอที่ลงทะเบียนไว้ก่อนแล้วยังคงอยู่</p></div>
  <div class="sv-toolbar" style="flex-wrap:wrap;gap:8px"><input type="date" id="awayDate" aria-label="วันที่" min="${new Date(Date.now()+7*3600000).toISOString().slice(0,10)}">
   <select id="awayPeriod" aria-label="คาบ"><option value="">ทั้งวัน</option>${[1,2,3,4,5,6].map(p=>`<option value="${p}">คาบ ${p}</option>`).join('')}</select>
   <input id="awayNote" maxlength="200" placeholder="หมายเหตุ (ไม่บังคับ)" style="flex:1;min-width:160px"><button type="button" class="sv-btn primary" id="awayAdd">บันทึกวันไม่ว่าง</button></div>
  <div class="sv-list">${items.length?items.map(row).join(''):'<div class="sv-empty"><b>ยังไม่มีผู้ประเมินแจ้งวันไม่ว่าง</b>ทุกคาบรับลงทะเบียนได้ 3 คำขอ</div>'}</div></section>`;
 $('awayAdd').onclick=async()=>{const date=$('awayDate').value;if(!date)return U.toast('เลือกวันที่ก่อน',true);
  try{await apiRequest('/api/supervision/unavailability',{method:'POST',body:{date,period:$('awayPeriod').value||null,note:$('awayNote').value}});U.toast('บันทึกวันไม่ว่างแล้ว');viewAway();}catch(e){U.toast(e.message,true);}};
}
async function delAway(id){try{await apiRequest(`/api/supervision/unavailability/${id}`,{method:'DELETE'});U.toast('ลบวันไม่ว่างแล้ว');}catch(e){U.toast(e.message,true);}viewAway();}
/* ---------- ผู้มีสิทธิ์ประเมิน ---------- */
async function viewEvaluators(){
 const data=await apiRequest('/api/supervision/evaluators');
 const assignedIds=new Set(data.assigned.map(a=>a.user_id)),autoIds=new Set(data.automatic.map(a=>a.user_id));
 const options=data.candidates.filter(c=>!assignedIds.has(c.user_id)&&!autoIds.has(c.user_id));
 const person=p=>`<b>${esc(p.full_name)}</b>${p.position?` <span style="color:#607991">· ${esc(p.position)}</span>`:''}`;
 $('view').innerHTML=`<section class="sv-card" style="display:flex;flex-direction:column;gap:14px">
  <div><h2 style="margin:0 0 4px;color:#163e67;font-size:19px">ผู้มีสิทธิ์ประเมินโดยตำแหน่ง</h2><p class="sv-hint">ผู้อำนวยการและรองผู้อำนวยการ (ตามบทบาทผู้บริหารหรือตำแหน่งในทะเบียนบุคลากร) มีสิทธิ์รับนิเทศและบันทึกคะแนนโดยอัตโนมัติ</p></div>
  <div class="sv-list">${data.automatic.length?data.automatic.map(p=>`<div class="sv-row" style="grid-template-columns:1fr auto"><div>${person(p)}</div><span class="sv-tag">โดยตำแหน่ง</span></div>`).join(''):'<div class="sv-notice warn">ยังไม่พบผู้อำนวยการหรือรองผู้อำนวยการในระบบ ตรวจบทบาทผู้ใช้หรือตำแหน่งในทะเบียนบุคลากร</div>'}</div></section>
  <section class="sv-card" style="display:flex;flex-direction:column;gap:14px;margin-top:16px">
  <div><h2 style="margin:0 0 4px;color:#163e67;font-size:19px">ผู้ที่ได้รับแต่งตั้งให้ประเมิน</h2><p class="sv-hint">เพิ่มผู้ช่วยนิเทศ เช่น หัวหน้ากลุ่มสาระหรือครูพี่เลี้ยง ผู้ได้รับแต่งตั้งรับนิเทศและบันทึกคะแนนได้ และเห็นผลเฉพาะรายการที่ตนประเมิน</p></div>
  <div class="sv-toolbar"><select id="addSel" aria-label="เลือกผู้ใช้"><option value="">— เลือกครูหรือบุคลากร —</option>${options.map(c=>`<option value="${c.user_id}">${esc(c.full_name)}${c.position?` · ${esc(c.position)}`:''}</option>`).join('')}</select><button type="button" class="sv-btn primary" id="addBtn">เพิ่มผู้มีสิทธิ์ประเมิน</button></div>
  <div class="sv-list">${data.assigned.length?data.assigned.map(p=>`<div class="sv-row" style="grid-template-columns:1fr auto"><div>${person(p)}<div class="sv-hint">แต่งตั้งโดย ${esc(p.granted_by_name||'—')} · ${U.stamp(p.granted_at)}</div></div><div class="acts"><button type="button" class="sv-btn sm danger" data-revoke="${p.user_id}" data-name="${esc(p.full_name)}">ถอนสิทธิ์</button></div></div>`).join(''):'<div class="sv-empty"><b>ยังไม่มีผู้ได้รับแต่งตั้ง</b>เลือกชื่อด้านบนแล้วกดเพิ่ม</div>'}</div></section>`;
 $('addBtn').onclick=async()=>{const id=Number($('addSel').value);if(!id)return U.toast('เลือกผู้ใช้ก่อน',true);
  try{await apiRequest('/api/supervision/evaluators',{method:'POST',body:{user_id:id}});U.toast('เพิ่มผู้มีสิทธิ์ประเมินแล้ว');viewEvaluators();}catch(e){U.toast(e.message,true);}};
}
function revoke(id,name){
 const m=U.modal(`<header><h2>ถอนสิทธิ์ประเมินของ ${esc(name)}?</h2></header><div class="body"><p style="margin:0">รายการที่ประเมินไปแล้วยังคงอยู่ รายการที่รับนิเทศไว้แต่ยังไม่ประเมินจะกลับไปรอผู้รับนิเทศใหม่ และระบบแจ้งครูให้ทราบ</p></div>
  <footer><button type="button" class="sv-btn" data-close data-autofocus>ไม่ถอน</button><button type="button" class="sv-btn danger solid" id="rOk">ถอนสิทธิ์</button></footer>`);
 m.querySelector('#rOk').onclick=async()=>{try{const r=await apiRequest(`/api/supervision/evaluators/${id}`,{method:'DELETE'});U.close();U.toast(r.released?`ถอนสิทธิ์แล้ว นัดที่ยังไม่ประเมิน ${r.released} รายการกลับไปรอผู้รับนิเทศใหม่`:'ถอนสิทธิ์แล้ว');viewEvaluators();}catch(e){U.close();U.toast(e.message,true);}};
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-sumtype],[data-export],[data-tab],[data-filter],[data-accept],[data-release],[data-eval],[data-result],[data-revoke],[data-away-del],[data-calweek],[data-calslot]');if(!el)return;
 if(el.dataset.calweek!=null){const n=Number(el.dataset.calweek);state.calStart=n===0?null:addD(state.calStart,n);viewResults().catch(err=>U.toast(err.message,true));return;}
 if(el.dataset.calslot){openCalSlot(el.dataset.calslot);return;}
 if(el.dataset.awayDel){el.disabled=true;delAway(Number(el.dataset.awayDel));return;}
 if(el.dataset.sumtype){state.sumType=el.dataset.sumtype;viewSummary();return;}
 if(el.dataset.export!==undefined){exportSummary();return;}
 if(el.dataset.tab){state.view=el.dataset.tab;state.focus=null;render(false);}
 else if(el.dataset.filter){state.filter=el.dataset.filter;render(false);}
 else if(el.dataset.accept){el.disabled=true;act(el.dataset.accept,'accept','รับนิเทศเรียบร้อย ระบบแจ้งครูแล้ว');}
 else if(el.dataset.release){el.disabled=true;act(el.dataset.release,'release','ถอนการรับแล้ว คำขอกลับไปรอผู้บริหารรับนิเทศ');}
 else if(el.dataset.eval){state.draft={id:Number(el.dataset.eval),scores:Array(state.perm.form.sections.reduce((a,x)=>a+x.items.length,0)).fill(null),suggestion:''};state.view='evaluate';render(false);}
 else if(el.dataset.result){state.view='results';state.focus=Number(el.dataset.result);render(false);}
 else if(el.dataset.revoke)revoke(Number(el.dataset.revoke),el.dataset.name);
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='evalSel'){state.draft=t.value?{id:Number(t.value),scores:Array(state.perm.form.sections.reduce((a,x)=>a+x.items.length,0)).fill(null),suggestion:''}:null;render(false);}
 else if(t.id==='teacherSel'){state.teacher=t.value;state.focus=null;render(false);}
 else{const m=/^s(\d)$/.exec(t.name||'');if(m&&state.draft){state.draft.scores[Number(m[1])]=Number(t.value);summary();}}
});
document.addEventListener('input',e=>{if(e.target.id==='sugg'&&state.draft)state.draft.suggestion=e.target.value;});
(async()=>{
 const auth=await apiRequest('/api/auth/me');if(!auth.user){location.href='/login.html';return;}
 state.perm=await apiRequest('/api/supervision/permissions');
 if(!state.perm.staff){$('tabs').hidden=true;$('view').innerHTML='<div class="sv-notice error">หน้านี้สำหรับผู้อำนวยการ รองผู้อำนวยการ ผู้มีสิทธิ์ประเมิน และฝ่ายวิชาการเท่านั้น ครูลงทะเบียนและดูผลของตนเองได้ที่เมนู ระบบสนับสนุน → ลงทะเบียนนิเทศ</div>';return;}
 if(!allowed().some(t=>t[0]===state.view))state.view=allowed()[0][0];
 await load();
 if(state.focus&&!params.get('view')){const r=state.list.find(x=>x.id===state.focus);if(r)state.view=r.status==='evaluated'&&allowed().some(t=>t[0]==='results')?'results':'requests';}
 render(false);
})().catch(e=>{$('view').innerHTML=`<div class="sv-notice error">${esc(e.message)}</div>`;});
})();
