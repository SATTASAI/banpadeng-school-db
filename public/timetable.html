<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตารางเรียนและตารางสอน — โรงเรียนบ้านป่าเด็ง</title><link rel="stylesheet" href="/css/style.css">
<style>
  .page{max-width:1380px;margin:auto;padding:24px}.head,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.head h1{margin:0;color:#173b60;font-size:25px}.head p{margin:4px 0 0;color:#607991}.actions{justify-content:flex-start;margin:14px 0}.actions>*{width:auto}.filters{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;margin-top:18px}.filters label,.dialog label{display:grid;gap:5px;font-size:13px;color:#36536f}.filters select,.dialog input,.dialog select{width:100%;min-width:0;padding:10px;border:1px solid #cbdbe8;border-radius:10px;background:#fff;font:inherit}.notice{padding:12px 15px;border:1px solid #cfe3f2;border-radius:12px;background:#f2f9fd;margin:16px 0;color:#315c7f}.notice.error{background:#fff3f3;border-color:#e9c4c4;color:#a43a3a}.grid-wrap{overflow:auto;margin-top:16px}.timetable{width:100%;min-width:950px;table-layout:fixed;border-collapse:separate;border-spacing:5px}.timetable th{padding:7px;color:#3a5975}.timetable td{height:100px;vertical-align:top;padding:9px;border:1px solid #d4e3ef;border-radius:12px;background:#fff;cursor:pointer}.timetable td:hover,.timetable td.drop{border-color:#3486c7;background:#f0f8ff}.timetable .entry{display:grid;gap:3px}.entry strong{color:#174977}.entry small{color:#536f87}.entry[draggable=true]{cursor:grab}.dialog{border:0;border-radius:18px;max-width:500px;width:calc(100% - 24px);padding:24px;box-shadow:0 25px 70px #152e4b45}.dialog::backdrop{background:#12294288}.dialog form{display:grid;gap:12px}.dialog h2{margin:0}.dialog .buttons{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.dialog .buttons>*{width:auto}.badge{padding:4px 10px;border-radius:99px;background:#e5f4eb;color:#247347}.badge.draft{background:#fff1d8;color:#95630b}
  @media(max-width:700px){.page{padding:14px}.filters{grid-template-columns:1fr 1fr}}
  @media print{@page{size:A4 landscape;margin:12mm}.app-topbar,.head a,.actions,.filters,.notice,.dialog{display:none!important}.page{padding:0}.timetable{min-width:0;border-spacing:2px}.timetable td{height:28mm;break-inside:avoid}.grid-wrap{overflow:visible}.print-title{display:block!important;text-align:center;margin:0 0 3mm}}
</style></head><body><div class="app-topbar"><div class="brand"><div class="brand-mark"><img src="/logo.jpg" alt="ตราโรงเรียน"></div>โรงเรียนบ้านป่าเด็ง</div><div class="app-user"><a href="/dashboard.html">← กลับหน้าหลัก</a></div></div>
<main class="page"><div class="head"><div><h1>ตารางเรียนและตารางสอน</h1><p>6 คาบต่อวัน · จันทร์–ศุกร์ · ตรวจครูและห้องสอนชนกันก่อนบันทึก</p></div><span id="planBadge" class="badge">ยังไม่เผยแพร่</span></div>
<div class="filters"><label>ปีการศึกษา<select id="year"></select></label><label>ภาคเรียน<select id="term"></select></label><label>ชั้น/ห้อง<select id="classroom"></select></label><label>ข้อมูลที่ดู<select id="view"><option value="draft">ร่างตาราง</option><option value="published">ตารางที่เผยแพร่</option></select></label></div>
<div class="notice" id="notice" role="status">กำลังโหลดข้อมูล...</div><div class="actions" id="editActions" hidden><button class="btn btn-primary" id="publish">เผยแพร่ตารางสอน</button><button class="btn btn-ghost" id="print">พิมพ์ตารางห้องนี้</button><a class="btn btn-ghost" href="/import-center.html?template=students&amp;download=1">แม่แบบทะเบียนนักเรียน</a><a class="btn btn-ghost" href="/import-center.html?template=staff&amp;download=1">แม่แบบข้อมูลครู</a><a class="btn btn-ghost" href="/substitutes.html">จัดครูสอนแทน</a></div>
<h2 class="print-title" id="printTitle" style="display:none"></h2><div class="grid-wrap" id="grid"></div></main>
<dialog class="dialog" id="editor"><form method="dialog" id="slotForm"><h2 id="modalTitle">แก้ไขคาบเรียน</h2><label>วิชา<input id="subject" maxlength="120" required></label><label>ครูผู้สอน<select id="teacher" required></select></label><label>ห้องสอนเฉพาะ (เว้นว่างหากสอนในห้องเรียนประจำ)<input id="roomName" maxlength="100"></label><p id="modalError" role="alert"></p><div class="buttons"><button type="button" class="btn btn-ghost" id="deleteSlot">ลบคาบ</button><button type="button" class="btn btn-ghost" id="closeSlot">ยกเลิก</button><button type="submit" class="btn btn-primary">บันทึก</button></div></form></dialog>
<script src="/js/api.js"></script><script>
(()=>{const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const DAYS=["จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์"];let years=[],setup=null,entries=[],me=null,editing=null;
function status(message,error=false){$("notice").textContent=message;$("notice").classList.toggle("error",error)}
const room=()=>{const pair=$("classroom").value.split("|");return {grade_level:pair[0],classroom:pair[1]}};
const endpoint=(path)=>`/api/timetable/${path}`;
function render(){const selected=room(),view=$("view").value,items=entries.filter(e=>e.grade_level===selected.grade_level&&e.classroom===selected.classroom);
  $("planBadge").textContent=view==="draft"?"ร่างตาราง":"เผยแพร่แล้ว";$("planBadge").classList.toggle("draft",view==="draft");
  $("printTitle").textContent=`ตารางเรียน ${selected.grade_level||""}/${selected.classroom||""} · ${$("year").selectedOptions[0]?.textContent||""} ${$("term").selectedOptions[0]?.textContent||""}`;
  if(!selected.classroom){$("grid").innerHTML="";return}
  const rows=Array.from({length:6},(_,i)=>`<tr><th scope="row">คาบ ${i+1}</th>${DAYS.map((_,d)=>{const entry=items.find(e=>e.period===i+1&&e.weekday===d+1);return `<td data-day="${d+1}" data-period="${i+1}">${entry?`<div class="entry" data-id="${entry.id}" draggable="${view==='draft'&&me?.is_admin}"><strong>${esc(entry.subject)}</strong><small>${esc(entry.teacher_name)}</small>${entry.room_name?`<small>ห้อง ${esc(entry.room_name)}</small>`:""}</div>`:view==='draft'&&me?.is_admin?"+ เพิ่มคาบ":""}</td>`}).join("")}</tr>`).join("");
  $("grid").innerHTML=`<table class="timetable"><thead><tr><th scope="col">คาบ</th>${DAYS.map(x=>`<th scope="col">วัน${x}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`;
  if(view!=="draft"||!me?.is_admin)return;
  $("grid").querySelectorAll("td").forEach(cell=>{cell.onclick=()=>open(cell.dataset.day,cell.dataset.period);
    cell.ondragover=event=>{if(cell.querySelector(".entry"))return;event.preventDefault();cell.classList.add("drop")};
    cell.ondragleave=()=>cell.classList.remove("drop");cell.ondrop=async event=>{event.preventDefault();cell.classList.remove("drop");if(cell.querySelector(".entry"))return;const id=Number(event.dataTransfer.getData("text/plain"));if(!id)return;try{await apiRequest(endpoint(`slot/${id}`),{method:"PATCH",body:{term_id:Number($("term").value),weekday:Number(cell.dataset.day),period:Number(cell.dataset.period)}});await loadEntries()}catch(e){status(e.message,true)}};
  });$("grid").querySelectorAll(".entry[draggable=true]").forEach(el=>el.ondragstart=event=>event.dataTransfer.setData("text/plain",el.dataset.id));
}
function open(day,period){if(!setup?.teachers.length){status("ยังไม่มีข้อมูลครู กรุณานำเข้าแม่แบบข้อมูลครู",true);return}const selected=room();editing=entries.find(e=>e.grade_level===selected.grade_level&&e.classroom===selected.classroom&&e.weekday===Number(day)&&e.period===Number(period))||null;
  $("modalTitle").textContent=`${DAYS[Number(day)-1]} คาบ ${period} · ${selected.grade_level}/${selected.classroom}`;
  $("editor").dataset.day=day;$("editor").dataset.period=period;$("subject").value=editing?.subject||"";$("roomName").value=editing?.room_name||"";
  $("teacher").innerHTML='<option value="">เลือกครู</option>'+setup.teachers.map(t=>`<option value="${t.id}">${esc(t.full_name)}${t.subjects?` · ${esc(t.subjects)}`:""}</option>`).join("");$("teacher").value=editing?.teacher_id||"";$("deleteSlot").hidden=!editing;$("modalError").textContent="";$("editor").showModal();
}
async function loadEntries(){if(!$("term").value)return;try{const data=await apiRequest(endpoint(`entries?term_id=${$("term").value}&view=${$("view").value}`));entries=data.entries;render();status($("view").value==="published"&&!data.plan?"ยังไม่มีตารางที่เผยแพร่":"คลิกคาบเพื่อแก้ไข หรือลากคาบในร่างไปยังช่องว่าง")}catch(e){status(e.message,true)}}
async function loadSetup(){if(!$("term").value)return;try{setup=await apiRequest(endpoint(`setup?term_id=${$("term").value}`));$("classroom").innerHTML='<option value="">เลือกชั้น/ห้อง</option>'+setup.classes.map(c=>`<option value="${esc(c.grade_level)}|${esc(c.classroom)}">${esc(c.grade_level)}/${esc(c.classroom)} (${c.students} คน)</option>`).join("");if(setup.classes.length)$("classroom").value=`${setup.classes[0].grade_level}|${setup.classes[0].classroom}`;
  if(!setup.classes.length)status("ยังไม่มีทะเบียนนักเรียนในภาคเรียนนี้ ดาวน์โหลดแม่แบบเพื่อนำเข้าก่อน",true);
  else if(!setup.teachers.length)status("ยังไม่มีข้อมูลครู ดาวน์โหลดแม่แบบเพื่อนำเข้าก่อน",true);
  $("editActions").hidden=false;$("publish").hidden=!me?.is_admin||$("view").value!=="draft";await loadEntries();
}catch(e){status(e.message,true)}}
$("year").onchange=()=>{$("term").innerHTML=(years.find(y=>y.id===Number($("year").value))?.terms||[]).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("");loadSetup()};$("term").onchange=loadSetup;$("classroom").onchange=render;$("view").onchange=()=>{$("publish").hidden=!me?.is_admin||$("view").value!=="draft";loadEntries()};
$("closeSlot").onclick=()=>$("editor").close();$("deleteSlot").onclick=async()=>{if(!editing)return;try{await apiRequest(endpoint(`slot/${editing.id}?term_id=${$("term").value}`),{method:"DELETE"});$("editor").close();await loadEntries()}catch(e){$("modalError").textContent=e.message}};
$("slotForm").onsubmit=async event=>{event.preventDefault();const selected=room();try{await apiRequest(endpoint("slot"),{method:"PUT",body:{term_id:Number($("term").value),...selected,weekday:Number($("editor").dataset.day),period:Number($("editor").dataset.period),subject:$("subject").value,teacher_id:Number($("teacher").value),room_name:$("roomName").value}});$("editor").close();await loadEntries()}catch(e){$("modalError").textContent=e.message}};
$("publish").onclick=async()=>{if(!confirm("เผยแพร่ร่างตารางสอนให้ใช้ทั้งภาคเรียน?"))return;try{await apiRequest(endpoint("publish"),{method:"POST",body:{term_id:Number($("term").value)}});$("view").value="published";$("publish").hidden=true;await loadSetup();status("เผยแพร่ตารางสอนแล้ว")}catch(e){status(e.message,true)}};$("print").onclick=()=>window.print();
(async()=>{const [auth,periods]=await Promise.all([apiRequest("/api/auth/me"),apiRequest("/api/academic-periods")]);me=auth.user;if(!me){location.href="/login.html";return}years=periods.years||[];$("year").innerHTML=years.map(y=>`<option value="${y.id}">ปีการศึกษา ${y.year_be}</option>`).join("");if(!years.length){status("ยังไม่มีปีการศึกษา กรุณาสร้างในเมนูปีการศึกษา",true);return}const active=years.find(y=>y.status==="active")||years[0];$("year").value=active.id;$("year").onchange()})().catch(e=>status(e.message,true));
})();
</script></body></html>
