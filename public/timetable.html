<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตารางเรียนและตารางสอน — โรงเรียนบ้านป่าเด็ง</title><link rel="stylesheet" href="/css/style.css">
<style>
  .page{max-width:1380px;margin:auto;padding:24px}.head,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.head h1{margin:0;color:#173b60;font-size:25px}.head p{margin:4px 0 0;color:#607991}.actions{justify-content:flex-start;margin:14px 0}.actions>*{width:auto}.filters{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;margin-top:18px}.filters label,.dialog label{display:grid;gap:5px;font-size:13px;color:#36536f}.filters select,.dialog input,.dialog select{width:100%;min-width:0;padding:10px;border:1px solid #cbdbe8;border-radius:10px;background:#fff;font:inherit}.notice{padding:12px 15px;border:1px solid #cfe3f2;border-radius:12px;background:#f2f9fd;margin:16px 0;color:#315c7f}.notice.error{background:#fff3f3;border-color:#e9c4c4;color:#a43a3a}.grid-wrap{overflow:auto;margin-top:16px}.timetable{width:100%;min-width:950px;table-layout:fixed;border-collapse:separate;border-spacing:5px}.timetable th{padding:7px;color:#3a5975}.timetable td{height:100px;vertical-align:top;padding:9px;border:1px solid #d4e3ef;border-radius:12px;background:#fff;cursor:pointer}.timetable td[data-day]:hover,.timetable td.drop{border-color:#3486c7;background:#f0f8ff}.timetable .entry{display:grid;gap:3px}.entry strong{color:#174977}.entry small{color:#536f87}.entry[draggable=true]{cursor:grab}.dialog{border:0;border-radius:18px;max-width:500px;width:calc(100% - 24px);padding:24px;box-shadow:0 25px 70px #152e4b45}.dialog::backdrop{background:#12294288}.dialog form{display:grid;gap:12px}.dialog h2{margin:0}.dialog .buttons{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.dialog .buttons>*{width:auto}.badge{padding:4px 10px;border-radius:99px;background:#e5f4eb;color:#247347}.badge.draft{background:#fff1d8;color:#95630b}
  [hidden]{display:none!important}
  .tabs{display:inline-flex;gap:4px;padding:4px;margin-top:16px;border-radius:12px;background:#eaf2f9}.tabs button{width:auto;padding:8px 16px;border:0;border-radius:9px;background:transparent;color:#36536f;font:inherit;cursor:pointer}.tabs button.on{background:#fff;color:#174977;font-weight:650;box-shadow:0 1px 4px #17497722}
  .view-mode .timetable td{height:58px;cursor:default;padding:7px 8px}.view-mode .timetable td:hover{border-color:#d4e3ef;background:#fff}.view-mode .timetable{min-width:720px}.view-mode .entry strong{font-size:14px}.view-mode .entry small{font-size:12px}.view-mode td.empty{background:#f8fbfd}.timetable thead th small{display:block;font-weight:400;font-size:11.5px;color:#6a8299}.timetable th.lunch-h{width:92px}.timetable thead th:first-child{width:80px}.timetable td.lunch{cursor:default;background:#fbf6ea;color:#8a6a1f;text-align:center;vertical-align:middle;font-weight:600;font-size:13px}
  @media(max-width:700px){.page{padding:14px}.filters{grid-template-columns:1fr 1fr}}
  @media print{@page{size:A4 landscape;margin:12mm}.app-topbar,.head a,.actions,.filters,.tabs,.notice,.dialog{display:none!important}.page{padding:0}.timetable{min-width:0;border-spacing:2px}.timetable td{height:28mm;break-inside:avoid}.grid-wrap{overflow:visible}.print-title{display:block!important;text-align:center;margin:0 0 3mm}}
</style></head><body><div class="app-topbar"><div class="brand"><div class="brand-mark"><img src="/logo.jpg" alt="ตราโรงเรียน"></div>โรงเรียนบ้านป่าเด็ง</div><div class="app-user"><a href="/dashboard.html">← กลับหน้าหลัก</a></div></div>
<main class="page"><div class="head"><div><h1 id="pageTitle">ตารางสอน</h1><p id="pageLead">ตารางสอนครูแต่ละคนและตารางเรียนแต่ละห้อง (ตารางที่เผยแพร่แล้ว)</p></div><span id="planBadge" class="badge">ยังไม่เผยแพร่</span></div>
<div class="tabs" id="tabs" hidden><button type="button" data-tab="teacher" class="on">ตารางสอนครู</button><button type="button" data-tab="room">ตารางเรียนรายห้อง</button></div>
<div class="filters"><label>ปีการศึกษา<select id="year"></select></label><label>ภาคเรียน<select id="term"></select></label><label id="teacherBox" hidden>ครู<select id="teacherPick"></select></label><label id="roomBox">ชั้น/ห้อง<select id="classroom"></select></label><label id="viewBox">ข้อมูลที่ดู<select id="view"><option value="draft">ร่างตาราง</option><option value="published">ตารางที่เผยแพร่</option></select></label></div>
<div class="notice" id="notice" role="status">กำลังโหลดข้อมูล...</div><div class="actions" id="viewActions" hidden><button class="btn btn-primary" id="pdfOne">PDF ตารางนี้</button><button class="btn btn-ghost" id="pdfAll">PDF รวมครูทุกคน</button><button class="btn btn-ghost" id="printView">พิมพ์ตารางนี้</button></div><div class="actions" id="editActions" hidden><a class="btn btn-primary" href="/timetable-auto.html">กลับหน้าจัดตารางสอน</a><button class="btn btn-primary" id="publish">เผยแพร่ตารางสอน</button><button class="btn btn-ghost" id="print">พิมพ์ตารางห้องนี้</button><a class="btn btn-ghost" href="/substitutes.html">จัดครูสอนแทน</a></div>
<h2 class="print-title" id="printTitle" style="display:none"></h2><div class="grid-wrap" id="grid"></div></main>
<dialog class="dialog" id="editor"><form method="dialog" id="slotForm"><h2 id="modalTitle">แก้ไขคาบเรียน</h2><label>วิชา<input id="subject" maxlength="120" required></label><label>ครูผู้สอน<select id="teacher" required></select></label><label>ห้องสอนเฉพาะ (เว้นว่างหากสอนในห้องเรียนประจำ)<input id="roomName" maxlength="100"></label><p id="modalError" role="alert"></p><div class="buttons"><button type="button" class="btn btn-ghost" id="deleteSlot">ลบคาบ</button><button type="button" class="btn btn-ghost" id="closeSlot">ยกเลิก</button><button type="submit" class="btn btn-primary">บันทึก</button></div></form></dialog>
<script src="/js/api.js"></script><script src="/js/timetable-pdf.js"></script><script>
(()=>{const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const DAYS=["จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์"];let years=[],setup=null,entries=[],me=null,editing=null,tab="teacher";
// โหมดดู (ค่าเริ่มต้น): ตารางสอนครู/ตารางเรียนรายห้องที่เผยแพร่ — เฉพาะหัวหน้าฝ่ายวิชาการ ผู้บริหาร แอดมิน
// โหมดแก้ไข (?mode=edit): เปิดจากหน้าจัดตารางสอน สำหรับผู้จัดตาราง
const EDIT=new URLSearchParams(location.search).get("mode")==="edit";
function status(message,error=false){$("notice").textContent=message;$("notice").classList.toggle("error",error)}
const room=()=>{const pair=$("classroom").value.split("|");return {grade_level:pair[0],classroom:pair[1]}};
const endpoint=(path)=>`/api/timetable/${path}`;
function render(){if(!EDIT)return renderView();const selected=room(),view=$("view").value,items=entries.filter(e=>e.grade_level===selected.grade_level&&e.classroom===selected.classroom);
  $("planBadge").textContent=view==="draft"?"ร่างตาราง":"เผยแพร่แล้ว";$("planBadge").classList.toggle("draft",view==="draft");
  $("printTitle").textContent=`ตารางเรียน ${selected.grade_level||""}/${selected.classroom||""} · ${$("year").selectedOptions[0]?.textContent||""} ${$("term").selectedOptions[0]?.textContent||""}`;
  if(!selected.classroom){$("grid").innerHTML="";return}
  const T=TimetablePDF,canEdit=view==='draft'&&setup?.can_manage;
  const head=T.COLUMNS.map(c=>c==="lunch"?`<th scope="col" class="lunch-h">${T.LUNCH.label}<small>${T.LUNCH.time}</small></th>`:`<th scope="col">คาบ ${c}<small>${T.TIMES[c]}</small></th>`).join("");
  const rows=DAYS.map((day,d)=>`<tr><th scope="row">${day}</th>${T.COLUMNS.map(c=>{if(c==="lunch")return d===0?`<td class="lunch" rowspan="5">${T.LUNCH.label}</td>`:"";const entry=items.find(e=>e.period===c&&e.weekday===d+1);return `<td data-day="${d+1}" data-period="${c}">${entry?`<div class="entry" data-id="${entry.id}" draggable="${canEdit}"><strong>${esc(entry.subject)}</strong><small>${esc(entry.teacher_name)}</small>${entry.room_name?`<small>ห้อง ${esc(entry.room_name)}</small>`:""}</div>`:canEdit?"+ เพิ่มคาบ":""}</td>`}).join("")}</tr>`).join("");
  $("grid").innerHTML=`<table class="timetable"><thead><tr><th scope="col">วัน</th>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  if(view!=="draft"||!setup?.can_manage)return;
  $("grid").querySelectorAll("td[data-day]").forEach(cell=>{cell.onclick=()=>open(cell.dataset.day,cell.dataset.period);
    cell.ondragover=event=>{if(cell.querySelector(".entry"))return;event.preventDefault();cell.classList.add("drop")};
    cell.ondragleave=()=>cell.classList.remove("drop");cell.ondrop=async event=>{event.preventDefault();cell.classList.remove("drop");if(cell.querySelector(".entry"))return;const id=Number(event.dataTransfer.getData("text/plain"));if(!id)return;try{await apiRequest(endpoint(`slot/${id}`),{method:"PATCH",body:{term_id:Number($("term").value),weekday:Number(cell.dataset.day),period:Number(cell.dataset.period)}});await loadEntries()}catch(e){status(e.message,true)}};
  });$("grid").querySelectorAll(".entry[draggable=true]").forEach(el=>el.ondragstart=event=>event.dataTransfer.setData("text/plain",el.dataset.id));
}

function teacherList(){const m=new Map();entries.forEach(e=>{if(e.teacher_id&&!m.has(e.teacher_id))m.set(e.teacher_id,e.teacher_name||"")});return [...m].sort((a,b)=>a[1].localeCompare(b[1],"th"))}
function fillTeachers(){const list=teacherList(),cur=$("teacherPick").value;$("teacherPick").innerHTML=list.length?list.map(([id,name])=>`<option value="${id}">${esc(name)}</option>`).join(""):'<option value="">— ไม่มีข้อมูล —</option>';if(list.some(([id])=>String(id)===cur))$("teacherPick").value=cur}

function termLabel(){return `${$("term").selectedOptions[0]?.textContent||""} ${$("year").selectedOptions[0]?.textContent||""}`.trim()}
function teacherSheet(id,name){return {title:`ตารางสอน ${name}`,subtitle:termLabel(),entries:entries.filter(e=>e.teacher_id===id).map(e=>({...e,line:`${e.grade_level}/${e.classroom}${e.room_name?` · ${e.room_name}`:""}`}))}}
function roomSheet(g,c){return {title:`ตารางเรียน ${g}/${c}`,subtitle:termLabel(),entries:entries.filter(e=>e.grade_level===g&&e.classroom===c).map(e=>({...e,line:`${e.teacher_name||""}${e.room_name?` · ${e.room_name}`:""}`}))}}
async function exportPdf(all){const btns=[$("pdfOne"),$("pdfAll")];btns.forEach(b=>b.disabled=true);status("กำลังสร้าง PDF...");try{let sheets,name;
  if(tab==="teacher"){if(all){sheets=teacherList().map(([id,n])=>teacherSheet(id,n));name=`ตารางสอนครูทุกคน ${termLabel()}`}else{const id=Number($("teacherPick").value),n=$("teacherPick").selectedOptions[0]?.textContent||"";if(!id)throw Error("เลือกครูก่อน");sheets=[teacherSheet(id,n)];name=`ตารางสอน ${n} ${termLabel()}`}}
  else{if(all){sheets=(setup?.classes||[]).map(c=>roomSheet(c.grade_level,c.classroom));name=`ตารางเรียนทุกห้อง ${termLabel()}`}else{const r=room();if(!r.classroom)throw Error("เลือกห้องก่อน");sheets=[roomSheet(r.grade_level,r.classroom)];name=`ตารางเรียน ${r.grade_level}-${r.classroom} ${termLabel()}`}}
  await TimetablePDF.download(sheets,name);status(`ดาวน์โหลด PDF แล้ว (${sheets.length} หน้า)`)}catch(e){status(e.message,true)}finally{btns.forEach(b=>b.disabled=false)}}
function renderView(){const isTeacher=tab==="teacher";$("pdfAll").textContent=isTeacher?"PDF รวมครูทุกคน":"PDF รวมทุกห้อง";$("teacherBox").hidden=!isTeacher;$("roomBox").hidden=isTeacher;
  $("planBadge").textContent="เผยแพร่แล้ว";$("planBadge").classList.remove("draft");
  let items=[],title="";const termText=`${$("year").selectedOptions[0]?.textContent||""} ${$("term").selectedOptions[0]?.textContent||""}`;
  if(isTeacher){const id=Number($("teacherPick").value);items=entries.filter(e=>e.teacher_id===id);title=`ตารางสอน ${$("teacherPick").selectedOptions[0]?.textContent||""}`;if(!id){$("grid").innerHTML="";return}}
  else{const r=room();if(!r.classroom){$("grid").innerHTML="";return}items=entries.filter(e=>e.grade_level===r.grade_level&&e.classroom===r.classroom);title=`ตารางเรียน ${r.grade_level}/${r.classroom}`}
  $("printTitle").textContent=`${title} · ${termText}`;
  const T=TimetablePDF,total=items.length,cell=e=>`<div class="entry"><strong>${esc(e.subject)}</strong><small>${isTeacher?`${esc(e.grade_level)}/${esc(e.classroom)}`:esc(e.teacher_name)}</small>${e.room_name?`<small>ห้อง ${esc(e.room_name)}</small>`:""}</div>`;
  const head=T.COLUMNS.map(c=>c==="lunch"?`<th scope="col" class="lunch-h">${T.LUNCH.label}<small>${T.LUNCH.time}</small></th>`:`<th scope="col">คาบ ${c}<small>${T.TIMES[c]}</small></th>`).join("");
  const rows=DAYS.map((day,d)=>`<tr><th scope="row">${day}</th>${T.COLUMNS.map(c=>{if(c==="lunch")return d===0?`<td class="lunch" rowspan="5">${T.LUNCH.label}</td>`:"";const e=items.find(x=>x.period===c&&x.weekday===d+1);return e?`<td>${cell(e)}</td>`:'<td class="empty"></td>'}).join("")}</tr>`).join("");
  $("grid").innerHTML=`<table class="timetable"><thead><tr><th scope="col">วัน</th>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  status(total?`${title} · ${total} คาบต่อสัปดาห์`:"ไม่มีคาบในตารางที่เผยแพร่")}
function open(day,period){if(!setup?.teachers.length){status("ยังไม่มีข้อมูลครู กรุณานำเข้าแม่แบบข้อมูลครู",true);return}const selected=room();editing=entries.find(e=>e.grade_level===selected.grade_level&&e.classroom===selected.classroom&&e.weekday===Number(day)&&e.period===Number(period))||null;
  $("modalTitle").textContent=`${DAYS[Number(day)-1]} คาบ ${period} · ${selected.grade_level}/${selected.classroom}`;
  $("editor").dataset.day=day;$("editor").dataset.period=period;$("subject").value=editing?.subject||"";$("roomName").value=editing?.room_name||"";
  $("teacher").innerHTML='<option value="">เลือกครู</option>'+setup.teachers.map(t=>`<option value="${t.id}">${esc(t.full_name)}${t.subjects?` · ${esc(t.subjects)}`:""}</option>`).join("");$("teacher").value=editing?.teacher_id||"";$("deleteSlot").hidden=!editing;$("modalError").textContent="";$("editor").showModal();
}
async function loadEntries(){if(!$("term").value)return;try{const data=await apiRequest(endpoint(`entries?term_id=${$("term").value}&view=${EDIT?$("view").value:"published"}`));entries=data.entries;if(!EDIT){fillTeachers();renderView();if(!data.plan)status("ภาคเรียนนี้ยังไม่มีตารางที่เผยแพร่");return}render();status($("view").value==="published"&&!data.plan?"ยังไม่มีตารางที่เผยแพร่":"คลิกคาบเพื่อแก้ไข หรือลากคาบในร่างไปยังช่องว่าง")}catch(e){status(e.message,true)}}
async function loadSetup(){if(!$("term").value)return;try{setup=await apiRequest(endpoint(`setup?term_id=${$("term").value}`));$("classroom").innerHTML='<option value="">เลือกชั้น/ห้อง</option>'+setup.classes.map(c=>`<option value="${esc(c.grade_level)}|${esc(c.classroom)}">${esc(c.grade_level)}/${esc(c.classroom)} (${c.students} คน)</option>`).join("");if(setup.classes.length)$("classroom").value=`${setup.classes[0].grade_level}|${setup.classes[0].classroom}`;
  if(!setup.classes.length)status("ยังไม่มีทะเบียนนักเรียนในภาคเรียนนี้ ดาวน์โหลดแม่แบบเพื่อนำเข้าก่อน",true);
  else if(!setup.teachers.length)status("ยังไม่มีข้อมูลครู ดาวน์โหลดแม่แบบเพื่อนำเข้าก่อน",true);
  $("editActions").hidden=!EDIT;$("viewActions").hidden=EDIT;$("publish").hidden=!setup?.can_manage||$("view").value!=="draft";await loadEntries();
}catch(e){status(e.message,true)}}
$("year").onchange=()=>{$("term").innerHTML=(years.find(y=>y.id===Number($("year").value))?.terms||[]).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("");loadSetup()};$("term").onchange=loadSetup;$("classroom").onchange=render;$("teacherPick").onchange=render;$("printView").onclick=()=>window.print();$("pdfOne").onclick=()=>exportPdf(false);$("pdfAll").onclick=()=>exportPdf(true);document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));render()});$("view").onchange=()=>{$("publish").hidden=!setup?.can_manage||$("view").value!=="draft";loadEntries()};
$("closeSlot").onclick=()=>$("editor").close();$("deleteSlot").onclick=async()=>{if(!editing)return;try{await apiRequest(endpoint(`slot/${editing.id}?term_id=${$("term").value}`),{method:"DELETE"});$("editor").close();await loadEntries()}catch(e){$("modalError").textContent=e.message}};
$("slotForm").onsubmit=async event=>{event.preventDefault();const selected=room();try{await apiRequest(endpoint("slot"),{method:"PUT",body:{term_id:Number($("term").value),...selected,weekday:Number($("editor").dataset.day),period:Number($("editor").dataset.period),subject:$("subject").value,teacher_id:Number($("teacher").value),room_name:$("roomName").value}});$("editor").close();await loadEntries()}catch(e){$("modalError").textContent=e.message}};
$("publish").onclick=async()=>{if(!confirm("เผยแพร่ร่างตารางสอนให้ใช้ทั้งภาคเรียน?"))return;try{await apiRequest(endpoint("publish"),{method:"POST",body:{term_id:Number($("term").value)}});$("view").value="published";$("publish").hidden=true;await loadSetup();status("เผยแพร่ตารางสอนแล้ว")}catch(e){status(e.message,true)}};$("print").onclick=()=>window.print();
(async()=>{const [auth,periods,perm]=await Promise.all([apiRequest("/api/auth/me"),apiRequest("/api/academic-periods"),apiRequest("/api/timetable/permissions").catch(()=>({}))]);me=auth.user;if(!me){location.href="/login.html";return}
  if(EDIT){if(!perm.manage){status("เฉพาะผู้จัดตารางสอนที่แก้ไขตารางได้",true);document.querySelector(".filters").hidden=true;return}$("pageTitle").textContent="แก้ไขตารางรายคาบ";$("pageLead").textContent="6 คาบต่อวัน · จันทร์–ศุกร์ · ตรวจครูและห้องสอนชนกันก่อนบันทึก";document.title="แก้ไขตารางรายคาบ — โรงเรียนบ้านป่าเด็ง"}
  else{if(!perm.view_all){status("เมนูนี้ดูได้เฉพาะหัวหน้าฝ่ายวิชาการ ผู้บริหาร และผู้ดูแลระบบ — ดูตารางสอนของคุณได้ที่หน้าบัญชีของฉัน",true);document.querySelector(".filters").hidden=true;$("planBadge").hidden=true;return}document.body.classList.add("view-mode");$("tabs").hidden=false;$("viewBox").hidden=true;document.title="ตารางสอน — โรงเรียนบ้านป่าเด็ง"}years=periods.years||[];$("year").innerHTML=years.map(y=>`<option value="${y.id}">ปีการศึกษา ${y.year_be}</option>`).join("");if(!years.length){status("ยังไม่มีปีการศึกษา กรุณาสร้างในเมนูปีการศึกษา",true);return}const active=years.find(y=>y.status==="active")||years[0];$("year").value=active.id;$("year").onchange()})().catch(e=>status(e.message,true));
})();
</script></body></html>
