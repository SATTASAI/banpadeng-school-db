<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>แจ้งเตือน — โรงเรียนบ้านป่าเด็ง</title>
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#1E5FC0" />
<link rel="stylesheet" href="/css/style.css">
<style>
body{background:#e9eef6}
.nt-page{max-width:640px;margin:auto;padding:18px 14px calc(28px + env(safe-area-inset-bottom))}
.nt-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nt-top img{width:42px;height:42px;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(20,40,80,.12)}
.nt-top h1{margin:0;font-size:19px;color:#1e3a8a}.nt-top small{display:block;color:#5d6f84;font-size:12px}
.nt-top a.home{margin-left:auto;font-size:14px;font-weight:600;color:#1D5F9E;text-decoration:none;padding:8px 12px;border-radius:10px;background:#fff;border:1px solid #d3deee}
.msg{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(20,40,80,.08);margin:0 0 12px;overflow:hidden;border:1px solid #e1e8f2}
.msg-head{display:flex;align-items:center;gap:8px;padding:12px 16px;background:linear-gradient(135deg,#4F6BED,#7B4FE0);color:#fff;font-weight:700;font-size:14px}
.msg-head time{margin-left:auto;font-weight:500;font-size:12px;opacity:.9}
.msg-body{padding:14px 16px 6px}.msg-body h2{margin:0 0 6px;font-size:17px;color:#16243a;line-height:1.45}
.msg-body p{margin:0 0 10px;color:#3c4d62;font-size:15px;line-height:1.6;white-space:pre-line}
.facts{margin:4px 0 12px;border-top:1px dashed #dde5f0;padding-top:10px;display:grid;gap:6px;font-size:14px}
.facts div{display:grid;grid-template-columns:92px 1fr;gap:8px}.facts dt{color:#6b7c90}.facts dd{margin:0;color:#1f2f45;white-space:pre-line}
.msg-foot{padding:0 16px 16px}.msg-foot a{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border-radius:12px;background:#1E5FC0;color:#fff;font-weight:700;text-decoration:none;font-size:15px}
.msg.compact .msg-head{background:#f3f6fb;color:#33506b}.msg.compact .facts{display:none}.msg.compact .msg-body p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg.compact .msg-foot a{background:#eef3fb;color:#1D5F9E}
.msg.focus{outline:3px solid #b8c9f8}
.sec{margin:18px 4px 10px;font-size:13px;color:#5d6f84;font-weight:600}
.empty{padding:40px 16px;text-align:center;color:#6b7c90;background:#fff;border-radius:18px}
</style></head>
<body>
<main class="nt-page">
  <div class="nt-top"><img src="/icons/icon-192.png" alt=""><div><h1>แจ้งเตือน</h1><small>ระบบจัดการโรงเรียนบ้านป่าเด็ง</small></div><a class="home" href="/dashboard.html">หน้าแรก</a></div>
  <div id="list"><div class="empty">กำลังโหลด...</div></div>
</main>
<script src="/js/api.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const thDate=iso=>{const m=String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${Number(m[3])} ${MON[Number(m[2])-1]} ${Number(m[1])+543}`:esc(iso)};
const when=t=>{const d=new Date(String(t).replace(" ","T")+"Z");if(isNaN(d))return "";const b=new Date(d.getTime()+7*3600e3);return `${b.getUTCDate()} ${MON[b.getUTCMonth()]} ${String(b.getUTCHours()).padStart(2,"0")}:${String(b.getUTCMinutes()).padStart(2,"0")} น.`};
const label=k=>{const s=String(k||"");return s.startsWith("leave:")?"เปิดใบลา":s.startsWith("maintenance")?"เปิดงานแจ้งซ่อม":s.startsWith("supervision")?"เปิดงานนิเทศ":"เปิดหน้างาน"};
function facts(d){
  if(!d)return "";
  const rows=[];
  if(d.start_date)rows.push(["วันที่ลา",d.start_date===d.end_date?thDate(d.start_date):`${thDate(d.start_date)} ถึง ${thDate(d.end_date)}`+(d.leave_days?` (${esc(d.leave_days)} วัน)`:"")]);
  if(d.reason)rows.push(["เหตุผล",esc(d.reason)]);
  if(d.contact_phone)rows.push(["โทรติดต่อ",esc(d.contact_phone)]);
  return rows.length?`<dl class="facts">${rows.map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join("")}</dl>`:"";
}
const card=(r,cls="")=>`<article class="msg ${cls}"><div class="msg-head">🔔 แจ้งเตือนจากระบบ<time>${when(r.created_at)}</time></div>
  <div class="msg-body"><h2>${esc(r.title)}</h2>${r.message?`<p>${esc(r.message)}</p>`:""}${facts(r.details)}</div>
  ${r.url?`<div class="msg-foot"><a href="${esc(r.url)}">${esc(r.action_label||label(r.message_key))} →</a></div>`:""}</article>`;
async function load(){
  const key=new URLSearchParams(location.search).get("key")||"";
  try{
    const {items}=await apiRequest("/api/push/inbox"+(key?`?key=${encodeURIComponent(key)}`:""));
    if(!items.length){$("list").innerHTML='<div class="empty">ยังไม่มีแจ้งเตือน<br><small>แจ้งเตือนที่ส่งเข้ามือถือจะแสดงที่นี่</small></div>';return}
    const focus=key?items.find(r=>r.message_key===key):null;
    const rest=items.filter(r=>r!==focus);
    $("list").innerHTML=(focus?card(focus,"focus")+(rest.length?'<div class="sec">แจ้งเตือนก่อนหน้า</div>':""):"")
      +rest.map((r,i)=>card(r,focus||i>=3?"compact":"")).join("");
  }catch(e){
    if(/เข้าสู่ระบบ/.test(e.message)){location.href="/login.html?next="+encodeURIComponent(location.pathname+location.search);return}
    $("list").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
load();
</script>
</body></html>
