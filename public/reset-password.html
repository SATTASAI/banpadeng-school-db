<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ตั้งรหัสผ่านใหม่ — โรงเรียนบ้านป่าเด็ง</title>
<link rel="stylesheet" href="/css/style.css">
<style>.reset-message{padding:14px;border-radius:12px;background:#e8f6ee;color:#217248;margin-bottom:16px;line-height:1.6}.reset-message[hidden]{display:none}</style>
</head>
<body><main class="auth-shell"><div class="auth-card">
<div class="auth-mark"><img src="/logo.jpg" alt="ตราโรงเรียน"></div>
<h1>ตั้งรหัสผ่านใหม่</h1><p class="auth-subtitle">ใช้รหัสผ่านอย่างน้อย 8 ตัวอักษร ลิงก์มีอายุ 30 นาทีและใช้ได้ครั้งเดียว</p>
<div class="error-box" id="errorBox" role="alert"></div><div class="reset-message" id="message" role="status" hidden></div>
<form id="resetForm">
<div class="field"><label for="password">รหัสผ่านใหม่</label><input type="password" id="password" minlength="8" maxlength="256" autocomplete="new-password" required></div>
<div class="field"><label for="confirm">ยืนยันรหัสผ่านใหม่</label><input type="password" id="confirm" minlength="8" maxlength="256" autocomplete="new-password" required></div>
<button class="btn btn-primary" id="saveButton" type="submit">บันทึกรหัสผ่านใหม่</button>
</form>
<div class="auth-footer"><a href="/login.html">เข้าสู่ระบบ</a><span aria-hidden="true"> · </span><a href="/forgot-password.html">ขอลิงก์ใหม่</a></div>
</div></main>
<script src="/js/api.js"></script><script>
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';
history.replaceState(null,'',location.pathname);
const form=document.getElementById('resetForm'),button=document.getElementById('saveButton'),errorBox=document.getElementById('errorBox'),message=document.getElementById('message');
function showError(text){errorBox.textContent=text;errorBox.classList.add('visible')}
if(!/^[a-f0-9]{64}$/.test(token)){form.hidden=true;showError('ลิงก์ไม่ถูกต้อง กรุณาขอลิงก์ตั้งรหัสผ่านใหม่')}
form.addEventListener('submit',async event=>{
 event.preventDefault();errorBox.classList.remove('visible');const password=document.getElementById('password').value;
 if(password!==document.getElementById('confirm').value){showError('ยืนยันรหัสผ่านไม่ตรงกัน');return}
 button.disabled=true;button.textContent='กำลังบันทึก...';
 try{const result=await apiRequest('/api/auth/reset-password',{method:'POST',body:{token,new_password:password}});form.reset();form.hidden=true;message.textContent=result.message;message.hidden=false}
 catch(error){showError(error.message)}finally{button.disabled=false;button.textContent='บันทึกรหัสผ่านใหม่'}
});
</script></body></html>
