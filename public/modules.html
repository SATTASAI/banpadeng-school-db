<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เปิดหน้าทำงาน — โรงเรียนบ้านป่าเด็ง</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="app-main"><h2>กำลังเปิดหน้าทำงาน…</h2><p id="message" role="status">รอสักครู่</p><a href="/dashboard.html">กลับหน้าหลัก</a></main>
<script src="/js/navigation-catalog.js"></script><script src="/js/api.js"></script>
<script>
(async()=>{
 const key=new URLSearchParams(location.search).get('module')||'students',route=SchoolNavigation.routes[key];
 if(!route){document.getElementById('message').textContent='ไม่พบหน้าทำงานนี้';return;}
 const {user}=await apiRequest('/api/auth/me');
 if(!user){location.replace('/login.html');return;}
 if(!user.role){location.replace('/pending.html');return;}
 if(['users','security','system-status'].includes(key)&&!user.is_admin){document.getElementById('message').textContent='ไม่มีสิทธิ์เข้าถึงหน้าบริหารระบบ';return;}
 location.replace(route);
})().catch(error=>{document.getElementById('message').textContent=error.message;});
</script></body></html>
