<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>หมวดงาน — ระบบจัดการโรงเรียนบ้านป่าเด็ง</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  html,body { height:100%; overflow:hidden; }
  .app-shell { height:100%; display:flex; flex-direction:column; }
  .app-topbar { display:none; }
  .app-main { max-width:none; width:100%; height:100%; padding:20px 24px; display:flex; flex-direction:column; overflow:hidden; background:transparent; }
  .module-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:14px; flex-shrink:0; }
  .module-kicker { color:var(--color-ocean-700); font-size:11px; font-weight:700; margin-bottom:4px; }
  .module-description { color:var(--color-text-muted); margin:0; max-width:720px; }
  .module-count { flex-shrink:0; background:rgba(255,255,255,.68); color:var(--color-forest-700); border:1px solid var(--color-border); border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600; box-shadow:0 5px 14px rgba(51,87,125,.06); }
  .module-kicker { letter-spacing:.08em; text-transform:uppercase; color:var(--color-teal-500); }
  .feature-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; }
  .feature-card { background:rgba(255,255,255,.78); border:1px solid var(--color-border); border-radius:14px; padding:14px; min-height:104px; display:flex; flex-direction:column; box-shadow:0 8px 22px rgba(57,91,128,.05); }
  .feature-number { width:27px; height:27px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#EBF6FF,#DDEFFD); color:var(--color-ocean-700); border:1px solid rgba(52,131,203,.12); font-size:11px; font-weight:700; margin-bottom:9px; }
  .feature-card h3 { font-size:15px; line-height:1.45; margin-bottom:6px; }
  .feature-card p { color:var(--color-text-muted); font-size:13px; margin:0 0 12px; }
  .feature-footer { margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .feature-status { font-size:11px; color:var(--color-text-muted); }
  .feature-status.ready { color:var(--color-success); font-weight:600; }
  .feature-link { font-size:12px; font-weight:600; text-decoration:none; }
  .workspace-shell { flex:1; min-height:0; display:flex; flex-direction:column; background:rgba(255,255,255,.82); border:1px solid var(--color-border); border-radius:18px; overflow:hidden; box-shadow:0 18px 48px rgba(50,84,122,.10); backdrop-filter:blur(22px) saturate(140%); }
  .quick-actions { min-height:58px; flex-shrink:0; display:flex; align-items:center; gap:4px; margin:0; padding:10px 14px; background:rgba(244,248,252,.78); border-bottom:1px solid var(--color-border); overflow-x:auto; }
  .quick-actions .workspace-tab { width:auto; white-space:nowrap; padding:8px 13px; border:1px solid transparent; border-radius:10px; background:transparent; color:var(--color-text-muted); font:600 13px var(--font-body); cursor:pointer; transition:.16s ease; }
  .quick-actions .workspace-tab:hover { color:var(--color-ocean-700); background:rgba(255,255,255,.72); }
  .quick-actions .workspace-tab.active { color:#fff; border-color:rgba(15,98,183,.25); background:linear-gradient(180deg,#3C96ED,#1671D5); box-shadow:0 5px 13px rgba(26,112,202,.20),inset 0 1px rgba(255,255,255,.25); }
  .workspace-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:52px; flex-shrink:0; padding:8px 14px; border-bottom:1px solid var(--color-border); background:rgba(255,255,255,.72); backdrop-filter:blur(18px); }
  .workspace-breadcrumb { color:var(--color-text-muted); font-size:12px; }
  .workspace-controls { display:flex; gap:7px; }
  .workspace-controls .btn { width:auto; min-height:34px; padding:6px 11px; font-size:12px; border-radius:10px; }
  .workspace-content { flex:1; min-height:0; position:relative; background:linear-gradient(145deg,rgba(242,247,251,.86),rgba(235,243,249,.82)); }
  .overview-panel { position:absolute; inset:0; overflow:auto; padding:16px; }
  .inner-frame { display:none; position:absolute; inset:0; width:100%; height:100%; border:0; background:rgba(248,250,252,.92); }
  .inner-frame.active { display:block; }
  .workspace-shell.maximized { position:fixed; inset:0; z-index:100; border:0; border-radius:0; }
  .notice { margin-top:14px; background:rgba(229,242,251,.72); border:1px solid rgba(86,142,190,.18); border-radius:13px; padding:12px 14px; color:#31546E; font-size:13px; }
  @media (max-width:640px) {
    .app-main { padding:12px; }
    .module-head { flex-direction:column; gap:6px; }
    .feature-grid { grid-template-columns:1fr; }
    .workspace-controls .btn span { display:none; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <div class="app-topbar">
    <div class="brand"><div class="brand-mark"><img src="/logo.jpg" alt="ตราโรงเรียน" /></div>โรงเรียนบ้านป่าเด็ง</div>
    <div class="app-user"><a href="/dashboard.html" id="backHomeLink">← กลับแดชบอร์ด</a></div>
  </div>

  <main class="app-main">
    <div class="module-head">
      <div>
        <div class="module-kicker" id="moduleKicker">หมวดงาน</div>
        <h2 id="moduleTitle">ระบบจัดการข้อมูลโรงเรียน</h2>
        <p class="module-description" id="moduleDescription"></p>
      </div>
      <div class="module-count" id="moduleCount"></div>
    </div>

    <div class="error-box" id="errorBox"></div>
    <section class="workspace-shell" id="workspaceShell">
      <div class="quick-actions" id="quickActions"></div>
      <div class="workspace-toolbar">
        <div class="workspace-breadcrumb" id="workspaceBreadcrumb">หน้าหลัก / ภาพรวม</div>
        <div class="workspace-controls">
          <button class="btn btn-ghost" id="openFullBtn" style="display:none;">↗ <span>เปิดเต็มหน้า</span></button>
          <button class="btn btn-ghost" id="refreshFrameBtn" style="display:none;">↻ <span>รีเฟรช</span></button>
          <button class="btn btn-ghost" id="maximizeBtn">⛶ <span>ขยายพื้นที่</span></button>
        </div>
      </div>
      <div class="workspace-content">
        <div class="overview-panel" id="overviewPanel">
          <section class="feature-grid" id="featureGrid"></section>
          <div class="notice" id="moduleNotice">
            รายการที่ระบุว่า “วางโครงสร้างแล้ว” ถูกเพิ่มไว้ในระบบเรียบร้อย และพร้อมต่อยอดฐานข้อมูล แบบฟอร์ม และขั้นตอนอนุมัติในเฟสถัดไป
          </div>
        </div>
        <iframe class="inner-frame" id="innerFrame" title="พื้นที่ปฏิบัติงาน"></iframe>
      </div>
    </section>
  </main>
</div>

        "ยืนยันตัวตนและเปลี่ยนรหัสผ่าน",
        "รองรับการใช้งานหลายคนพร้อมกัน",
        "ป้องกันการเข้าถึงข้อมูลส่วนบุคคล",
        "ระบบแจ้งเตือนความผิดปกติ"
      ]
    }
  };

  function renderModule(key, module) {
    document.title = `${module.title} — ระบบจัดการโรงเรียนบ้านป่าเด็ง`;
    document.getElementById("moduleKicker").textContent = `หมวดที่ ${module.number}`;
    document.getElementById("moduleTitle").textContent = module.title;
    document.getElementById("moduleDescription").textContent = module.description;
    document.getElementById("moduleCount").textContent = `${module.items.length} หัวข้องาน`;

    const actions = document.getElementById("quickActions");
    actions.innerHTML = `<button type="button" class="workspace-tab active" data-overview="true">ภาพรวม</button>` + module.actions.map((action, index) =>
      `<button type="button" class="workspace-tab" data-href="${action.href}" data-label="${action.label}">${action.label.replace(/^เปิด/, "")}</button>`
    ).join("");

    document.getElementById("featureGrid").innerHTML = module.items.map((item, index) => {
      const ready = module.ready.includes(index);
      return `<article class="feature-card">
        <span class="feature-number">${String(index + 1).padStart(2, "0")}</span>
        <h3>${item}</h3>
        <div class="feature-footer">
          <span class="feature-status ${ready ? "ready" : ""}">${ready ? "เปิดใช้งานแล้ว" : "วางโครงสร้างแล้ว"}</span>
        </div>
      </article>`;
    }).join("");

    const overviewPanel = document.getElementById("overviewPanel");
    const innerFrame = document.getElementById("innerFrame");
    const openFullBtn = document.getElementById("openFullBtn");
    const refreshFrameBtn = document.getElementById("refreshFrameBtn");
    const breadcrumb = document.getElementById("workspaceBreadcrumb");
    let activeUrl = "";

    const activateOverview = () => {
      activeUrl = "";
      overviewPanel.style.display = "block";
      innerFrame.classList.remove("active");
      innerFrame.src = "about:blank";
      breadcrumb.textContent = `${module.title} / ภาพรวม`;
      openFullBtn.style.display = "none";
      refreshFrameBtn.style.display = "none";
      actions.querySelectorAll(".workspace-tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.overview === "true"));
    };

    const activatePage = (tab) => {
      activeUrl = tab.dataset.href;
      overviewPanel.style.display = "none";
      innerFrame.src = activeUrl;
      innerFrame.classList.add("active");
      breadcrumb.textContent = `${module.title} / ${tab.dataset.label}`;
      openFullBtn.style.display = "inline-flex";
      refreshFrameBtn.style.display = "inline-flex";
      actions.querySelectorAll(".workspace-tab").forEach((item) => item.classList.toggle("active", item === tab));
    };

    actions.querySelectorAll(".workspace-tab").forEach((tab) => {
      tab.addEventListener("click", () => tab.dataset.overview === "true" ? activateOverview() : activatePage(tab));
    });
    openFullBtn.onclick = () => { if (activeUrl) window.open(activeUrl, "_blank", "noopener"); };
    refreshFrameBtn.onclick = () => { if (activeUrl) innerFrame.src = activeUrl; };
    document.getElementById("maximizeBtn").onclick = () => {
      const shell = document.getElementById("workspaceShell");
      shell.classList.toggle("maximized");
      document.getElementById("maximizeBtn").querySelector("span").textContent = shell.classList.contains("maximized") ? "ย่อพื้นที่" : "ขยายพื้นที่";
    };
    activateOverview();
  }

  if (window.parent && window.parent !== window) {
    document.getElementById("backHomeLink").addEventListener("click", (event) => {
      event.preventDefault();
      if (window.parent.showOverview) window.parent.showOverview();
    });
  }

  (async () => {
    const params = new URLSearchParams(window.location.search);
    const key = params.get("module") || "students";
    const module = MODULES[key];
    const { user } = await apiRequest("/api/auth/me");
    if (!user) { window.location.href = "/login.html"; return; }
    if (!user.role) { window.location.href = "/pending.html"; return; }
    if ((key === "users" || key === "security") && !user.is_admin) {
      document.getElementById("errorBox").textContent = "ไม่มีสิทธิ์เข้าถึงหมวดบริหารระบบ";
      document.getElementById("errorBox").classList.add("visible");
      document.getElementById("featureGrid").innerHTML = "";
      document.getElementById("moduleNotice").style.display = "none";
      return;
    }
    if (!module) {
      document.getElementById("errorBox").textContent = "ไม่พบหมวดงานที่ต้องการ";
      document.getElementById("errorBox").classList.add("visible");
      return;
    }
    renderModule(key, module);
  })();
</script>
</body>
</html>
