<!DOCTYPE html>

<meta charset="UTF-8" />

<link rel="stylesheet" href="/css/style.css" />
<style>
  .module-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:24px; }
  .module-kicker { color:var(--color-ochre-600); font-size:13px; font-weight:700; margin-bottom:4px; }
  .module-description { color:var(--color-text-muted); margin:0; max-width:720px; }
  .module-count { flex-shrink:0; background:rgba(59,75,174,.1); color:var(--color-forest-700); border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600; }
  .feature-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:14px; }
  .feature-card { background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); padding:18px; min-height:132px; display:flex; flex-direction:column; }
  .feature-number { width:28px; height:28px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; background:var(--color-forest-900); color:#fff; font-size:12px; font-weight:700; margin-bottom:12px; }
  .feature-card h3 { font-size:15px; line-height:1.45; margin-bottom:6px; }
  .feature-card p { color:var(--color-text-muted); font-size:13px; margin:0 0 12px; }
  .feature-footer { margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .feature-status { font-size:11px; color:var(--color-text-muted); }
  .feature-status.ready { color:var(--color-success); font-weight:600; }
  .feature-link { font-size:12px; font-weight:600; text-decoration:none; }
  .quick-actions { display:flex; flex-wrap:wrap; gap:10px; margin:0 0 24px; }
  .quick-actions .btn { width:auto; padding:9px 16px; text-decoration:none; }
  .notice { margin-top:24px; background:#fff8df; border:1px solid #ead99b; border-radius:var(--radius-lg); padding:14px 16px; color:#6d5813; font-size:13px; }
  @media (max-width:640px) {
    .module-head { flex-direction:column; gap:10px; }
    .feature-grid { grid-template-columns:1fr; }
  }
</style>
</head>

  <div class="app-topbar">
    <div class="brand"><div class="brand-mark"><img src="/logo.jpg" alt="ตราโรงเรียน" /></div>โรงเรียนบ้านป่าเด็ง</div>
    <div class="app-user"><a href="/dashboard.html" id="backHomeLink">← กลับแดชบอร์ด</a></div>
  </div>

  <main class="app-main">
    <div class="module-head">
      <div>
        <div class="module-kicker" id="moduleKicker">หมวดงาน</div>
        <h2 id="moduleTitle">ระบบจัดการข้อมูลโรงเรียน</h2>
        <p class="module-description" id="moduleDescription"></p>
      </div>
      <div class="module-count" id="moduleCount"></div>
    </div>

    <div class="error-box" id="errorBox"></div>
    <div class="quick-actions" id="quickActions"></div>
    <section class="feature-grid" id="featureGrid"></section>
    <div class="notice" id="moduleNotice">
      รายการที่ระบุว่า “วางโครงสร้างแล้ว” ถูกเพิ่มไว้ในระบบเรียบร้อย และพร้อมต่อยอดฐานข้อมูล แบบฟอร์ม และขั้นตอนอนุมัติในเฟสถัดไป
    </div>
  </main>
</div>

  function renderModule(key, module) {
    document.title = `${module.title} — ระบบจัดการโรงเรียนบ้านป่าเด็ง`;
    document.getElementById("moduleKicker").textContent = `หมวดที่ ${module.number}`;
    document.getElementById("moduleTitle").textContent = module.title;
    document.getElementById("moduleDescription").textContent = module.description;
    document.getElementById("moduleCount").textContent = `${module.items.length} หัวข้องาน`;

    const actions = document.getElementById("quickActions");
    actions.innerHTML = module.actions.map((action) =>
      `<a class="btn ${action.secondary ? "btn-ghost" : "btn-primary"}" href="${action.href}">${action.label}</a>`
    ).join("");

    document.getElementById("featureGrid").innerHTML = module.items.map((item, index) => {
      const ready = module.ready.includes(index);
      return `<article class="feature-card">
        <span class="feature-number">${String(index + 1).padStart(2, "0")}</span>
        <h3>${item}</h3>
        <div class="feature-footer">
          <span class="feature-status ${ready ? "ready" : ""}">${ready ? "เปิดใช้งานแล้ว" : "วางโครงสร้างแล้ว"}</span>
        </div>
      </article>`;
    }).join("");
  }

  if (window.parent && window.parent !== window) {
    document.getElementById("backHomeLink").addEventListener("click", (event) => {
      event.preventDefault();
      if (window.parent.showOverview) window.parent.showOverview();
    });
  }

  (async () => {
    const params = new URLSearchParams(window.location.search);
    const key = params.get("module") || "students";
    const module = MODULES[key];
    const { user } = await apiRequest("/api/auth/me");
    if (!user) { window.location.href = "/login.html"; return; }
    if (!user.role) { window.location.href = "/pending.html"; return; }
    if ((key === "users" || key === "security") && !user.is_admin) {
      document.getElementById("errorBox").textContent = "ไม่มีสิทธิ์เข้าถึงหมวดบริหารระบบ";
      document.getElementById("errorBox").classList.add("visible");
      document.getElementById("featureGrid").innerHTML = "";
      document.getElementById("moduleNotice").style.display = "none";
      return;
    }
    if (!module) {
      document.getElementById("errorBox").textContent = "ไม่พบหมวดงานที่ต้องการ";
      document.getElementById("errorBox").classList.add("visible");
      return;
    }
    renderModule(key, module);
  })();
