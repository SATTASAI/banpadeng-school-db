<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตั้งค่า Passkey · โรงเรียนบ้านป่าเด็ง</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6fb;color:#183451;font:16px/1.6 system-ui,sans-serif}main{max-width:620px;margin:24px auto;padding:18px}section{background:white;border:1px solid #d6e1ed;border-radius:18px;padding:20px;margin:14px 0}h1{font-size:24px}h2{font-size:19px;margin-top:0}label{display:block;margin:12px 0}input,button{font:inherit;border:1px solid #c5d4e5;border-radius:10px;padding:10px 12px;max-width:100%;min-height:44px}input{display:block;width:100%}button{background:#1e5fc0;color:#fff;cursor:pointer}button:disabled{opacity:.6}.key{border-top:1px solid #e0e7ef;padding:12px 0;overflow-wrap:anywhere}.key small{display:block;color:#61728a}.key button{margin-top:8px;background:white;color:#a52d40}a{color:#245f9d}#status{white-space:pre-line}p{overflow-wrap:anywhere}nav{display:flex;gap:14px;flex-wrap:wrap}</style></head><body><main><nav><a id="back" href="/">← กลับระบบ</a><a id="signin" href="/login.html">เข้าสู่ระบบ</a></nav><h1>Face ID / Passkey</h1><p>ใช้ใบหน้า ลายนิ้วมือ หรือ PIN ตามอุปกรณ์ ตั้งค่าครั้งเดียวและยังใช้รหัสผ่านสำรองได้</p><p id="status" role="status" aria-live="polite"></p><section><h2>เพิ่ม Passkey</h2><p id="scope">บัญชีโรงเรียนใช้ Passkey ร่วมกันบนระบบหลัก ผลการเรียน สื่อการสอน ภาพกิจกรรม และจิตอาสา</p><form id="enroll"><label>ชื่ออุปกรณ์<input id="name" maxlength="80" value="Passkey ของฉัน" required></label><label>รหัสผ่านปัจจุบัน (ยืนยันครั้งนี้)<input id="password" type="password" autocomplete="current-password" required></label><button id="add">เปิดใช้ Face ID / Passkey</button></form></section><section><h2>Passkey ที่ลงทะเบียน</h2><div id="keys">กำลังโหลด…</div></section></main><script src="/passkeys-client.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),p=SchoolPasskeys;const mode=document.documentElement.dataset.passkeyAuth;if(mode==='notify'){ $('back').href='/admin';$('signin').href='/admin';$('scope').textContent='Passkey นี้ใช้สำหรับแอดมิน School Notify และกล่องข้อความแอดมิน';}if(mode==='bank'){$('back').href='/app.html';$('signin').href='/login.html';$('scope').textContent='Passkey นี้ใช้กับบัญชีธนาคารโรงเรียนนี้';}
async function load(){try{const {passkeys}=await p.api('');$('keys').replaceChildren();if(!passkeys.length)$('keys').textContent='ยังไม่มี Passkey';for(const k of passkeys){const row=document.createElement('div');row.className='key';const title=document.createElement('strong');title.textContent=k.name;const small=document.createElement('small');small.textContent='เพิ่มเมื่อ '+new Date(k.created_at).toLocaleString('th-TH');const del=document.createElement('button');del.type='button';del.textContent='ลบ Passkey';del.onclick=async()=>{if(!confirm('ลบ Passkey นี้? รหัสผ่านเดิมยังใช้ได้'))return;del.disabled=true;try{await p.api('/'+encodeURIComponent(k.id),null,'DELETE');await load();$('status').textContent='ลบ Passkey แล้ว';}catch(e){$('status').textContent=p.message(e);del.disabled=false;}};row.append(title,small,del);$('keys').append(row);}$('signin').hidden=true;return true;}catch(e){$('keys').textContent='กรุณาเข้าสู่ระบบก่อนจัดการ Passkey';$('status').textContent=p.message(e);$('add').disabled=true;return false;}}
if(!p.supported()){$('status').textContent='อุปกรณ์หรือเบราว์เซอร์นี้ไม่รองรับ Passkey กรุณาเปิดด้วย Safari หรือ Chrome รุ่นปัจจุบัน';$('add').disabled=true;return;}await load();$('enroll').onsubmit=async e=>{e.preventDefault();$('add').disabled=true;$('status').textContent='กำลังเพิ่ม Passkey…';try{await p.register($('password').value,$('name').value);$('status').textContent='เปิดใช้ Passkey แล้ว ครั้งต่อไปเลือกเข้าสู่ระบบด้วย Passkey ได้เลย';await load();}catch(e){$('status').textContent=p.message(e);}finally{$('password').value='';$('add').disabled=false;}};})();
</script></body></html>
