<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ฝ่ายงาน — ระบบจัดการโรงเรียนบ้านป่าเด็ง</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/project-workflow.css" />
<style>
  .section-title { display:flex; justify-content:space-between; align-items:center; margin-top:32px; margin-bottom:12px; }
  .section-title .btn { width:auto; padding:8px 16px; font-size:13px; }
  .topic-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:14px; }
  .topic-btn { background:var(--color-forest-700); color:#fff; border:none; border-radius:var(--radius-lg); padding:22px 18px; font-family:var(--font-body); font-size:15px; font-weight:600; cursor:pointer; text-align:left; }
  .topic-btn:hover { background:var(--color-forest-900); }
  .project-card { position:relative; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); padding:16px 18px 14px 20px; margin-bottom:12px; overflow:hidden; }
  .project-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:#3f63d6; }
  .project-card.st-completed::before { background:var(--color-success,#23754a); }
  .project-card.st-cancelled::before { background:#a3adb8; }
  .project-card.st-cancelled { opacity:.75; }
  .project-card.search-target { border-color:#72afe1; background:#f1f8fe; box-shadow:0 10px 28px rgba(37,133,216,.13); }
  .pc-top { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:start; }
  .project-name { font-weight:700; font-size:17px; line-height:1.35; color:var(--color-forest-900); }
  .pc-alert { display:inline-block; margin-left:6px; padding:1px 8px; border-radius:999px; background:#fbe7ea; color:#bd3544; font-size:11px; font-weight:600; vertical-align:middle; }
  .pc-sub { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .pc-chip { padding:2px 9px; border-radius:999px; background:#eef2f8; color:#4f5d6e; font-size:12px; font-weight:600; }
  .pc-chip.st-ongoing { background:#e7edfd; color:#3456c8; }
  .pc-chip.st-completed { background:#e3f5eb; color:#23754a; }
  .pc-chip.st-cancelled { background:#eef0f2; color:#6f7a86; }
  .pc-desc { margin-top:6px; font-size:13px; color:var(--color-text-muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .pc-owner { margin-top:4px; font-size:12px; color:var(--color-text-muted); }
  .pc-focus { text-align:right; min-width:150px; }
  .pc-focus span { display:block; font-size:12px; color:var(--color-text-muted); font-weight:600; }
  .pc-focus strong { display:block; font-size:26px; line-height:1.15; color:var(--color-success,#23754a); font-variant-numeric:tabular-nums; }
  .pc-focus.over strong { color:var(--color-danger); }
  .pc-focus small { font-size:12px; color:var(--color-text-muted); }
  .pc-bar { display:flex; height:8px; margin-top:12px; border-radius:999px; background:#e9eef4; overflow:hidden; }
  .pc-bar i { display:block; height:100%; }
  .pc-bar .paid { background:#3f63d6; }
  .pc-bar .reserved { background:#f0b440; }
  .pc-legend { display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:7px; font-size:12px; color:var(--color-text-muted); }
  .pc-legend b { font-weight:600; color:var(--color-forest-900); font-variant-numeric:tabular-nums; }
  .pc-legend .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  .project-actions { display:flex; gap:7px; flex-wrap:wrap; margin-top:12px; padding-top:12px; border-top:1px dashed var(--color-border); }
  .project-actions .btn { width:auto; padding:6px 11px; font-size:12px; }
  .project-actions .btn-files { background:#eef2fd; color:#3456c8; border:1px solid #cfdaf7; font-weight:700; }
  .viewer-mode .project-actions .btn:not(.btn-files), .viewer-mode #newTopicBtn, .viewer-mode .topic-actions { display:none !important; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(28,38,32,0.4); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal { background:var(--color-surface); border-radius:var(--radius-lg); padding:28px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; }
  .modal-actions { display:flex; gap:10px; margin-top:20px; }
  .assignee-checks { display:flex; flex-direction:column; gap:6px; max-height:140px; overflow-y:auto; border:1px solid var(--color-border); border-radius:var(--radius-md); padding:10px; }
  .assignee-checks label { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:400; }
  .expense-modal-panel { max-width:980px; padding:0; overflow:hidden; }
  .expense-modal-head { display:flex; justify-content:space-between; gap:18px; align-items:flex-start; padding:22px 24px 16px; border-bottom:1px solid var(--color-border); }
  .expense-modal-head p { margin:2px 0 0; color:var(--color-text-muted); font-size:13px; }
  .expense-modal-head .btn { width:auto; padding:7px 11px; }
  .expense-modal-body { max-height:calc(88vh - 82px); overflow:auto; padding:18px 24px 24px; }
  .expense-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
  .expense-summary-card { min-width:0; padding:12px 14px; background:rgba(238,245,251,.72); border:1px solid var(--color-border); border-radius:13px; }
  .expense-summary-card span { display:block; color:var(--color-text-muted); font-size:11px; }
  .expense-summary-card strong { display:block; overflow:hidden; text-overflow:ellipsis; color:var(--color-forest-900); font-size:17px; white-space:nowrap; }
  .expense-summary-card.paid strong { color:var(--color-ocean-700); }
  .expense-summary-card.remaining strong { color:var(--color-success); }
  .expense-summary-card.over strong { color:var(--color-danger); }
  .expense-form-card { padding:16px; margin-bottom:16px; background:rgba(255,255,255,.72); border:1px solid var(--color-border); border-radius:15px; }
  .expense-form-card h3 { margin-bottom:12px; font-size:15px; }
  .expense-form-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .expense-form-grid .field { margin:0; }
  .expense-form-grid .span-2 { grid-column:span 2; }
  .expense-form-grid .span-3 { grid-column:1/-1; }
  .expense-form-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .expense-form-actions .btn { width:auto; padding:8px 13px; font-size:13px; }
  .expense-table-wrap { overflow:auto; border:1px solid var(--color-border); border-radius:14px; background:rgba(255,255,255,.72); }
  .expense-table-wrap table { min-width:820px; }
  .expense-status { display:inline-flex; padding:3px 8px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap; }
  .expense-status.draft { background:#EEF1F4; color:#657485; }
  .expense-status.pending { background:#FFF2D9; color:#9B5D0A; }
  .expense-status.approved { background:#E7F0FD; color:#2866A3; }
  .expense-status.paid { background:#E3F5EB; color:#23754A; }
  .expense-status.rejected,.expense-status.cancelled { background:#F9E6E8; color:#A6404C; }
  .expense-row-actions { display:flex; gap:5px; }
  .expense-row-actions button { border:0; border-radius:8px; padding:5px 8px; background:#EAF2F8; color:var(--color-forest-700); cursor:pointer; font:600 11px var(--font-body); }
  @media (max-width:720px) {
    .expense-summary,.expense-form-grid { grid-template-columns:1fr 1fr; }
    .expense-form-grid .span-2,.expense-form-grid .span-3 { grid-column:1/-1; }
    .expense-modal-head,.expense-modal-body { padding-left:16px; padding-right:16px; }
    .pc-top { grid-template-columns:1fr; }
    .pc-focus { text-align:left; }
  }
</style>
<link rel="stylesheet" href="/css/project-balance.css"><link rel="stylesheet" href="/css/project-allocation-chart.css"><link rel="stylesheet" href="/css/project-files.css"></head>
<body>
<div class="app-shell">
  <div class="app-topbar">
    <div class="brand"><div class="brand-mark"><img src="/logo.jpg" alt="ตราโรงเรียน" /></div>โรงเรียนบ้านป่าเด็ง</div>
    <div class="app-user"><a href="/departments.html">← กลับ 5 ฝ่ายงาน</a></div>
  </div>

  <div class="app-main">
    <h2 id="deptTitle" style="margin-bottom:2px;">ฝ่ายงาน</h2>
    <p style="color:var(--color-text-muted); margin:0;">หัวข้องานและโครงการของฝ่ายนี้</p>

    <div class="error-box" id="errorBox"></div>

    <div class="section-title">
      <h3 style="margin:0;">หัวข้องาน</h3>
      <button class="btn btn-ghost" id="newTopicBtn" style="display:none;">+ เพิ่มหัวข้องาน</button>
    </div>
    <div class="topic-grid" id="topicGrid"></div>

    <div id="projectAllocationChart"></div>
    <div class="section-title">
      <h3 style="margin:0;">โครงการ</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-primary" id="newProjectBtn" style="display:none;">+ เพิ่มโครงการ</button>
      </div>
    </div>
    <div id="projectList"></div>
  </div>
</div>

<div class="modal-backdrop" id="topicModal" style="display:none;">
  <div class="modal">
    <h2 id="topicModalTitle" style="margin-bottom:16px;">หัวข้องาน</h2>
    <div class="field">
      <label>ชื่อหัวข้อ</label>
      <input type="text" id="tTitle" />
    </div>
    <div class="field">
      <label>รายละเอียด</label>
      <input type="text" id="tDescription" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="deleteTopicBtn" style="display:none; color:var(--color-danger); border-color:var(--color-danger);">ลบหัวข้องาน</button>
      <button class="btn btn-ghost" id="cancelTopicBtn">ยกเลิก</button>
      <button class="btn btn-primary" id="saveTopicBtn">บันทึก</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="projectModal" style="display:none;">
  <div class="modal">
    <h2 id="projectModalTitle" style="margin-bottom:16px;">โครงการ</h2>
    <div class="field">
      <label>ชื่อโครงการ</label>
      <input type="text" id="pName" />
    </div>
    <div class="field">
      <label>ยอดจัดสรรโครงการ (เจ้าหน้าที่การเงิน)</label>
      <input type="number" id="pBudget" min="0" step="0.01" />
    </div>
    <div class="field"><label>ปีงบประมาณ</label><select id="pFiscalYear"></select></div>
    <div class="field"><label>ประเภทเงินโครงการ *</label><select id="pFundingType" required><option value="">เลือกประเภทเงิน</option><option value="subsidy">งบอุดหนุน</option><option value="free_education">งบเรียนฟรี 15 ปี</option><option value="school_income">งบรายได้สถานศึกษา</option></select></div>
    <div class="field" id="progressField" style="display:none;">
      <label>% ความคืบหน้า</label>
      <input type="number" id="pProgress" min="0" max="100" />
    </div>
    <div class="field" id="statusField" style="display:none;">
      <label>สถานะ</label>
      <select class="plain" id="pStatus" style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--color-border); font-family:var(--font-body); background:var(--color-bg);">
        <option value="ongoing">กำลังดำเนินการ</option>
        <option value="completed">เสร็จสิ้น</option>
        <option value="cancelled">ยกเลิก</option>
      </select>
    </div>
    <div class="field">
      <label>รายละเอียด</label>
      <input type="text" id="pDescription" />
    </div>
    <div class="field" id="ownersField" style="display:none;">
      <label>ผู้ดูแลโครงการ</label>
      <div class="assignee-checks" id="ownerChecks"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="deleteProjectBtn" style="display:none; color:var(--color-danger); border-color:var(--color-danger);">ลบโครงการ</button>
      <button class="btn btn-ghost" id="cancelProjectBtn">ยกเลิก</button>
      <button class="btn btn-primary" id="saveProjectBtn">บันทึก</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script><script src="/js/project-allocation-chart.js"></script><script src="/js/project-balance.js"></script><script src="/js/project-files.js"></script>
<script>
  const DEPT_LABELS = {
    academic: "ฝ่ายบริหารงานวิชาการ",
    early_childhood: "ฝ่ายปฐมวัย (งานอนุบาล)",
    budget: "ฝ่ายบริหารงานงบประมาณ",
    personnel: "ฝ่ายบริหารงานบุคคล",
    general: "ฝ่ายบริหารงานทั่วไป",
  };
  const STATUS_LABEL = { ongoing: "กำลังดำเนินการ", completed: "เสร็จสิ้น", cancelled: "ยกเลิก" };
  const EXPENSE_STATUS_LABEL = { draft: "ร่าง", pending: "รอตรวจสอบ", approved: "อนุมัติแล้ว", paid: "จ่ายแล้ว", rejected: "ไม่อนุมัติ", cancelled: "ยกเลิก" };
  const EXPENSE_CATEGORY_LABEL = { materials: "วัสดุ", equipment: "ครุภัณฑ์", services: "ค่าใช้สอย/จ้างบริการ", compensation: "ค่าตอบแทน", utilities: "สาธารณูปโภค", travel: "ค่าเดินทาง", food: "ค่าอาหาร/อาหารว่าง", opening_balance: "ยอดยกมา", other: "อื่น ๆ" };

  const dept = new URLSearchParams(window.location.search).get("dept");
  const requestedProjectId = Number(new URLSearchParams(window.location.search).get("project"));
  let currentUser = null;
  let workingYear = null; // ปีงบประมาณของโครงการในปีการศึกษาปัจจุบัน
  let allUsers = [];
  let editingTopicId = null;
  let editingProjectId = null;
  let currentProjects = [];
  let currentExpenseProjectId = null;
  let currentExpenseData = null;
  let editingExpenseId = null;

  if (!dept || !DEPT_LABELS[dept]) {
    document.body.innerHTML = "<p style='padding:40px;'>ไม่พบฝ่ายงานนี้ <a href='/departments.html'>กลับ</a></p>";
    throw new Error("invalid department");
  }
  document.getElementById("deptTitle").textContent = DEPT_LABELS[dept];

  function money(n) {
    return Number(n || 0).toLocaleString("th-TH", { maximumFractionDigits: 2 }) + " บาท";
  }

  const escapeHtml = (value) => String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

  function thaiDate(value) {
    if (!value) return "-";
    const date = new Date(`${value}T00:00:00`);
    return Number.isNaN(date.getTime()) ? value : new Intl.DateTimeFormat("th-TH", { day: "numeric", month: "short", year: "numeric" }).format(date);
  }

  async function loadTopics() {
    const { topics } = await apiRequest(`/api/departments/${dept}/topics`);
    const grid = document.getElementById("topicGrid");
    if (topics.length === 0) {
      grid.innerHTML = `<div class="empty-state">ยังไม่มีหัวข้องานในฝ่ายนี้</div>`;
      return;
    }
    grid.innerHTML = topics
      .map((t) => `<button class="topic-btn" data-topic="${t.id}">${t.title}</button>`)
      .join("");
    grid.querySelectorAll("[data-topic]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const t = topics.find((x) => x.id == btn.getAttribute("data-topic"));
        openTopicModal(t);
      });
    });
  }

  function openTopicModal(topic) {
    editingTopicId = topic ? topic.id : null;
    document.getElementById("topicModalTitle").textContent = topic ? "แก้ไขหัวข้องาน" : "เพิ่มหัวข้องาน";
    document.getElementById("tTitle").value = topic ? topic.title : "";
    document.getElementById("tDescription").value = topic ? topic.description || "" : "";
    document.getElementById("deleteTopicBtn").style.display = topic && currentUser.is_admin ? "inline-flex" : "none";
    document.getElementById("topicModal").style.display = "flex";
  }
  document.getElementById("cancelTopicBtn").addEventListener("click", () => {
    document.getElementById("topicModal").style.display = "none";
  });
  document.getElementById("deleteTopicBtn").addEventListener("click", async () => {
    if (!editingTopicId) return;
    if (!confirm("ยืนยันลบหัวข้องานนี้?")) return;
    try {
      await apiRequest(`/api/topics/${editingTopicId}`, { method: "DELETE" });
      document.getElementById("topicModal").style.display = "none";
      await loadTopics();
    } catch (err) {
      alert(err.message);
    }
  });
  document.getElementById("newTopicBtn").addEventListener("click", () => openTopicModal(null));
  document.getElementById("saveTopicBtn").addEventListener("click", async () => {
    const title = document.getElementById("tTitle").value.trim();
    const description = document.getElementById("tDescription").value.trim();
    if (!title) return alert("กรุณากรอกชื่อหัวข้อ");
    try {
      if (editingTopicId) {
        await apiRequest(`/api/topics/${editingTopicId}`, { method: "PATCH", body: { title, description } });
      } else {
        await apiRequest(`/api/departments/${dept}/topics`, { method: "POST", body: { title, description } });
      }
      document.getElementById("topicModal").style.display = "none";
      await loadTopics();
    } catch (err) {
      alert(err.message);
    }
  });

  function renderOwnerChecks(selectedIds) {
    const container = document.getElementById("ownerChecks");
    container.innerHTML = allUsers
      .map(
        (u) => `<label><input type="checkbox" value="${u.id}" ${selectedIds.includes(u.id) ? "checked" : ""} /> ${u.full_name}</label>`
      )
      .join("");
  }

  async function loadProjects() {
    const { projects } = await apiRequest(`/api/departments/${dept}/projects`);
    currentProjects = projects;
    ProjectAllocationChart.render(document.getElementById("projectAllocationChart"),projects,"ทุกปีงบประมาณ",dept);
    const list = document.getElementById("projectList");
    if (projects.length === 0) {
      list.innerHTML = `<div class="empty-state">ยังไม่มีโครงการในฝ่ายนี้</div>`;
      return;
    }
    list.innerHTML = projects
      .map((p) => {
        const canManage = currentUser.is_admin || p.owners.some((o) => o.user_id === currentUser.id);
        const remaining = p.remaining_amount;
        const budget = Number(p.budget_amount || 0);
        const pct = (v) => budget > 0 ? Math.max(0, Math.min(100, (Number(v || 0) / budget) * 100)) : 0;
        const num = (n) => Number(n || 0).toLocaleString("th-TH", { maximumFractionDigits: 2 });
        const funding = ({subsidy:"งบอุดหนุน",free_education:"งบเรียนฟรี 15 ปี",school_income:"งบรายได้สถานศึกษา"})[p.funding_type] || "ยังไม่ระบุประเภทเงิน";
        const alerts = p.unread_count ? `<span class="pc-alert">แจ้งเตือน ${p.unread_count}</span>` : "";
        return `
        <div class="project-card st-${p.status}" data-project-id="${p.id}">
          <div class="pc-top">
            <div>
              <div class="project-name">${escapeHtml(p.name)}${alerts}</div>
              <div class="pc-sub">
                <span class="pc-chip st-${p.status}">${STATUS_LABEL[p.status] || p.status}</span>
                <span class="pc-chip">ปีงบ ${p.fiscal_year || "-"}</span>
                <span class="pc-chip">${funding}</span>
                <span class="pc-chip">งาน ${p.progress_percent}%</span>
              </div>
              ${p.description ? `<div class="pc-desc">${escapeHtml(p.description)}</div>` : ""}
              <div class="pc-owner">ผู้ดูแล: ${p.owners.map((o) => escapeHtml(o.full_name)).join(", ") || "-"}</div>
            </div>
            <div class="pc-focus ${remaining < 0 ? "over" : ""}">
              <span>${remaining < 0 ? "เกินงบ" : "คงเหลือ"}</span>
              <strong>${num(Math.abs(remaining))}</strong>
              <small>จากงบ ${num(budget)} บาท</small>
            </div>
          </div>
          <div class="pc-bar" title="จ่ายแล้ว / รอดำเนินการ"><i class="paid" style="width:${pct(p.spent_amount)}%"></i><i class="reserved" style="width:${Math.min(pct(p.reserved_amount), 100 - pct(p.spent_amount))}%"></i></div>
          <div class="pc-legend">
            <span><i class="dot" style="background:#3f63d6"></i>จ่ายแล้ว <b>${num(p.spent_amount)}</b></span>
            <span><i class="dot" style="background:#f0b440"></i>รอดำเนินการ <b>${num(p.reserved_amount)}</b></span>
            <span>ขอได้อีก <b>${num(p.available_amount)}</b></span>
          </div>
          ${ProjectBalance.field(p,currentUser.is_admin)}
          ${p.notification_message ? `<div class="wf-notice" style="margin-top:8px;">${escapeHtml(p.notification_message)}</div>` : ""}
          <div class="project-actions">
            <button class="btn btn-files" data-project-files="${p.id}">📁 เอกสารโครงการ</button>
            <a class="btn btn-ghost btn-docs" href="/project-documents.html?dept=${dept}&project=${p.id}">เบิกจ่าย / ความคืบหน้า</a>
            ${canManage ? `<a class="btn btn-primary" href="/project-documents.html?dept=${dept}&project=${p.id}&new=1">แจ้งขอเบิกจ่าย</a>` : ""}
            ${canManage ? `<button class="btn btn-ghost" data-edit="${p.id}">แก้ไขโครงการ</button>` : ""}
          </div>
        </div>`;
      })
      .join("");

    list.querySelectorAll("[data-edit]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const p = projects.find((x) => x.id == btn.getAttribute("data-edit"));
        openProjectModal(p);
      });
    });
    if (requestedProjectId) {
      const target = list.querySelector(`[data-project-id="${requestedProjectId}"]`);
      if (target) {
        target.classList.add("search-target");
        requestAnimationFrame(() => target.scrollIntoView({ behavior:"smooth", block:"center" }));
      }
    }
  }

  function openProjectModal(project) {
    editingProjectId = project ? project.id : null;
    document.getElementById("projectModalTitle").textContent = project ? "แก้ไขโครงการ" : "เพิ่มโครงการ";
    document.getElementById("pName").value = project ? project.name : "";
    document.getElementById("pBudget").value = project ? project.budget_amount || 0 : 0;
    document.getElementById("pBudget").readOnly = !currentUser.is_admin;
    const fy = workingYear || calendarFiscalYear();
    const chosenYear = Number(project?.fiscal_year || fy);
    document.getElementById("pFiscalYear").innerHTML = [...new Set([fy-2,fy-1,fy,fy+1,chosenYear])].sort().map(y => `<option value="${y}" ${y===chosenYear?"selected":""}>${y}</option>`).join("");
    document.getElementById("pFiscalYear").disabled = Boolean(project);
    document.getElementById("pDescription").value = project ? project.description || "" : "";
    document.getElementById("pFundingType").value = project?.funding_type || "";
    document.getElementById("progressField").style.display = project ? "block" : "none";
    document.getElementById("statusField").style.display = project ? "block" : "none";
    if (project) {
      document.getElementById("pProgress").value = project.progress_percent;
      document.getElementById("pStatus").value = project.status;
    }
    document.getElementById("ownersField").style.display = currentUser.is_admin ? "block" : "none";
    if (currentUser.is_admin) {
      renderOwnerChecks(project ? project.owners.map((o) => o.user_id) : []);
    }
    document.getElementById("deleteProjectBtn").style.display = project && currentUser.is_admin ? "inline-flex" : "none";
    document.getElementById("projectModal").style.display = "flex";
  }
  document.getElementById("cancelProjectBtn").addEventListener("click", () => {
    document.getElementById("projectModal").style.display = "none";
  });
  document.getElementById("deleteProjectBtn").addEventListener("click", async () => {
    if (!editingProjectId) return;
    if (!confirm("ยืนยันลบโครงการนี้? การลบไม่สามารถย้อนกลับได้")) return;
    try {
      await apiRequest(`/api/projects/${editingProjectId}`, { method: "DELETE" });
      document.getElementById("projectModal").style.display = "none";
      await loadProjects();
    } catch (err) {
      alert(err.message);
    }
  });
  document.getElementById("newProjectBtn").addEventListener("click", () => openProjectModal(null));
  document.getElementById("saveProjectBtn").addEventListener("click", async () => {
    const name = document.getElementById("pName").value.trim();
    const budget_amount = Number(document.getElementById("pBudget").value || 0);
    const description = document.getElementById("pDescription").value.trim();
    if (!name) return alert("กรุณากรอกชื่อโครงการ");
    if (budget_amount < 0) return alert("ยอดงบประมาณต้องไม่น้อยกว่า 0");

    const funding_type = document.getElementById("pFundingType").value;
    if (!funding_type) return alert("กรุณาเลือกประเภทเงินโครงการ");
    const body = { name, description, funding_type };
    if (currentUser.is_admin) body.budget_amount = budget_amount;
    if (!editingProjectId) body.fiscal_year = Number(document.getElementById("pFiscalYear").value);
    if (editingProjectId) {
      body.progress_percent = Number(document.getElementById("pProgress").value || 0);
      body.status = document.getElementById("pStatus").value;
      if (currentUser.is_admin) {
        body.owner_ids = Array.from(document.querySelectorAll("#ownerChecks input:checked")).map((el) => Number(el.value));
      }
    } else {
      body.owner_ids = Array.from(document.querySelectorAll("#ownerChecks input:checked")).map((el) => Number(el.value));
    }

    const saveButton = document.getElementById("saveProjectBtn");
    if (saveButton.disabled) return;
    saveButton.disabled = true;
    const save = () => apiRequest(editingProjectId ? `/api/projects/${editingProjectId}` : `/api/departments/${dept}/projects`, {method:editingProjectId ? "PATCH" : "POST",body});
    try {
      try { await save(); }
      catch (err) {
        if (err.data?.code !== "duplicate_project") throw err;
        if (!confirm("ชื่อโครงการและรายละเอียดตรงกับโครงการที่มีอยู่ทั้งหมด\nแน่ใจใช่ไหมที่จะกดยืนยัน?")) return;
        body.confirm_duplicate = true;
        await save();
      }
      document.getElementById("projectModal").style.display = "none";
      await loadProjects();
    } catch (err) {
      alert(err.message);
    } finally { saveButton.disabled = false; }
  });

  (async () => {
    const { user } = await apiRequest("/api/auth/me");
    if (!user) { window.location.href = "/login.html"; return; }
    if (!user.role) { window.location.href = "/pending.html"; return; }
    currentUser = user;
    workingFiscalYear().then((y) => { workingYear = y; });
    const balanceInbox=document.createElement("div");document.getElementById("projectList").before(balanceInbox);ProjectBalance.mountInbox(balanceInbox,{department:dept});
    window.addEventListener("project-balances-updated",()=>loadProjects());

    document.getElementById("newProjectBtn").style.display = "inline-flex";
    if (user.role === "viewer") {
      document.getElementById("newProjectBtn").style.display = "none";
      document.body.classList.add("viewer-mode");
    }
    if (user.is_admin) {
      document.getElementById("newTopicBtn").style.display = "inline-flex";
      document.getElementById("newProjectBtn").style.display = "inline-flex";
      const { users } = await apiRequest("/api/users");
      allUsers = users;
    }

    await loadTopics();
    await loadProjects();
    setInterval(() => { if (!document.hidden && !document.querySelector(".pb-dialog[open]") && !document.activeElement?.closest?.("[data-balance-field]") && document.getElementById("projectModal").style.display !== "flex") loadProjects().catch(() => {}); },15000);
  })();
</script>
</body>
</html>
