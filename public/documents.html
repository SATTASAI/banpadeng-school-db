<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>เอกสารและคลังไฟล์</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .forms-page{width:100%;max-width:1180px;margin:0 auto}.forms-page *{box-sizing:border-box;min-width:0}
    .forms-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}.forms-bar input[type=search]{flex:1 1 260px;min-height:44px;border:1px solid var(--color-border,#d6e2ee);border-radius:12px;padding:0 14px;font:inherit}
    .chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #d6e2ee;background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:#30506f}.chip[aria-pressed=true]{background:#2f6fd6;border-color:#2f6fd6;color:#fff}
    .dept{margin-top:20px}.dept h3{font-size:16px;margin:0 0 10px;color:#17324d}
    .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
    .form-card{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid #e1eaf3;border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(26,52,77,.05)}
    .form-card .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;background:#d64545}
    .form-card .ic.docx{background:#2f6fd6}.form-card .ic.xlsx{background:#1f8a55}.form-card .ic.pptx{background:#d9822b}.form-card .ic.img{background:#7a5bd1}
    .form-card strong{font-size:15px;line-height:1.45;color:#17324d;overflow-wrap:anywhere}.form-card .meta{font-size:12.5px;color:#607991}
    .form-card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}.dl{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:12px;background:#2f6fd6;color:#fff;text-decoration:none;font-weight:600}
    .dl.off{background:#c9d6e3;pointer-events:none}.mini{border:1px solid #d6e2ee;background:#fff;border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;color:#30506f}.mini.danger{color:#b83232;border-color:#f0cfcf}
    .empty{padding:40px 16px;text-align:center;color:#607991;background:#fff;border:1px dashed #d6e2ee;border-radius:16px;margin-top:16px}
    dialog.fd{width:min(520px,calc(100vw - 24px));border:1px solid #d6e2ee;border-radius:20px;padding:22px;color:#17324d}dialog.fd::backdrop{background:rgba(22,40,59,.35)}
    .fd .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.fd input,.fd select{min-height:42px;border:1px solid #d6e2ee;border-radius:10px;padding:0 10px;font:inherit}.fd input[type=file]{padding:8px}
    .fd .row{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}.fd .err{color:#b83232;font-size:13px;min-height:1em}
  </style>
</head>
<body>
<main class="app-main forms-page">
  <a class="page-back" href="/dashboard.html">← กลับแดชบอร์ด</a>
  <h2>เอกสารและคลังไฟล์</h2>
  <p style="color:var(--color-text-muted)">คลังแบบฟอร์มของโรงเรียน เลือกแบบฟอร์มแล้วกดดาวน์โหลดได้ทันที</p>
  <div class="forms-bar">
    <input id="q" type="search" autocomplete="off" placeholder="ค้นหาแบบฟอร์ม เช่น จัดซื้อ ลา ขออนุมัติ" />
    <button class="btn btn-primary" id="addBtn" hidden style="width:auto">+ เพิ่มแบบฟอร์ม</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="list">กำลังโหลด...</div>
</main>
<dialog class="fd" id="dlg">
  <form id="fForm" method="dialog">
    <h3 id="fTitle" style="margin-top:0">เพิ่มแบบฟอร์ม</h3>
    <div class="field"><label for="fName">ชื่อแบบฟอร์ม *</label><input id="fName" required maxlength="200" /></div>
    <div class="field"><label for="fDept">ฝ่ายงาน *</label><select id="fDept"></select></div>
    <div class="field"><label for="fKeys">คำค้นหา (ไม่บังคับ)</label><input id="fKeys" maxlength="500" placeholder="เช่น จัดซื้อ พัสดุ ขออนุมัติ" /></div>
    <div class="field"><label for="fFile" id="fFileLabel">ไฟล์แบบฟอร์ม *</label><input id="fFile" type="file" accept=".pdf,.docx,.xlsx,.pptx,image/jpeg,image/png" /><small style="color:#607991">PDF ไม่เกิน 1 MB · DOCX/XLSX/PPTX ไม่เกิน 25 MB</small></div>
    <div class="err" id="fErr"></div>
    <div class="row"><button type="button" class="mini" id="fCancel">ยกเลิก</button><button class="btn btn-primary" id="fSave" style="width:auto">บันทึก</button></div>
  </form>
</dialog>
<script src="/js/api.js"></script>
<script src="/js/file-upload.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DEPT={academic:"วิชาการ",early_childhood:"ปฐมวัย (งานอนุบาล)",budget:"งบประมาณ",personnel:"บุคคล",general:"บริหารทั่วไป","student-support":"ดูแลช่วยเหลือ",admin:"ทั่วไป / อื่น ๆ"};
const TYPE="แบบฟอร์ม";
let forms=[],canManage=false,dept="",editing=null,busy=false,searchVersion=0;
$("fDept").innerHTML=Object.entries(DEPT).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
function sizeText(n){if(!Number(n))return "";return n<1024*1024?`${Math.max(1,Math.round(n/1024))} KB`:`${(n/1024/1024).toFixed(2)} MB`}
function ext(name){const e=String(name||"").split(".").pop().toLowerCase();return ["jpg","jpeg","png","webp","gif"].includes(e)?"img":e}
function card(x){
  const has=Boolean(x.attachment_id&&x.file_url),e=ext(x.file_name);
  return `<article class="form-card"><div class="ic ${e}">${esc(e==="img"?"IMG":e.toUpperCase()||"FILE")}</div><strong>${esc(x.title)}</strong>
  <span class="meta">${esc(DEPT[x.department]||x.department)}${has?` · ${sizeText(x.file_size)}`:" · ยังไม่มีไฟล์"}</span>
  <div class="acts"><a class="dl${has?"":" off"}" href="${has?esc(x.file_url):"#"}" target="_blank" rel="noopener" download>⬇ ดาวน์โหลด</a>
  ${canManage?`<button class="mini" data-edit="${x.id}">แก้ไข</button><button class="mini danger" data-del="${x.id}">ลบ</button>`:""}</div></article>`;
}
function render(){
  const depts=[...new Set(forms.map(f=>f.department))];
  $("chips").innerHTML=depts.length>1?[["","ทั้งหมด"],...depts.map(d=>[d,DEPT[d]||d])].map(([k,v])=>`<button class="chip" data-dept="${k}" aria-pressed="${k===dept}">${esc(v)}</button>`).join(""):"";
  const rows=forms.filter(f=>!dept||f.department===dept);
  if(!rows.length){$("list").innerHTML=`<div class="empty">${$("q").value?"ไม่พบแบบฟอร์มที่ค้นหา":"ยังไม่มีแบบฟอร์ม"}</div>`;return}
  const groups={};rows.forEach(f=>(groups[f.department]??=[]).push(f));
  $("list").innerHTML=Object.keys(DEPT).filter(k=>groups[k]).concat(Object.keys(groups).filter(k=>!DEPT[k]))
    .map(k=>`<section class="dept"><h3>ฝ่าย${esc(DEPT[k]||k)} (${groups[k].length})</h3><div class="form-grid">${groups[k].map(card).join("")}</div></section>`).join("");
}
async function load(v=++searchVersion){
  const data=await apiRequest(`/api/documents?forms=1&view=active&q=${encodeURIComponent($("q").value.trim())}`);if(v!==searchVersion)return;
  forms=data.documents||[];canManage=Boolean(data.can_manage_forms);$("addBtn").hidden=!canManage;
  if(dept&&!forms.some(f=>f.department===dept))dept="";render();
}
function openDialog(x=null){
  editing=x;$("fTitle").textContent=x?"แก้ไขแบบฟอร์ม":"เพิ่มแบบฟอร์ม";$("fName").value=x?.title||"";$("fDept").value=x?.department||"academic";$("fKeys").value=x?.keywords||"";
  $("fFile").value="";$("fFile").required=!x;$("fFileLabel").textContent=x?"เปลี่ยนไฟล์ (ไม่บังคับ)":"ไฟล์แบบฟอร์ม *";$("fErr").textContent="";$("dlg").showModal();
}
async function upload(id,file,allowDuplicate=false){
  const prepared=await prepareManagedImage(file),form=new FormData();form.append("file",prepared.file);if(allowDuplicate)form.append("allow_duplicate","1");
  try{await apiRequest(`/api/attachments/document/${id}`,{method:"POST",body:form})}
  catch(e){if(e.status===409&&e.data?.code==="duplicate_file")return upload(id,file,true);throw e}
}
$("fForm").onsubmit=async ev=>{
  ev.preventDefault();if(busy)return;const file=$("fFile").files[0];if(!editing&&!file){$("fErr").textContent="กรุณาเลือกไฟล์";return}
  busy=true;$("fSave").disabled=true;$("fErr").textContent=file?"กำลังอัปโหลด...":"กำลังบันทึก...";
  const body={title:$("fName").value.trim(),department:$("fDept").value,keywords:$("fKeys").value.trim()};
  try{
    let id=editing?.id;
    if(id)await apiRequest(`/api/documents/${id}`,{method:"PATCH",body:{action:"edit",...body}});
    else id=(await apiRequest("/api/documents",{method:"POST",body:{...body,document_type:TYPE,access_level:"staff",allow_duplicate:true}})).id;
    if(file)await upload(id,file);
    $("dlg").close();await load();
  }catch(e){$("fErr").textContent=e.message}finally{busy=false;$("fSave").disabled=false}
};
$("fCancel").onclick=()=>$("dlg").close();
$("addBtn").onclick=()=>openDialog();
$("chips").onclick=e=>{const b=e.target.closest("[data-dept]");if(!b)return;dept=b.dataset.dept;render()};
$("list").onclick=async e=>{
  const ed=e.target.closest("[data-edit]"),del=e.target.closest("[data-del]");
  if(ed)openDialog(forms.find(f=>f.id===Number(ed.dataset.edit)));
  if(del){const f=forms.find(x=>x.id===Number(del.dataset.del));if(!confirm(`ลบแบบฟอร์ม “${f.title}” ออกจากคลังใช่ไหม?`))return;
    try{await apiRequest(`/api/documents/${f.id}`,{method:"PATCH",body:{action:"archive",reason:"ลบแบบฟอร์มออกจากคลัง"}});await load()}catch(x){alert(x.message)}}
};
let timer;$("q").oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>load().catch(e=>alert(e.message)),250)};
(async()=>{const me=await apiRequest("/api/auth/me");if(!me.user){location="/login.html";return}await load()})().catch(e=>{$("list").textContent=e.message});
</script>
</body>
</html>
