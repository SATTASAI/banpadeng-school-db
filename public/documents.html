<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>คลังเอกสาร</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="app-main"><a href="/dashboard.html">← กลับแดชบอร์ด</a><h2>เอกสารและคลังไฟล์</h2><p>ทะเบียนเอกสาร ค้นหา และจัดหมวดตามฝ่าย/ปีการศึกษา</p><section class="panel"><form id="form" style="display:grid;gap:10px;max-width:680px"><input id="title" placeholder="ชื่อเอกสาร" required><select id="department"><option value="academic">วิชาการ</option><option value="budget">งบประมาณ</option><option value="personnel">บุคคล</option><option value="general">บริหารทั่วไป</option><option value="student-support">ดูแลช่วยเหลือ</option><option value="admin">ผู้ดูแลระบบ</option></select><input id="document_type" placeholder="ประเภทเอกสาร"><input id="keywords" placeholder="คำสำคัญ"><input id="file_name" placeholder="ชื่อไฟล์"><input id="file_url" type="url" placeholder="ลิงก์ไฟล์ (ถ้ามี)"><button class="btn btn-primary">บันทึกทะเบียนเอกสาร</button></form></section><input id="q" placeholder="ค้นหาเอกสาร" style="margin:16px 0;padding:10px;width:100%"><div class="panel" id="list">กำลังโหลด...</div></main><script src="/js/api.js"></script><script>(async()=>{const me=await apiRequest('/api/auth/me');if(!me.user){location='/login.html';return}const load=async()=>{const d=await apiRequest('/api/documents?q='+encodeURIComponent(q.value));list.innerHTML=d.documents.length?'<table><tr><th>ชื่อเอกสาร</th><th>ฝ่าย</th><th>ประเภท</th><th>ไฟล์</th><th>ผู้นำเข้า</th></tr>'+d.documents.map(x=>`<tr><td>${x.title}</td><td>${x.department}</td><td>${x.document_type||'-'}</td><td>${x.file_url?`<a href="${x.file_url}" target="_blank">${x.file_name||'เปิดไฟล์'}</a>`:(x.file_name||'-')}</td><td>${x.uploader_name||'-'}</td></tr>`).join('')+'</table>':'ยังไม่มีเอกสาร'};form.onsubmit=async e=>{e.preventDefault();await apiRequest('/api/documents',{method:'POST',body:JSON.stringify({title:title.value,department:department.value,document_type:document_type.value,keywords:keywords.value,file_name:file_name.value,file_url:file_url.value||null})});e.target.reset();await load()};q.oninput=load;await load()})().catch(e=>alert(e.message))</script></body></html>
