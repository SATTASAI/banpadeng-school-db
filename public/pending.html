<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>รอกำหนดสิทธิ์ — ระบบจัดการโรงเรียนบ้านป่าเด็ง</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="8" stroke="#fff" stroke-width="1.6"/>
        <path d="M12 8v4l2.5 2.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>บัญชีของคุณสมัครสำเร็จแล้ว</h1>
    <p class="auth-subtitle">
      ขณะนี้กำลังรอผู้ดูแลระบบกำหนดสิทธิ์การใช้งาน (ครู / ผู้บริหาร / ธุรการ)
      เมื่อได้รับสิทธิ์แล้วจะสามารถเข้าใช้งานระบบได้ทันที
    </p>
    <button class="btn btn-ghost" id="refreshBtn">ตรวจสอบสถานะอีกครั้ง</button>
    <div class="auth-footer">
      <a href="#" id="logoutLink">ออกจากระบบ</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  async function checkStatus() {
    const { user } = await apiRequest("/api/auth/me");
    if (!user) {
      window.location.href = "/login.html";
    } else if (user.role) {
      window.location.href = "/dashboard.html";
    }
  }

  document.getElementById("refreshBtn").addEventListener("click", checkStatus);
  document.getElementById("logoutLink").addEventListener("click", async (e) => {
    e.preventDefault();
    await apiRequest("/api/auth/logout", { method: "POST" });
    window.location.href = "/login.html";
  });

  checkStatus();
</script>
</body>
</html>
