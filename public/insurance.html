<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ประกันอุบัติเหตุ — โรงเรียนบ้านป่าเด็ง</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/teaching-works.css">
<style>
.in-info{font-size:13px;color:var(--color-text-muted);margin:-6px 0 14px}
.in-section{margin-top:18px}.in-section h2{font-size:17px;margin:0 0 10px;color:var(--color-forest-900)}
.in-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.in-filters input,.in-filters select{padding:8px 10px;border:1px solid var(--color-border);border-radius:10px;font:inherit;background:#fff}
.in-filters input{flex:1;min-width:200px}
.in-wrap{overflow:auto;border:1px solid var(--color-border);border-radius:14px;background:#fff}
.in-table{width:100%;border-collapse:collapse;min-width:760px}.in-table th,.in-table td{padding:8px 10px;border-bottom:1px solid var(--color-border);text-align:left;font-size:13px;vertical-align:middle}
.in-table th{background:#f6f9fc;font-weight:600;position:sticky;top:0}.in-table tr:last-child td{border-bottom:0}
.in-table .num{text-align:right;font-variant-numeric:tabular-nums}.in-table .btn{width:auto;padding:5px 12px;font-size:13px}
.in-chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}.in-chip.yes{background:rgba(46,157,106,.13);color:#1f7a50}.in-chip.no{background:rgba(196,80,95,.12);color:#a33a49}.in-chip.none{background:#eef2f7;color:var(--color-text-muted)}
.in-muted{color:var(--color-text-muted)}.in-more{text-align:center;padding:10px}
</style>
</head>
<body>
<main class="tw-page">
  <header class="tw-head">
    <div><h1>ประกันอุบัติเหตุนักเรียน</h1><p>กรอกและแก้ไขข้อมูลการทำประกันรายคน/รายห้อง — รายชื่อดึงจากทะเบียนนักเรียนอัตโนมัติ</p></div>
    <div class="tw-actions"><label class="tw-term">ปีการศึกษา<select id="year" style="min-width:120px"></select></label><span id="headActions"></span></div>
  </header>
  <p class="in-info" id="info"></p>
  <div class="tw-error" id="error" role="alert"></div>
  <section id="cards" class="tw-cards"></section>
  <section class="in-section"><h2>สรุปรายห้อง</h2><div class="in-wrap"><table class="in-table"><thead><tr><th>ชั้น / ห้อง</th><th class="num">นักเรียน</th><th class="num">ทำประกัน</th><th class="num">ไม่ทำ</th><th class="num">ยังไม่บันทึก</th><th style="width:140px">ความครบถ้วน</th><th></th></tr></thead><tbody id="rooms"><tr><td colspan="7" class="in-muted">กำลังโหลด…</td></tr></tbody></table></div></section>
  <section class="in-section"><h2>รายชื่อนักเรียน</h2>
    <div class="in-filters"><input type="search" id="q" placeholder="ค้นหาชื่อ เลขประจำตัว เลขกรมธรรม์" autocomplete="off"><select id="fRoom"><option value="">ทุกห้อง</option></select><select id="fStatus"><option value="">ทุกสถานะ</option><option value="yes">ทำประกัน</option><option value="no">ไม่ทำประกัน</option><option value="none">ยังไม่บันทึก</option></select></div>
    <div class="in-wrap"><table class="in-table"><thead><tr><th>เลขประจำตัว</th><th>ชื่อ–นามสกุล</th><th>ชั้น/ห้อง</th><th>สถานะ</th><th>บริษัท / แผน</th><th>เลขกรมธรรม์</th><th class="num">เบี้ย (บาท)</th><th>คุ้มครอง</th><th></th></tr></thead><tbody id="list"></tbody></table></div>
  </section>
</main>
<script src="/js/api.js"></script>
<script src="/js/student-insurance.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const cmp=(a,b)=>String(a??'').localeCompare(String(b??''),'th',{numeric:true});
const money=n=>n==null||n===''?'':Number(n).toLocaleString('th-TH',{maximumFractionDigits:2});
const tdate=d=>{if(!d)return '';const x=new Date(d+'T00:00:00');return Number.isNaN(x.getTime())?d:new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'short',year:'2-digit'}).format(x)};
const key=s=>`${String(s.grade_level??'').trim()}|${String(s.classroom??'').trim()}`;
const label=k=>{const [g,r]=k.split('|');return `${g||'ไม่ระบุชั้น'}${r?' / '+r:''}`};
const bar=(a,b)=>`<span class="tw-bar"><b style="width:${b?Math.round(a/b*100):0}%"></b></span>`;
let students=[],info=null,records=new Map(),version=0,limit=200;

function canEditRoom(k){const p=info?.permissions||{};return p.manage_all||(p.homerooms||[]).includes(k)}
const stateOf=s=>{const r=records.get(s.id);return r?(Number(r.insured)?'yes':'no'):'none'};
const chip=st=>`<span class="in-chip ${st}">${{yes:'ทำประกัน',no:'ไม่ทำประกัน',none:'ยังไม่บันทึก'}[st]}</span>`;

async function load(year){
  const v=++version;$('error').style.display='none';
  try{
    // ทะเบียนนักเรียน (เฉพาะที่กำลังศึกษา) โหลดใหม่ทุกครั้ง: นักเรียนใหม่ขึ้นทันที ย้ายออก/จำหน่ายหายจากรายการ
    const [st,d]=await Promise.all([apiRequest('/api/students'),apiRequest(`/api/student-insurance${year?`?academic_year=${encodeURIComponent(year)}`:''}`)]);
    if(v!==version)return;
    students=(st.students||[]).filter(s=>!s.status||s.status==='enrolled').sort((a,b)=>cmp(a.grade_level,b.grade_level)||cmp(a.classroom,b.classroom)||cmp(a.student_code,b.student_code)||cmp(a.full_name,b.full_name));
    info=d;records=new Map((d.records||[]).map(r=>[r.student_id,r]));
    fillYears();render();
  }catch(e){if(v===version){$('error').textContent=e.message;$('error').style.display='block'}}
}
function fillYears(){
  const sel=$('year'),years=[...new Set([...(info.years||[]),info.current_year,info.current_year+1])].sort((a,b)=>b-a);
  sel.innerHTML=years.map(y=>`<option value="${y}">${y}${y===info.current_year?' (ปีปัจจุบัน)':''}</option>`).join('');sel.value=String(info.academic_year);
}
function render(){
  const p=info.permissions||{};
  $('info').innerHTML=`ผู้รับผิดชอบงานประกัน: <b>${esc(info.officer?.name||'ยังไม่กำหนด')}</b>${p.is_admin?' (ตั้งที่ <a href="/budget.html?view=roles">ตั้งค่าผู้อนุมัติ</a>)':''} · สิทธิ์ของท่าน: ${p.manage_all?'กรอก/แก้ไขได้ทุกห้อง':(p.homerooms||[]).length?'กรอก/แก้ไขห้อง '+p.homerooms.map(label).join(', '):'ดูได้อย่างเดียว'}`;
  $('headActions').innerHTML=p.can_import?'<a class="btn btn-ghost" href="/import-center.html?template=insurance">นำเข้าจาก Excel</a>':'';
  const n={yes:0,no:0,none:0};students.forEach(s=>n[stateOf(s)]++);const total=students.length;
  $('cards').innerHTML=`<div class="tw-card"><span>นักเรียนที่กำลังศึกษา</span><strong>${total}</strong></div><div class="tw-card"><span>ทำประกัน</span><strong style="color:#1f7a50">${n.yes}</strong>${bar(n.yes,total)}</div><div class="tw-card"><span>ไม่ทำประกัน</span><strong style="color:#a33a49">${n.no}</strong></div><div class="tw-card"><span>ยังไม่บันทึก</span><strong>${n.none}</strong>${bar(total-n.none,total)}</div>`;
  const rooms=new Map();students.forEach(s=>{const k=key(s);if(!rooms.has(k))rooms.set(k,{yes:0,no:0,none:0,total:0});const r=rooms.get(k);r[stateOf(s)]++;r.total++});
  $('rooms').innerHTML=rooms.size?[...rooms].map(([k,r])=>`<tr><td><b>${esc(label(k))}</b></td><td class="num">${r.total}</td><td class="num">${r.yes}</td><td class="num">${r.no}</td><td class="num">${r.none||''}</td><td>${bar(r.total-r.none,r.total)}</td><td>${canEditRoom(k)?`<button class="btn btn-primary" data-room="${esc(k)}">กรอกทั้งห้อง</button>`:''}</td></tr>`).join(''):'<tr><td colspan="7" class="in-muted">ไม่มีนักเรียนในทะเบียน</td></tr>';
  const fr=$('fRoom'),cur=fr.value;fr.innerHTML='<option value="">ทุกห้อง</option>'+[...rooms.keys()].map(k=>`<option value="${esc(k)}">${esc(label(k))}</option>`).join('');fr.value=rooms.has(cur)?cur:'';
  renderList();
}
function renderList(){
  const q=$('q').value.trim().toLowerCase(),room=$('fRoom').value,st=$('fStatus').value;
  const rows=students.filter(s=>(!room||key(s)===room)&&(!st||stateOf(s)===st)&&(!q||[s.full_name,s.student_code,records.get(s.id)?.policy_no].join(' ').toLowerCase().includes(q)));
  $('list').innerHTML=rows.length?rows.slice(0,limit).map(s=>{const r=records.get(s.id)||{},st=stateOf(s);
    return `<tr><td>${esc(s.student_code)}</td><td>${esc(s.full_name)}</td><td>${esc(label(key(s)))}</td><td>${chip(st)}</td><td>${esc([r.company,r.plan_name].filter(Boolean).join(' · '))||'<span class="in-muted">-</span>'}</td><td>${esc(r.policy_no)}</td><td class="num">${money(r.premium)}</td><td>${r.start_date||r.end_date?esc(tdate(r.start_date)+' – '+tdate(r.end_date)):''}${r.coverage_amount!=null?`<br><small class="in-muted">${money(r.coverage_amount)} บาท</small>`:''}</td><td>${canEditRoom(key(s))?`<button class="btn btn-ghost" data-student="${s.id}">${st==='none'?'บันทึก':'แก้ไข'}</button>`:''}</td></tr>`}).join('')+(rows.length>limit?`<tr><td colspan="9" class="in-more"><button class="btn btn-ghost" id="more">แสดงเพิ่ม (${rows.length-limit} คน)</button></td></tr>`:'')
    :'<tr><td colspan="9" class="in-muted">ไม่พบนักเรียน</td></tr>';
}
function editStudent(id){
  const s=students.find(x=>x.id===Number(id));if(!s)return;
  StudentInsurance.openStudent(s,{year:$('year').value,record:records.get(s.id),onSaved:()=>load($('year').value)});
}
document.addEventListener('click',e=>{
  const room=e.target.closest('[data-room]'),stu=e.target.closest('[data-student]');
  if(room){const [grade,classroom]=room.dataset.room.split('|');StudentInsurance.openClassroom(students,{grade,classroom,year:$('year').value,onClose:()=>load($('year').value)})}
  else if(stu)editStudent(stu.dataset.student);
  else if(e.target.id==='more'){limit+=200;renderList()}
});
$('year').onchange=()=>load($('year').value);
['q','fRoom','fStatus'].forEach(id=>$(id).addEventListener('input',()=>{limit=200;renderList()}));
(async()=>{
  await load();
  const sid=new URLSearchParams(location.search).get('student');
  if(sid&&students.some(s=>s.id===Number(sid))){if(canEditRoom(key(students.find(s=>s.id===Number(sid)))))editStudent(sid);else{$('q').value=students.find(s=>s.id===Number(sid)).student_code||'';renderList()}}
})();
})();
</script>
</body></html>
