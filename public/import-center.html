<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ศูนย์แบบฟอร์มนำเข้าข้อมูล</title>
  <link rel="stylesheet" href="/css/style.css" />

  <style>
    .import-page{max-width:1240px}.page-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin:10px 0 18px}.page-head p{margin:5px 0 0;color:var(--color-text-muted)}
    .catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.template-card{padding:17px;border:1px solid var(--color-border);border-radius:17px;background:rgba(255,255,255,.86);box-shadow:0 8px 24px rgba(48,78,109,.06);cursor:pointer;transition:.18s}.template-card:hover,.template-card.active{transform:translateY(-1px);border-color:#70afe3;box-shadow:0 12px 30px rgba(38,103,161,.12)}.template-card.active{background:#f2f9ff}.template-card h3{font-size:15px;margin:7px 0 4px}.template-card p{margin:0;color:var(--color-text-muted);font-size:12px}.template-type{display:inline-flex;padding:3px 8px;border-radius:999px;background:#e8f3fb;color:#276a9d;font-size:10px;font-weight:700}

  </style>
</head>
<body>
<main class="app-main import-page">
  <a class="page-back" href="/dashboard.html">← กลับแดชบอร์ด</a>
  <div class="page-head"><div><h2>ศูนย์แบบฟอร์มนำเข้าข้อมูล</h2><p>ดาวน์โหลด Template Excel กรอกข้อมูล ตรวจสอบ และนำเข้าฐานข้อมูลของโรงเรียน</p></div></div>
  <section class="catalog" id="catalog"></section>
  <section class="panel workspace" id="workspace">
    <div class="workspace-head"><div><h3 id="workspaceTitle"></h3><p id="workspaceDescription"></p></div><div class="actions"><button class="btn btn-ghost" id="downloadBtn">ดาวน์โหลด Template Excel</button></div></div>
    <div class="upload-box"><div><label for="fileInput"><strong>ไฟล์ที่กรอกแล้ว</strong></label><input id="fileInput" type="file" accept=".xlsx,.xls,.csv" /><div class="hint">ระบบอ่านไฟล์ในเครื่องเพื่อแสดงตัวอย่างก่อน ยังไม่บันทึกจนกด “นำเข้าข้อมูลที่ผ่านการตรวจสอบ”</div></div><button class="btn btn-primary" id="importBtn" disabled>นำเข้าข้อมูลที่ผ่านการตรวจสอบ</button></div>
    <div class="status-grid"><div class="status-card"><span>ทั้งหมด</span><strong id="totalCount">0</strong></div><div class="status-card ok"><span>พร้อมนำเข้า</span><strong id="validCount">0</strong></div><div class="status-card error"><span>ต้องแก้ไข</span><strong id="invalidCount">0</strong></div></div>
    <div class="preview-wrap" id="preview"><div class="empty">เลือกไฟล์เพื่อดูตัวอย่างและตรวจสอบข้อมูล</div></div>
    <div class="progress"><span id="progressBar"></span></div><div class="result" id="resultBox"></div>
  </section>
</main>

  budget_requests:{title:"คำขอใช้งบประมาณ",description:"นำเข้าคำขอใช้เงินเข้าคิวตรวจสอบ โดยอ้างอิงโครงการที่มีอยู่",fields:[FIELD("department","ฝ่ายงาน",true,"budget",["academic","early_childhood","budget","personnel","general"]),FIELD("project_name","ชื่อโครงการ",true,"โครงการตัวอย่าง"),FIELD("expense_date","วันที่คำขอ",true,"2026-10-01"),FIELD("fiscal_year","ปีงบประมาณ",true,"2570"),FIELD("category","หมวดรายจ่าย",true,"materials",["materials","equipment","services","compensation","utilities","travel","food","other"]),FIELD("description","วัตถุประสงค์/รายละเอียด",true,"จัดซื้อวัสดุ"),FIELD("amount","จำนวนเงิน",true,5000),FIELD("payee","ผู้รับเงิน/ร้านค้า"),FIELD("document_no","เลขที่เอกสาร"),FIELD("notes","หมายเหตุ")],endpoint:"budget_requests"},

const $=id=>document.getElementById(id);const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
let selectedKey=null,parsedRows=[],checkedRows=[];
function normalize(v){return String(v??"").trim().toLocaleLowerCase("th").replace(/[\s_\-–—./()]+/g,"")}
function renderCatalog(){$("catalog").innerHTML=Object.entries(TEMPLATES).map(([key,t])=>`<article class="template-card" data-template="${key}"><span class="template-type">EXCEL → DATABASE</span><h3>${esc(t.title)}</h3><p>${esc(t.description)}</p></article>`).join("");document.querySelectorAll("[data-template]").forEach(card=>card.onclick=()=>selectTemplate(card.dataset.template))}
function selectTemplate(key){selectedKey=key;parsedRows=[];checkedRows=[];document.querySelectorAll("[data-template]").forEach(x=>x.classList.toggle("active",x.dataset.template===key));const t=TEMPLATES[key];$("workspaceTitle").textContent=t.title;$("workspaceDescription").textContent=t.description;$("workspace").classList.add("open");$("fileInput").value="";resetPreview();history.replaceState(null,"",`?template=${encodeURIComponent(key)}`);$("workspace").scrollIntoView({behavior:"smooth",block:"start"})}
function resetPreview(){$("totalCount").textContent=$("validCount").textContent=$("invalidCount").textContent="0";$("preview").innerHTML='<div class="empty">เลือกไฟล์เพื่อดูตัวอย่างและตรวจสอบข้อมูล</div>';$("importBtn").disabled=true;$("progressBar").style.width="0";$("resultBox").style.display="none"}
function downloadTemplate(){const t=TEMPLATES[selectedKey];if(!t)return;if(selectedKey==="staff"){const link=document.createElement("a");link.href="/templates/teacher-import.xlsx";link.download="template_teacher_import_banpadeng.xlsx";link.click();return}if(typeof XLSX==="undefined"){showResult("ไม่สามารถโหลดเครื่องมือสร้างไฟล์ Excel กรุณาลองใหม่อีกครั้ง",true);return}const headers=t.fields.map(f=>f.label);const dataSheet=XLSX.utils.aoa_to_sheet([headers]);dataSheet["!cols"]=t.fields.map(f=>({wch:Math.min(32,Math.max(14,f.label.length+5))}));const guide=[["ชื่อคอลัมน์","รหัสระบบ","จำเป็น","รูปแบบ/ค่าที่รองรับ","ตัวอย่าง"],...t.fields.map(f=>[f.label,f.key,f.required?"จำเป็น":"ไม่บังคับ",f.options.length?f.options.join(" / "):f.key.includes("date")||f.key.includes("expiry")?"YYYY-MM-DD":"ข้อความหรือตัวเลขตามหัวข้อ",f.example??""])];const guideSheet=XLSX.utils.aoa_to_sheet(guide);guideSheet["!cols"]=[{wch:30},{wch:28},{wch:12},{wch:54},{wch:35}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,dataSheet,"ข้อมูล");XLSX.utils.book_append_sheet(wb,guideSheet,"คำอธิบาย");XLSX.writeFile(wb,`Template-${selectedKey}-${t.title}.xlsx`)}
function readFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{try{const wb=XLSX.read(reader.result,{type:"array",cellDates:false});const sheet=wb.Sheets[wb.SheetNames[0]];resolve(XLSX.utils.sheet_to_json(sheet,{header:1,defval:"",raw:false}))}catch(e){reject(e)}};reader.onerror=()=>reject(new Error("อ่านไฟล์ไม่สำเร็จ"));reader.readAsArrayBuffer(file)})}
function validateRows(matrix){
  const t=TEMPLATES[selectedKey],headers=(matrix[0]||[]).map(normalize);
  const indexes=t.fields.map(f=>{const candidates=[f.label,f.key].map(normalize);return headers.findIndex(h=>candidates.includes(h))});
  const seenEmails=new Set();
  parsedRows=matrix.slice(1).map((row,rowIndex)=>({row:rowIndex+2,cells:row}))
    .filter(({cells})=>cells.some(v=>String(v??"").trim()!==""))
    .map(({row,cells})=>{
      const data={};t.fields.forEach((f,i)=>data[f.key]=String(cells[indexes[i]]??"").trim());
      const errors=[];
      t.fields.forEach(f=>{const v=data[f.key];if(f.required&&!v)errors.push(`ไม่มี ${f.label}`);if(v&&f.options.length&&!f.options.includes(v))errors.push(`${f.label} ต้องเป็น ${f.options.join("/")}`)});
      if(selectedKey==="staff"){
        const email=data.email.toLowerCase();
        if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))errors.push("อีเมลไม่ถูกต้อง");
        if(email&&seenEmails.has(email))errors.push("อีเมลซ้ำในไฟล์");
        if(email)seenEmails.add(email);
        const periods=data.teaching_periods;
        if(periods&&(!/^\d+$/.test(periods)||Number(periods)>100))errors.push("จำนวนคาบต้องเป็นจำนวนเต็ม 0–100");
      }
      return {row,data,errors};
    });
  checkedRows=parsedRows;renderPreview(t);
}
function renderPreview(t){const valid=checkedRows.filter(r=>!r.errors.length);const invalid=checkedRows.length-valid.length;$("totalCount").textContent=checkedRows.length;$("validCount").textContent=valid.length;$("invalidCount").textContent=invalid;$("importBtn").disabled=!valid.length;const fields=t.fields.slice(0,8);$("preview").innerHTML=checkedRows.length?`<table><thead><tr><th>แถว</th>${fields.map(f=>`<th>${esc(f.label)}</th>`).join("")}<th>ผลตรวจสอบ</th></tr></thead><tbody>${checkedRows.slice(0,100).map(r=>`<tr><td>${r.row}</td>${fields.map(f=>`<td>${esc(r.data[f.key]||"-")}</td>`).join("")}<td>${r.errors.length?`<span class="cell-error">${esc(r.errors.join(" · "))}</span>`:'<span style="color:#187652">พร้อมนำเข้า</span>'}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">ไม่พบแถวข้อมูลในไฟล์</div>'}
async function postRow(endpoint,row,studentMap,projectMap){if(endpoint==="budget_requests"){const id=projectMap.get(`${row.department}|${row.project_name}`.toLocaleLowerCase("th"));if(!id)throw new Error(`ไม่พบโครงการ “${row.project_name}”`);return apiRequest("/api/budget/requests",{method:"POST",body:{...row,project_id:id,amount:Number(row.amount),fiscal_year:Number(row.fiscal_year)}})}if(endpoint==="budget_income")return apiRequest("/api/budget/income",{method:"POST",body:{...row,amount:Number(row.amount),fiscal_year:Number(row.fiscal_year)}});if(endpoint==="inventory")return apiRequest("/api/inventory/items",{method:"POST",body:{...row,opening_quantity:Number(row.opening_quantity||0),minimum_quantity:Number(row.minimum_quantity||0),unit_price:Number(row.unit_price||0)}});if(endpoint==="facilities")return apiRequest("/api/facilities",{method:"POST",body:row});if(endpoint==="support"){const studentId=studentMap.get(String(row.student_code));if(!studentId)throw new Error(`ไม่พบนักเรียนรหัส ${row.student_code}`);return apiRequest("/api/student-support",{method:"POST",body:{...row,student_id:studentId}})}}
async function importData(){
  const t=TEMPLATES[selectedKey],valid=checkedRows.filter(r=>!r.errors.length),rows=valid.map(r=>r.data);
  if(!rows.length)return;
  $("importBtn").disabled=true;$("resultBox").style.display="none";
  let created=0,updated=0,failed=[];
  try{
    if(t.endpoint==="students"){
      for(let i=0;i<rows.length;i+=20){
        const batch=rows.slice(i,i+20),result=await apiRequest("/api/students/import",{method:"POST",body:{rows:batch}});
        created+=Number(result.created||0);updated+=Number(result.updated||0);
        failed.push(...(result.skipped||[]).map(x=>`แถว ${i+Number(x.row)+1}: ${x.reason}`));
        $("progressBar").style.width=`${Math.min(100,(i+batch.length)/rows.length*100)}%`;
      }
    }else if(t.endpoint==="staff"){
      for(let i=0;i<rows.length;i+=50){
        const batch=rows.slice(i,i+50),result=await apiRequest("/api/staff/import",{method:"POST",body:{rows:batch}});
        created+=Number(result.created||0);updated+=Number(result.updated||0);
        failed.push(...(result.skipped||[]).map(x=>`แถว ${valid[i+Number(x.row)-1]?.row||"?"}: ${x.reason}`));
        $("progressBar").style.width=`${Math.min(100,(i+batch.length)/rows.length*100)}%`;
      }
    }else if(t.endpoint==="projects"){
      const result=await apiRequest("/api/projects/import",{method:"POST",body:{rows}});
      created+=Number(result.created||0);updated+=Number(result.updated||0);
      failed.push(...(result.skipped||[]).map(x=>`แถว ${valid[Number(x.row)-1]?.row||"?"}: ${x.reason}`));
      $("progressBar").style.width="100%";
    }else{
      let studentMap=new Map(),projectMap=new Map();
      if(t.endpoint==="support"){const data=await apiRequest("/api/students");studentMap=new Map((data.students||[]).map(s=>[String(s.student_code),s.id]))}
      if(t.endpoint==="budget_requests"){const groups=await Promise.all(["academic","early_childhood","budget","personnel","general"].map(async department=>({department,...await apiRequest(`/api/departments/${department}/projects`)})));projectMap=new Map(groups.flatMap(g=>(g.projects||[]).map(p=>[`${g.department}|${p.name}`.toLocaleLowerCase("th"),p.id])))}
      for(let i=0;i<rows.length;i++){
        try{await postRow(t.endpoint,rows[i],studentMap,projectMap);created++}catch(e){failed.push(`แถว ${valid[i].row}: ${e.message}`)}
        $("progressBar").style.width=`${(i+1)/rows.length*100}%`;
      }
    }
    const total=created+updated;
    showResult(`นำเข้าสำเร็จ ${total} รายการ${["staff","projects"].includes(t.endpoint)?` (เพิ่ม ${created} อัปเดต ${updated})`:""}${failed.length?` · ไม่สำเร็จ ${failed.length} รายการ\n${failed.slice(0,10).join("\n")}`:""}`,failed.length>0);
  }catch(e){showResult(e.message,true)}finally{$("importBtn").disabled=false}
}
function showResult(text,error){const box=$("resultBox");box.textContent=text;box.className=`result${error?" error":""}`;box.style.display="block"}
$("downloadBtn").onclick=downloadTemplate;$("importBtn").onclick=importData;$("fileInput").onchange=async()=>{const file=$("fileInput").files[0];if(!file)return resetPreview();try{validateRows(await readFile(file))}catch(e){showResult("อ่านไฟล์ไม่สำเร็จ: "+e.message,true)}};
(async()=>{const me=await apiRequest("/api/auth/me");if(!me.user){location="/login.html";return}renderCatalog();const params=new URLSearchParams(location.search),requested=params.get("template");if(TEMPLATES[requested]){selectTemplate(requested);if(params.get("download")==="1")downloadTemplate()}})().catch(e=>showResult(e.message,true));
</script>
