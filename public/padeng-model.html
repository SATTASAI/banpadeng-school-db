<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ป่าเด็งโมเดล — โรงเรียนบ้านป่าเด็ง</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/teaching-works.css">
</head>
<body>
<main class="tw-page">
  <header class="tw-head">
    <div><h1 id="title">ป่าเด็งโมเดล</h1><p id="lead">ส่งภาพกิจกรรม (ไม่เกิน 4 ภาพ) และไฟล์ PDF ของแต่ละวิชาที่สอน</p></div>
    <div class="tw-actions"><label class="tw-term">ภาคเรียน<select id="term"></select></label><span id="headActions"></span></div>
  </header>
  <div class="tw-error" id="error" role="alert"></div>
  <section id="cards" class="tw-cards"></section>
  <section id="body"><p class="tw-note">กำลังโหลด…</p></section>
</main>
<div class="tw-lightbox" id="lightbox" hidden><button class="btn btn-ghost" id="lbClose">ปิด</button><img id="lbImg" alt=""></div>
<script src="/js/api.js"></script>
<script src="/js/teaching-works.js"></script>
<script>
(()=>{
const {$,esc,fileUrl,uploadFiles,showError,fillTerms,termText,openImage,progressBar}=TeachingWorks;
const progressView=new URLSearchParams(location.search).get('view')==='progress';
let data=null,perms=null,version=0;
const room=c=>`${esc(c.grade_level)}${c.classroom?'/'+esc(c.classroom):''}`;

async function load(){
  const v=++version;showError();
  try{
    const term=$('term').value;
    const d=await apiRequest(`/api/teaching-works/padeng/${progressView?'progress':'mine'}${term?`?term_id=${term}`:''}`);
    if(v!==version)return;data=d;fillTerms(d);render();
  }catch(e){if(v===version){showError(e.message);$('body').innerHTML='';}}
}

// ---------- ครู: ส่งงาน ----------
function renderMine(){
  const closed=data.term?.status==='closed';
  if(!data.term){$('body').innerHTML='<p class="tw-note">ยังไม่มีภาคเรียนในระบบ</p>';return;}
  if(!data.courses.length){$('body').innerHTML='<div class="tw-empty"><b>ยังไม่พบวิชาที่คุณสอนในภาคเรียนนี้</b><p>รายวิชาดึงจากข้อมูลครูผู้สอนที่ฝ่ายวัดผลกำหนดในระบบรายงานผลการเรียน หากไม่ถูกต้องให้แจ้งฝ่ายวัดผล</p></div>';$('cards').innerHTML='';return;}
  const done=data.courses.filter(c=>c.complete).length;
  $('cards').innerHTML=`<div class="tw-card"><span>ส่งครบแล้ว</span><strong>${done} / ${data.courses.length} วิชา</strong>${progressBar(done,data.courses.length)}</div>
    <div class="tw-card"><span>เกณฑ์</span><strong class="sm">ภาพ ${data.max_images} ภาพ + PDF 1 ไฟล์ ต่อวิชา·ห้อง</strong></div>`;
  $('body').innerHTML=`<div class="tw-grid">${data.courses.map(c=>{
    const left=data.max_images-c.images.length;
    return `<article class="tw-course ${c.complete?'ok':''}">
      <header><div><h2>${esc(c.subject)}</h2><small>${esc(c.subject_code||'')} · ชั้น ${room(c)}</small></div><span class="tw-badge ${c.complete?'ok':''}">${c.complete?'ส่งครบ':'ยังไม่ครบ'}</span></header>
      <p class="tw-label">ภาพกิจกรรม ${c.images.length}/${data.max_images}</p>
      <div class="tw-thumbs">${c.images.map(i=>`<figure><img src="${fileUrl('padeng',i.id)}" alt="${esc(i.file_name)}" loading="lazy" data-open="${i.id}">
        ${closed?'':`<button class="tw-x" data-del="${i.id}" title="ลบภาพ" aria-label="ลบภาพ">×</button>`}</figure>`).join('')}
        ${!closed&&left>0?`<label class="tw-add">+ เพิ่มภาพ<small>เหลือ ${left} ภาพ</small><input type="file" accept="image/*" multiple hidden data-images="${c.course_id}" data-left="${left}"></label>`:''}</div>
      <p class="tw-label">ไฟล์ PDF</p>
      <div class="tw-pdf">${c.pdf?`<a href="${fileUrl('padeng',c.pdf.id)}" target="_blank" rel="noopener">📄 ${esc(c.pdf.file_name)}</a>`:'<span class="tw-muted">ยังไม่ได้ส่ง</span>'}
        ${closed?'':`<label class="btn btn-ghost tw-sm">${c.pdf?'ส่งไฟล์ใหม่แทน':'อัปโหลด PDF'}<input type="file" accept="application/pdf,.pdf" hidden data-pdf="${c.course_id}"></label>`}</div>
      <div class="tw-progress" id="up-${c.course_id}"></div>
    </article>`;}).join('')}</div>${closed?'<p class="tw-note">ภาคเรียนนี้ปิดแล้ว ดูงานได้อย่างเดียว</p>':''}`;
}

// ---------- ฝ่ายวิชาการ: ความคืบหน้า ----------
function renderProgress(){
  if(!data.term){$('body').innerHTML='<p class="tw-note">ยังไม่มีภาคเรียนในระบบ</p>';return;}
  const t=data.teachers,courses=t.reduce((s,x)=>s+x.total,0),done=t.reduce((s,x)=>s+x.complete,0),allDone=t.filter(x=>x.total&&x.complete===x.total).length;
  $('headActions').innerHTML=`<a class="btn btn-primary" href="/api/teaching-works/padeng/zip?term_id=${data.term.id}">ดาวน์โหลดทั้งหมด (.zip)</a>`;
  $('cards').innerHTML=`<div class="tw-card"><span>วิชา·ห้องที่ส่งครบ</span><strong>${done} / ${courses}</strong>${progressBar(done,courses)}</div>
    <div class="tw-card"><span>ครูที่ส่งครบทุกวิชา</span><strong>${allDone} / ${t.length} คน</strong>${progressBar(allDone,t.length)}</div>
    <div class="tw-card"><span>ภาพที่ส่งแล้ว</span><strong>${t.reduce((s,x)=>s+x.images,0)} ภาพ</strong></div>
    <div class="tw-card"><span>PDF ที่ส่งแล้ว</span><strong>${t.reduce((s,x)=>s+x.pdfs,0)} ไฟล์</strong></div>`;
  $('body').innerHTML=t.length?`<div class="tw-filter"><input id="search" type="search" placeholder="ค้นหาชื่อครู"><label><input type="checkbox" id="pending"> แสดงเฉพาะที่ยังไม่ครบ</label></div>
    <div class="tw-table"><table><thead><tr><th>ที่</th><th>ครู</th><th>ส่งครบ</th><th>ภาพ</th><th>PDF</th><th>สถานะ</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>`
    :'<div class="tw-empty"><b>ยังไม่มีข้อมูลครูผู้สอนของภาคเรียนนี้</b><p>ฝ่ายวัดผลกำหนดครูผู้สอนในระบบรายงานผลการเรียน</p></div>';
  if(!t.length)return;
  const rows=()=>{
    const q=$('search').value.trim(),pending=$('pending').checked;
    $('rows').innerHTML=t.filter(x=>(!q||x.full_name.includes(q))&&(!pending||x.complete<x.total)).map((x,i)=>{
      const st=x.complete===x.total?'<span class="tw-badge ok">ครบ</span>':x.images||x.pdfs?'<span class="tw-badge mid">ส่งบางส่วน</span>':'<span class="tw-badge">ยังไม่ส่ง</span>';
      return `<tr class="tw-row" data-u="${x.user_id}"><td>${i+1}</td><td><b>${esc(x.full_name)}</b></td><td>${x.complete}/${x.total}${progressBar(x.complete,x.total)}</td><td>${x.images}</td><td>${x.pdfs}/${x.total}</td><td>${st}</td>
        <td><button class="btn btn-ghost tw-sm" data-toggle="${x.user_id}">รายละเอียด</button></td></tr>
        <tr class="tw-detail" id="d-${x.user_id}" hidden><td colspan="7"><div class="tw-detail-head"><b>${esc(x.full_name)}</b>${x.images||x.pdfs?`<a class="btn btn-ghost tw-sm" href="/api/teaching-works/padeng/zip?term_id=${data.term.id}&user_id=${x.user_id}">ดาวน์โหลดงานของครูคนนี้ (.zip)</a>`:''}</div>
          ${x.courses.map(c=>`<div class="tw-detail-course"><div><b>${esc(c.subject)}</b> <small>${room(c)}</small></div>
            <div class="tw-thumbs sm">${c.images.map(i=>`<figure><img src="${fileUrl('padeng',i.id)}" alt="" loading="lazy" data-open="${i.id}"><a class="tw-dl" href="${fileUrl('padeng',i.id,true)}" title="ดาวน์โหลด">⬇</a></figure>`).join('')||'<span class="tw-muted">ไม่มีภาพ</span>'}</div>
            <div>${c.pdf?`<a href="${fileUrl('padeng',c.pdf.id)}" target="_blank" rel="noopener">📄 PDF</a> · <a href="${fileUrl('padeng',c.pdf.id,true)}">ดาวน์โหลด</a>`:'<span class="tw-muted">ไม่มี PDF</span>'}</div></div>`).join('')}</td></tr>`;}).join('')||'<tr><td colspan="7">ไม่พบข้อมูล</td></tr>';
  };
  $('search').oninput=rows;$('pending').onchange=rows;rows();
}

function render(){
  $('headActions').innerHTML='';
  progressView?renderProgress():renderMine();
}

document.addEventListener('click',async e=>{
  const open=e.target.closest('[data-open]');if(open){openImage(fileUrl('padeng',open.dataset.open));return;}
  const tog=e.target.closest('[data-toggle]');if(tog){const d=$('d-'+tog.dataset.toggle);d.hidden=!d.hidden;return;}
  const del=e.target.closest('[data-del]');
  if(del){if(!confirm('ลบภาพนี้?'))return;try{await apiRequest(`/api/teaching-works/padeng/files/${del.dataset.del}`,{method:'DELETE'});load();}catch(x){showError(x.message)}}
});
document.addEventListener('change',async e=>{
  const img=e.target.closest('[data-images]'),pdf=e.target.closest('[data-pdf]');
  if(!img&&!pdf)return;
  const course=(img||pdf).dataset.images||(img||pdf).dataset.pdf;
  let files=[...e.target.files];e.target.value='';
  let warn='';
  if(img&&files.length>Number(img.dataset.left)){warn=`เลือกได้อีกไม่เกิน ${img.dataset.left} ภาพ — ส่งเฉพาะ ${img.dataset.left} ภาพแรก`;files=files.slice(0,Number(img.dataset.left));}
  await uploadFiles('/api/teaching-works/padeng/upload',files,f=>({kind:img?'image':'pdf',course_id:course,term_id:data.term.id,file:f}),$('up-'+course));
  await load();if(warn)showError(warn);
});
$('term').onchange=load;
TeachingWorks.boot(p=>{perms=p;
  if(progressView){
    if(!p.academic){$('body').innerHTML='<div class="tw-empty"><b>เฉพาะบุคลากรฝ่ายวิชาการ</b><p>หน้านี้ใช้ติดตามการส่งงานป่าเด็งโมเดลของครูทั้งโรงเรียน</p></div>';return false;}
    $('title').textContent='ป่าเด็งโมเดล — ความคืบหน้าการส่งงาน';$('lead').textContent='ฝ่ายวิชาการ · ติดตามการส่งภาพและไฟล์ PDF ของครูแต่ละวิชา·ห้อง ดาวน์โหลดไฟล์และภาพได้';
  }
  load();
});
})();
</script></body></html>
