<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>สารบรรณอิเล็กทรอนิกส์ — โรงเรียนบ้านป่าเด็ง</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .page{max-width:1280px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:8px 0 18px}.head h1{margin:4px 0}.muted{color:var(--color-text-muted)}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.metric{padding:15px;border:1px solid var(--color-border);border-radius:15px;background:var(--color-surface)}.metric strong{display:block;font-size:24px;color:#185e96}.metric span{font-size:12px;color:var(--color-text-muted)}
    .toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 170px 170px auto;gap:9px;margin:14px 0}.toolbar>*{min-width:0}.toolbar .btn{width:auto}.tablebox{overflow:auto;border:1px solid var(--color-border);border-radius:15px;background:#fff}.tablebox table{min-width:1040px}.record-link{border:0;background:none;color:#176eae;font:inherit;font-weight:650;cursor:pointer;text-align:left}.pill{display:inline-flex;padding:4px 9px;border-radius:999px;background:#edf2f6;color:#52677a;font-size:11px;font-weight:650}.pill.urgent,.pill.very_urgent,.pill.immediate{background:#fde9eb;color:#aa3545}.pill.completed,.pill.archived{background:#e6f5ed;color:#21724c}.pill.routed,.pill.in_progress{background:#e8f2fc;color:#256ca8}
    dialog{width:min(940px,calc(100% - 24px));max-height:92vh;border:0;border-radius:20px;padding:0;box-shadow:0 25px 70px rgba(25,54,84,.3)}dialog::backdrop{background:rgba(24,43,63,.45);backdrop-filter:blur(5px)}.modal{padding:24px}.modal h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.span{grid-column:1/-1}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:650}.field input,.field select,.field textarea{width:100%}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.actions .btn{width:auto}.timeline{display:grid;gap:9px;margin-top:13px}.event{padding:11px 13px;border-left:3px solid #4b9ddd;background:#f4f9fd;border-radius:9px}.event small{display:block;color:var(--color-text-muted);margin-top:3px}.empty{padding:38px;text-align:center;color:var(--color-text-muted)}.toast{display:none;position:fixed;right:18px;bottom:18px;z-index:100;padding:12px 15px;border-radius:12px;background:#183153;color:#fff}.toast.error{background:#a43c49}
    @media(max-width:760px){.head{align-items:flex-start;flex-direction:column}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.grid{grid-template-columns:1fr}.span{grid-column:auto}.summary{grid-template-columns:1fr}.page{padding:16px 12px}}
  </style>
</head>
<body><main class="app-main page">
  <a href="/dashboard.html">← กลับแดชบอร์ด</a>
  <header class="head"><div><h1>สารบรรณอิเล็กทรอนิกส์</h1><p class="muted">ทะเบียนหนังสือรับ หนังสือส่ง หนังสือภายใน และประวัติการสั่งการ</p></div><button class="btn btn-primary" id="newButton">+ ลงทะเบียนหนังสือ</button></header>
  <section class="summary" id="summary"></section>
  <div class="toolbar"><input id="q" type="search" placeholder="ค้นหาเลขทะเบียน เลขหนังสือ เรื่อง หรือหน่วยงาน"><select id="type"><option value="">ทุกประเภท</option><option value="incoming">หนังสือรับ</option><option value="outgoing">หนังสือส่ง</option><option value="internal">หนังสือภายใน</option></select><select id="status"><option value="">ทุกสถานะ</option><option value="received">รับเรื่อง</option><option value="routed">เสนอ/ส่งต่อ</option><option value="in_progress">กำลังดำเนินการ</option><option value="completed">เสร็จสิ้น</option><option value="archived">เก็บเข้าแฟ้ม</option></select><button class="btn btn-ghost" id="refresh">อัปเดต</button></div>
  <section class="tablebox" id="records">กำลังโหลด...</section>
</main>

<dialog id="createDialog"><form class="modal" id="createForm"><h2>ลงทะเบียนหนังสือ</h2><div class="grid">
  <div class="field"><label>ประเภท *</label><select id="cType"><option value="incoming">หนังสือรับ</option><option value="outgoing">หนังสือส่ง</option><option value="internal">หนังสือภายใน</option></select></div>
  <div class="field"><label>เลขที่หนังสือ</label><input id="cDocumentNo"></div><div class="field span"><label>เรื่อง *</label><input id="cSubject" required maxlength="500"></div>
  <div class="field"><label>จาก</label><input id="cSender"></div><div class="field"><label>ถึง</label><input id="cRecipient"></div>
  <div class="field"><label>วันที่หนังสือ</label><input id="cDocumentDate" type="date"></div><div class="field"><label>วันที่รับ</label><input id="cReceivedDate" type="date"></div>
  <div class="field"><label>ชั้นความเร็ว</label><select id="cUrgency"><option value="normal">ปกติ</option><option value="urgent">ด่วน</option><option value="very_urgent">ด่วนมาก</option><option value="immediate">ด่วนที่สุด</option></select></div>
  <div class="field"><label>ชั้นความลับ</label><select id="cConfidentiality"><option value="normal">ปกติ</option><option value="confidential">ลับ</option><option value="secret">ลับมาก</option><option value="top_secret">ลับที่สุด</option></select></div>
  <div class="field"><label>ผู้รับผิดชอบ</label><select id="cAssigned"><option value="">ยังไม่มอบหมาย</option></select></div><div class="field"><label>กำหนดเสร็จ</label><input id="cDue" type="date"></div>
  <div class="field"><label>รหัสเอกสารในคลังไฟล์</label><input id="cDocumentId" type="number" min="1"></div><div class="field span"><label>คำสั่งการ/หมายเหตุ</label><textarea id="cDirection" rows="3"></textarea></div>
</div><div class="actions"><button type="button" class="btn btn-ghost" data-close="createDialog">ยกเลิก</button><button class="btn btn-primary" id="createSave">บันทึกและออกเลขทะเบียน</button></div></form></dialog>

<dialog id="detailDialog"><div class="modal"><h2 id="detailTitle">รายละเอียดหนังสือ</h2><div id="detailBody"></div><form id="updateForm" hidden><h3>อัปเดตการดำเนินงาน</h3><div class="grid"><div class="field"><label>สถานะ</label><select id="uStatus"><option value="received">รับเรื่อง</option><option value="routed">เสนอ/ส่งต่อ</option><option value="in_progress">กำลังดำเนินการ</option><option value="completed">เสร็จสิ้น</option><option value="archived">เก็บเข้าแฟ้ม</option></select></div><div class="field"><label>ผู้รับผิดชอบ</label><select id="uAssigned"><option value="">ยังไม่มอบหมาย</option></select></div><div class="field"><label>กำหนดเสร็จ</label><input id="uDue" type="date"></div><div class="field span"><label>คำสั่งการ</label><textarea id="uDirection" rows="2"></textarea></div><div class="field span"><label>บันทึกการอัปเดต</label><textarea id="uNote" rows="2"></textarea></div></div><div class="actions"><button class="btn btn-primary">บันทึกการอัปเดต</button></div></form><h3>ประวัติการดำเนินงาน</h3><div class="timeline" id="timeline"></div><div class="actions"><button class="btn btn-ghost" data-close="detailDialog">ปิด</button></div></div></dialog>
<div class="toast" id="toast"></div>
<script src="/js/api.js"></script><script>
const $=id=>document.getElementById(id),esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
const TYPE={incoming:"หนังสือรับ",outgoing:"หนังสือส่ง",internal:"หนังสือภายใน"},STATUS={received:"รับเรื่อง",routed:"เสนอ/ส่งต่อ",in_progress:"กำลังดำเนินการ",completed:"เสร็จสิ้น",archived:"เก็บเข้าแฟ้ม"},URGENCY={normal:"ปกติ",urgent:"ด่วน",very_urgent:"ด่วนมาก",immediate:"ด่วนที่สุด"};let users=[],current=null,canManage=false,searchTimer,toastTimer;
function toast(text,error=false){const el=$("toast");el.textContent=text;el.className=`toast${error?" error":""}`;el.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display="none",3500)}
function options(selected=""){return '<option value="">ยังไม่มอบหมาย</option>'+users.map(u=>`<option value="${u.id}" ${String(u.id)===String(selected)?"selected":""}>${esc(u.full_name)}</option>`).join("")}
async function load(){const p=new URLSearchParams({q:$("q").value,type:$("type").value,status:$("status").value});const data=await apiRequest("/api/correspondence?"+p);canManage=data.can_manage;$("newButton").hidden=!canManage;$("summary").innerHTML=`<div class="metric"><strong>${Number(data.summary.total||0).toLocaleString("th-TH")}</strong><span>หนังสือทั้งหมด</span></div><div class="metric"><strong>${Number(data.summary.open_count||0).toLocaleString("th-TH")}</strong><span>กำลังดำเนินการ</span></div><div class="metric"><strong>${Number(data.summary.overdue_count||0).toLocaleString("th-TH")}</strong><span>เลยกำหนด</span></div>`;render(data.records)}
function render(rows){$("records").innerHTML=rows.length?`<table><thead><tr><th>ทะเบียน</th><th>เลขที่/เรื่อง</th><th>จาก–ถึง</th><th>วันที่</th><th>ความเร็ว</th><th>ผู้รับผิดชอบ</th><th>สถานะ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(TYPE[r.register_type])}<br><button class="record-link" data-id="${r.id}">${esc(r.register_no)}</button></td><td>${esc(r.document_no||"-")}<br><strong>${esc(r.subject)}</strong></td><td>${esc(r.sender||"-")}<br><small>ถึง ${esc(r.recipient||"-")}</small></td><td>${esc(r.received_date||r.document_date||"-")}<br><small>${r.due_date?`กำหนด ${esc(r.due_date)}`:""}</small></td><td><span class="pill ${esc(r.urgency)}">${esc(URGENCY[r.urgency]||r.urgency)}</span></td><td>${esc(r.assigned_name||"ยังไม่มอบหมาย")}</td><td><span class="pill ${esc(r.status)}">${esc(STATUS[r.status]||r.status)}</span></td></tr>`).join("")}</tbody></table>`:'<div class="empty">ยังไม่มีหนังสือที่ตรงกับเงื่อนไข</div>';document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>detail(Number(b.dataset.id)))}
async function detail(id){const data=await apiRequest(`/api/correspondence/${id}`);current=data.record;$("detailTitle").textContent=`${current.register_no} · ${current.subject}`;$("detailBody").innerHTML=`<div class="grid"><p><strong>ประเภท</strong><br>${esc(TYPE[current.register_type])}</p><p><strong>เลขที่หนังสือ</strong><br>${esc(current.document_no||"-")}</p><p><strong>จาก</strong><br>${esc(current.sender||"-")}</p><p><strong>ถึง</strong><br>${esc(current.recipient||"-")}</p><p class="span"><strong>คำสั่งการ</strong><br>${esc(current.direction_note||"-")}</p>${current.document_id?`<p class="span"><a href="/documents.html?document=${current.document_id}">เปิดเอกสารในคลังไฟล์ ›</a></p>`:""}</div>`;$("updateForm").hidden=!data.can_manage;$("uStatus").value=current.status;$("uAssigned").innerHTML=options(current.assigned_to);$("uDue").value=current.due_date||"";$("uDirection").value=current.direction_note||"";$("uNote").value="";$("timeline").innerHTML=data.updates.length?data.updates.map(x=>`<div class="event"><strong>${esc(STATUS[x.new_status]||x.new_status)}</strong>${x.note?` · ${esc(x.note)}`:""}<small>${esc(x.creator_name||"-")} · ${esc(x.created_at)}${x.assigned_name?` · มอบหมาย ${esc(x.assigned_name)}`:""}</small></div>`).join(""):'<div class="empty">ยังไม่มีประวัติ</div>';$("detailDialog").showModal()}
$("newButton").onclick=()=>$("createDialog").showModal();document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).close());
$("createForm").onsubmit=async e=>{e.preventDefault();const b=$("createSave");b.disabled=true;try{const result=await apiRequest("/api/correspondence",{method:"POST",body:{register_type:$("cType").value,document_no:$("cDocumentNo").value,subject:$("cSubject").value,sender:$("cSender").value,recipient:$("cRecipient").value,document_date:$("cDocumentDate").value,received_date:$("cReceivedDate").value,urgency:$("cUrgency").value,confidentiality:$("cConfidentiality").value,assigned_to:$("cAssigned").value,due_date:$("cDue").value,direction_note:$("cDirection").value,document_id:$("cDocumentId").value}});$("createDialog").close();e.target.reset();await load();toast(`ลงทะเบียน ${result.register_no} แล้ว`)}catch(error){toast(error.message,true)}finally{b.disabled=false}};
$("updateForm").onsubmit=async e=>{e.preventDefault();try{await apiRequest(`/api/correspondence/${current.id}`,{method:"PATCH",body:{status:$("uStatus").value,assigned_to:$("uAssigned").value,due_date:$("uDue").value,direction_note:$("uDirection").value,note:$("uNote").value}});await load();await detail(current.id);toast("บันทึกการอัปเดตแล้ว")}catch(error){toast(error.message,true)}};
$("refresh").onclick=load;$("type").onchange=load;$("status").onchange=load;$("q").oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(load,180)};
(async()=>{const [{user},people]=await Promise.all([apiRequest("/api/auth/me"),apiRequest("/api/users")]);if(!user){location="/login.html";return}users=people.users;$("cAssigned").innerHTML=options();await load();const requested=Number(new URLSearchParams(location.search).get("record"));if(requested)await detail(requested)})().catch(e=>toast(e.message,true));
</script></body></html>
