<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>จัดการผู้ใช้งาน — ระบบจัดการโรงเรียนบ้านป่าเด็ง</title>
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#1E5FC0" />
<meta name="apple-mobile-web-app-title" content="บ้านป่าเด็ง" />
<link rel="stylesheet" href="/css/style.css" />
<style>
@media (max-width:720px){
 .users-table thead{display:none}
 .users-table,.users-table tbody{display:block;width:100%;min-width:0!important;max-width:100%}
 .panel:has(.users-table){padding:0;overflow:hidden}
 .users-table tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:14px;border-bottom:1px solid var(--color-border)}
 .users-table tr:last-child{border-bottom:0}
 .users-table td{display:block;border:0;padding:0;min-width:0;overflow-wrap:anywhere;font-size:14px}
 .users-table .c-name{grid-column:1;font-weight:700;font-size:16px}
 .users-table .c-name br{display:none}.users-table .c-name button{margin:0 0 0 8px;padding:4px 10px;min-height:32px;font-size:12px;width:auto;vertical-align:middle}
 .users-table .c-status{grid-column:2;grid-row:1 / span 2;text-align:right}
 .users-table .c-status br{display:none}.users-table .c-status button{width:auto;min-height:36px;padding:6px 12px;font-size:13px}
 .users-table .c-email{grid-column:1;color:var(--color-text-muted);font-size:13px}
 .users-table .c-prof{grid-column:1 / -1;font-size:13px;line-height:1.5}
 .users-table .c-role{grid-column:1 / -1}.users-table .c-role select{width:100%}
 .users-table .c-date{grid-column:1;font-size:12px;color:var(--color-text-muted);align-self:center}.users-table .c-date::before{content:'สมัครเมื่อ '}
 .users-table .c-act{grid-column:2;text-align:right}.users-table .c-act br{display:none}.users-table .c-act button{width:auto;min-height:36px;padding:6px 12px;font-size:13px}
 .app-main h2{font-size:20px}
 .users-table .c-name button,.users-table .c-status button,.users-table .c-act{display:none!important}
 .users-table .c-status{grid-row:1}
 .users-table tr{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background .15s,transform .15s}
 .users-table tr.lp-press{background:#eef4fb;transform:scale(.985)}
 .lp-hint{display:block!important}
}
.lp-hint{display:none;margin:12px 14px 0;font-size:12.5px;color:var(--color-text-muted)}
.lp-sheet{position:fixed;inset:0;z-index:2000;background:rgba(15,30,45,0);display:flex;align-items:flex-end;justify-content:center;transition:background .2s}
.lp-sheet.open{background:rgba(15,30,45,.4)}
.lp-card{width:100%;max-width:520px;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:grid;gap:8px;transform:translateY(100%);transition:transform .22s ease-out}
.lp-sheet.open .lp-card{transform:none}.lp-card b{font-size:16px}.lp-card small{color:var(--color-text-muted);margin-bottom:4px;overflow-wrap:anywhere}
.lp-card button{min-height:48px;border:1px solid #d6e2ec;border-radius:14px;background:#f6f9fc;font:inherit;font-size:15px;font-weight:600;color:#24405a;width:100%}
.lp-card button.danger{background:#fff1f1;border-color:#f2c4c4;color:#b3261e}.lp-card button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="app-shell">
  <div class="app-topbar">
    <div class="brand">
      <div class="brand-mark"><img src="/logo.jpg" alt="ตราโรงเรียน" /></div>
      โรงเรียนบ้านป่าเด็ง
    </div>
    <div class="app-user">
      <a href="/dashboard.html" id="backHomeLink">← กลับหน้าหลัก</a>
    </div>
  </div>

  <div class="app-main">
    <h2>จัดการผู้ใช้งาน</h2>
    <p style="color: var(--color-text-muted);">อนุมัติสมาชิกใหม่และกำหนดสิทธิ์การใช้งาน</p>

    <div class="panel" style="margin-top:20px;"><p class="lp-hint">กดค้างที่การ์ดผู้ใช้เพื่อแก้ไขชื่อ ระงับ หรือลบผู้ใช้</p>
      <table class="users-table">
        <thead>
          <tr>
            <th>ชื่อ-นามสกุล</th>
            <th>อีเมล</th>
            <th>ข้อมูลบุคลากร</th>
            <th>สิทธิ์การใช้งาน</th>
            <th>สถานะ</th>
            <th>สมัครเมื่อ</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody id="userRows"></tbody>
      </table>
      <div class="empty-state" id="emptyState">กำลังโหลดรายชื่อผู้ใช้…</div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  if (window.parent && window.parent !== window) {
    const backLink = document.getElementById("backHomeLink");
    if (backLink) {
      backLink.addEventListener("click", (e) => {
        e.preventDefault();
        if (window.parent.showOverview) window.parent.showOverview();
      });
    }
  }
</script>
<script>
  const ROLE_OPTIONS = [
    { value: "", label: "— ยังไม่กำหนด —" },
    { value: "teacher", label: "ครู" },
    { value: "executive", label: "ผู้บริหาร" },
    { value: "staff", label: "เจ้าหน้าที่ธุรการ" },
    { value: "education_staff", label: "บุคลากรทางการศึกษา" },
    { value: "superadmin", label: "ผู้ดูแลระบบ" },
    { value: "viewer", label: "ผู้ชมภายนอก (ดูอย่างเดียว)" },
  ];
  const DEPARTMENT_LABELS = { academic: "วิชาการ", early_childhood: "ปฐมวัย (งานอนุบาล)", budget: "งบประมาณ", personnel: "บุคคล", general: "บริหารทั่วไป" };
  let currentAdminId = null;
  let currentRole = null; // เปลี่ยนบทบาท ระงับ และลบบัญชี ทำได้เฉพาะผู้ดูแลระบบ (superadmin)
  const ONLY_SUPER = "เปลี่ยนบทบาท ระงับ หรือลบบัญชีได้เฉพาะผู้ดูแลระบบ";

  function formatDate(iso) {
    const d = new Date(iso + "Z");
    return d.toLocaleDateString("th-TH", { year: "numeric", month: "short", day: "numeric" });
  }

  function buildRoleSelect(user) {
    const select = document.createElement("select");
    ROLE_OPTIONS.forEach((opt) => {
      const el = document.createElement("option");
      el.value = opt.value;
      el.textContent = opt.label;
      if ((user.role || "") === opt.value) el.selected = true;
      select.appendChild(el);
    });
    if (currentRole !== "superadmin") { select.disabled = true; select.title = ONLY_SUPER; }
    select.addEventListener("change", async () => {
      select.disabled = true;
      try {
        await apiRequest(`/api/admin/users/${user.id}`, {
          method: "PATCH",
          body: { role: select.value || null },
        });
        await loadUsers();
      } catch (err) {
        alert(err.message);
        select.disabled = false;
      }
    });
    return select;
  }

  // บัญชีผู้ชมภายนอก: ดูได้อย่างเดียว ซ่อนข้อมูลส่วนบุคคล และหมดอายุตามวันที่กำหนด (ใช้ได้ถึงสิ้นวัน)
  function buildViewerExpiry(user) {
    const wrap = document.createElement("label");
    wrap.style.cssText = "display:grid;gap:4px;margin-top:8px;font-size:12px;color:var(--color-text-muted)";
    const today = new Date(Date.now() + 7 * 3600000).toISOString().slice(0, 10);
    const expired = user.access_expires_at && user.access_expires_at < today;
    wrap.textContent = expired ? "หมดอายุแล้ว — ตั้งวันใหม่เพื่อเปิดใช้" : "ใช้ได้ถึงวันที่ (เว้นว่าง = ไม่หมดอายุ)";
    if (expired) wrap.style.color = "var(--color-danger)";
    const input = document.createElement("input");
    input.type = "date"; input.value = user.access_expires_at || ""; input.style.width = "auto";
    if (currentRole !== "superadmin") { input.disabled = true; input.title = ONLY_SUPER; }
    input.addEventListener("change", async () => {
      input.disabled = true;
      try {
        await apiRequest(`/api/admin/users/${user.id}`, { method: "PATCH", body: { access_expires_at: input.value || null } });
        await loadUsers();
      } catch (err) { alert(err.message); input.disabled = false; }
    });
    wrap.appendChild(input);
    return wrap;
  }

  function buildStatusToggle(user) {
    const btn = document.createElement("button");
    btn.className = "btn btn-ghost";
    btn.style.padding = "4px 12px";
    btn.style.fontSize = "13px";
    btn.style.width = "auto";
    btn.textContent = user.status === "active" ? "ระงับบัญชี" : "เปิดใช้งานอีกครั้ง";
    if (currentRole !== "superadmin") { btn.disabled = true; btn.title = ONLY_SUPER; }
    btn.addEventListener("click", async () => {
      const nextStatus = user.status === "active" ? "disabled" : "active";
      if (nextStatus === "disabled" && !confirm(`ระงับบัญชีของ ${user.full_name}?`)) return;
      btn.disabled = true;
      try {
        await apiRequest(`/api/admin/users/${user.id}`, {
          method: "PATCH",
          body: { status: nextStatus },
        });
        await loadUsers();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    });
    return btn;
  }

  // ผู้ดูแลแก้ชื่อ–นามสกุลของผู้ใช้
  function buildRenameButton(user) {
    const btn = document.createElement("button");
    btn.className = "btn btn-ghost";
    btn.style.padding = "2px 10px";
    btn.style.fontSize = "12px";
    btn.style.width = "auto";
    btn.style.marginTop = "4px";
    btn.textContent = "แก้ไขชื่อ";
    btn.addEventListener("click", async () => {
      const value = prompt(`แก้ไขชื่อ–นามสกุลของ ${user.email}`, user.full_name || "");
      if (value === null) return;
      const name = value.replace(/\s+/g, " ").trim();
      if (!name || name === user.full_name) return;
      btn.disabled = true;
      try {
        await apiRequest(`/api/admin/users/${user.id}`, { method: "PATCH", body: { full_name: name } });
        await loadUsers();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    });
    return btn;
  }

  function buildDeleteButton(user) {
    const btn = document.createElement("button");
    btn.className = "btn btn-danger";
    btn.style.padding = "4px 12px";
    btn.style.fontSize = "13px";
    btn.style.width = "auto";
    btn.textContent = "ลบผู้ใช้";
    if (currentRole !== "superadmin") { btn.disabled = true; btn.title = ONLY_SUPER; }
    if (Number(user.id) === Number(currentAdminId)) {
      btn.disabled = true;
      btn.title = "ไม่สามารถลบบัญชีของตัวเองได้";
      return btn;
    }
    btn.addEventListener("click", async () => {
      if (!confirm(`ลบบัญชีของ ${user.full_name}?\n\nผู้ใช้นี้จะเข้าสู่ระบบไม่ได้ทันที แต่ประวัติงานและเอกสารเดิมจะยังคงอยู่`)) return;
      btn.disabled = true;
      try {
        await apiRequest(`/api/admin/users/${user.id}`, { method: "DELETE" });
        await loadUsers();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    });
    return btn;
  }

  async function loadUsers() {
    const tbody = document.getElementById("userRows");
    const emptyState = document.getElementById("emptyState");
    let users;
    try { ({ users } = await apiRequest("/api/admin/users")); }
    catch (err) { emptyState.textContent = "โหลดรายชื่อผู้ใช้ไม่สำเร็จ: " + err.message + " — ลองรีเฟรชหน้า"; emptyState.style.display = "block"; return; }
    emptyState.textContent = "ยังไม่มีผู้ใช้งานในระบบ";
    tbody.innerHTML = "";

    emptyState.style.display = "none";
    if (users.length === 0) {
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    // ผู้ที่ยังรอกำหนดสิทธิ์ (รออนุมัติ) อยู่บนสุด เรียงคำขอใหม่สุดก่อน · ที่เหลือคงลำดับเดิม
    const pending = users.filter((u) => !u.role).sort((a, b) => String(b.created_at || "").localeCompare(String(a.created_at || "")));
    users = [...pending, ...users.filter((u) => u.role)];
    users.forEach((user) => {
      const tr = document.createElement("tr");

      const nameTd = document.createElement("td"); nameTd.className = "c-name";
      const nameText = document.createElement("span");
      nameText.textContent = user.full_name;
      nameTd.appendChild(nameText);
      nameTd.appendChild(document.createElement("br"));
      nameTd.appendChild(buildRenameButton(user));
      tr.appendChild(nameTd);

      const emailTd = document.createElement("td"); emailTd.className = "c-email";
      emailTd.textContent = user.email;
      tr.appendChild(emailTd);

      const profileTd = document.createElement("td"); profileTd.className = "c-prof";
      const departmentText = String(user.departments || "").split(",").filter(Boolean).map((item) => DEPARTMENT_LABELS[item] || item).join(", ");
      const profileLines = [user.position, departmentText ? `ฝ่าย: ${departmentText}` : "", user.phone ? `โทร: ${user.phone}` : ""].filter(Boolean);
      profileLines.forEach((line, index) => {
        if (index) profileTd.appendChild(document.createElement("br"));
        const span = document.createElement("span");
        span.textContent = line;
        if (index) span.style.color = "var(--color-text-muted)";
        profileTd.appendChild(span);
      });
      if (!profileLines.length) profileTd.textContent = "ยังไม่มีข้อมูล";
      tr.appendChild(profileTd);

      const roleTd = document.createElement("td"); roleTd.className = "c-role";
      roleTd.appendChild(buildRoleSelect(user));
      if (user.role === "viewer") roleTd.appendChild(buildViewerExpiry(user));
      tr.appendChild(roleTd);

      const statusTd = document.createElement("td"); statusTd.className = "c-status";
      const statusLabel = document.createElement("span");
      if (!user.role) {
        statusLabel.textContent = "รอกำหนดสิทธิ์";
        statusLabel.className = "status-pending";
      } else if (user.status === "active") {
        statusLabel.textContent = "ใช้งานอยู่";
        statusLabel.className = "status-active";
      } else {
        statusLabel.textContent = "ถูกระงับ";
        statusLabel.className = "status-disabled";
      }
      statusTd.appendChild(statusLabel);
      statusTd.appendChild(document.createElement("br"));
      const toggleWrap = document.createElement("div");
      toggleWrap.style.marginTop = "6px";
      toggleWrap.appendChild(buildStatusToggle(user));
      statusTd.appendChild(toggleWrap);
      tr.appendChild(statusTd);

      const dateTd = document.createElement("td"); dateTd.className = "c-date";
      dateTd.textContent = formatDate(user.created_at);
      tr.appendChild(dateTd);

      const actionTd = document.createElement("td"); actionTd.className = "c-act";
      actionTd.appendChild(buildDeleteButton(user));
      actionTd.appendChild(document.createElement("br"));
      tr.appendChild(actionTd);

      tbody.appendChild(tr);
    });
  }

  // มือถือ: กดค้างที่การ์ดผู้ใช้ → แก้ไขชื่อ / ระงับ-เปิดใช้ / ลบผู้ใช้ (เรียกปุ่มเดิมในการ์ด)
  (() => {
    const tbody = document.getElementById("userRows");
    const phone = window.matchMedia("(max-width:720px)");
    let timer = 0, start = null, row = null;
    const cancel = () => { clearTimeout(timer); timer = 0; row?.classList.remove("lp-press"); row = null; };
    tbody.addEventListener("pointerdown", (e) => {
      if (!phone.matches || e.target.closest("select,input,button,a")) return;
      const tr = e.target.closest("tr"); if (!tr) return;
      row = tr; start = [e.clientX, e.clientY]; tr.classList.add("lp-press");
      timer = setTimeout(() => { cancel(); try { navigator.vibrate?.(15); } catch {} openSheet(tr); }, 550);
    });
    tbody.addEventListener("pointermove", (e) => { if (timer && Math.hypot(e.clientX - start[0], e.clientY - start[1]) > 10) cancel(); });
    ["pointerup", "pointercancel", "pointerleave"].forEach((ev) => tbody.addEventListener(ev, cancel));
    tbody.addEventListener("contextmenu", (e) => { if (phone.matches && e.target.closest("tr")) e.preventDefault(); });
    function openSheet(tr) {
      const rename = tr.querySelector(".c-name button"), toggle = tr.querySelector(".c-status button"), del = tr.querySelector(".c-act button");
      const name = tr.querySelector(".c-name span")?.textContent || "", email = tr.querySelector(".c-email")?.textContent || "";
      const sh = document.createElement("div"); sh.className = "lp-sheet";
      const card = document.createElement("div"); card.className = "lp-card"; card.setAttribute("role", "dialog");
      const b = document.createElement("b"); b.textContent = name; const sm = document.createElement("small"); sm.textContent = email;
      card.append(b, sm);
      const add = (label, src, cls) => { if (!src) return; const btn = document.createElement("button"); btn.type = "button"; btn.textContent = label; if (cls) btn.className = cls; btn.disabled = src.disabled; btn.onclick = () => { close(); src.click(); }; card.append(btn); };
      add("✏️ แก้ไขชื่อ", rename);
      add(toggle ? (/ระงับ/.test(toggle.textContent) ? "⏸ ระงับผู้ใช้" : "▶️ " + toggle.textContent.trim()) : "", toggle);
      add("🗑 ลบผู้ใช้", del, "danger");
      const x = document.createElement("button"); x.type = "button"; x.textContent = "ยกเลิก"; x.onclick = () => close(); card.append(x);
      sh.append(card); document.body.append(sh); requestAnimationFrame(() => sh.classList.add("open"));
      sh.onclick = (e) => { if (e.target === sh) close(); };
      function close() { sh.classList.remove("open"); setTimeout(() => sh.remove(), 200); }
    }
  })();

  (async () => {
    const { user } = await apiRequest("/api/auth/me");
    if (!user) {
      window.location.href = "/login.html";
      return;
    }
    if (!user.is_admin) {
      window.location.href = "/dashboard.html";
      return;
    }
    currentAdminId = user.id;
    currentRole = user.role;
    await loadUsers();
  })();
</script>
</body>
</html>
