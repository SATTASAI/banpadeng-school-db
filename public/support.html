<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ดูแลช่วยเหลือนักเรียน</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="app-main"><a href="/dashboard.html">← กลับแดชบอร์ด</a><h2>ระบบดูแลช่วยเหลือนักเรียน</h2><p>คัดกรอง เยี่ยมบ้าน ทุน กลุ่มเสี่ยง การช่วยเหลือ และการส่งต่อ</p><section class="panel"><form id="form" style="display:grid;gap:10px;max-width:640px"><input id="student_id" type="number" placeholder="รหัสนักเรียน (ID ในระบบ)" required><select id="case_type"><option value="screening">คัดกรอง</option><option value="home_visit">เยี่ยมบ้าน</option><option value="scholarship">ทุนการศึกษา</option><option value="risk">กลุ่มเสี่ยง</option><option value="behavior">พฤติกรรม</option><option value="assistance">การช่วยเหลือ</option><option value="referral">ส่งต่อ</option></select><select id="risk_level"><option value="normal">ปกติ</option><option value="watch">เฝ้าระวัง</option><option value="high">เสี่ยงสูง</option><option value="urgent">เร่งด่วน</option></select><textarea id="summary" placeholder="สรุปกรณี/ปัญหา" required></textarea><textarea id="action_taken" placeholder="การช่วยเหลือ/การดำเนินการ"></textarea><input id="follow_up_date" type="date"><button class="btn btn-primary">บันทึกกรณีช่วยเหลือ</button></form></section><h3>รายการล่าสุด</h3><div class="panel" id="list">กำลังโหลด...</div></main><script src="/js/api.js"></script><script>(async()=>{const me=await apiRequest('/api/auth/me');if(!me.user){location='/login.html';return}const list=async()=>{const d=await apiRequest('/api/student-support');document.getElementById('list').innerHTML=d.cases.length?'<table><tr><th>นักเรียน</th><th>ประเภท</th><th>ระดับ</th><th>สถานะ</th><th>สรุป</th></tr>'+d.cases.map(c=>`<tr><td>${c.student_name}</td><td>${c.case_type}</td><td>${c.risk_level}</td><td>${c.status}</td><td>${c.summary}</td></tr>`).join('')+'</table>':'ยังไม่มีข้อมูล'};document.getElementById('form').onsubmit=async e=>{e.preventDefault();await apiRequest('/api/student-support',{method:'POST',body:JSON.stringify({student_id:+student_id.value,case_type:case_type.value,risk_level:risk_level.value,summary:summary.value,action_taken:action_taken.value,follow_up_date:follow_up_date.value||null})});e.target.reset();await list()};await list()})().catch(e=>alert(e.message))</script></body></html>
