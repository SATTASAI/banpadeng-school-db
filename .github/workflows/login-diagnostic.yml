name: Diagnose school login configuration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/login-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read only login configuration and credential format
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,re
          root='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CF_ACCOUNT_ID']
          headers={'Authorization':'Bearer '+os.environ['CF_API_TOKEN'],'Content-Type':'application/json'}
          def call(path,body=None):
            req=urllib.request.Request(root+path,headers=headers,data=json.dumps(body).encode() if body is not None else None)
            try:
              with urllib.request.urlopen(req,timeout=20) as r:return json.load(r)
            except urllib.error.HTTPError as e:
              print('Lookup HTTP status:',e.code,'for',path.split('?')[0]);return None
          settings=call('/workers/scripts/banpadeng-school-db/settings')
          if settings:
            bindings=(settings.get('result') or {}).get('bindings') or []
            print(json.dumps({'jwt_secret_binding_present':any(b.get('name')=='JWT_SECRET' for b in bindings),'database_binding_present':any(b.get('name')=='DB' and b.get('type')=='d1' for b in bindings),'binding_types':[{'name':b.get('name'),'type':b.get('type')} for b in bindings if b.get('name') in ('JWT_SECRET','DB')]},ensure_ascii=False))
          import secrets,time
          token=secrets.token_hex(32)+':'+str(int(time.time())+600)
          secret_path='/workers/scripts/banpadeng-school-db/secrets'
          configured=call(secret_path,{'name':'LOGIN_DIAGNOSTIC_TOKEN','text':token,'type':'secret_text'})
          if not configured or not configured.get('success'):raise SystemExit('Cannot configure private diagnostics')
          try:
            for attempt in range(50):
              req=urllib.request.Request('https://system.banpadengschool.ac.th/api/internal/login-diagnostic',headers={'Authorization':'Bearer '+token,'User-Agent':'curl/8.7.1'})
              try:
                with urllib.request.urlopen(req,timeout=20) as response:
                  result=json.load(response)
                  print('Private login checks:',json.dumps(result,ensure_ascii=False))
                  break
              except urllib.error.HTTPError as e:
                if e.code==404:time.sleep(3);continue
                print('Diagnostic endpoint HTTP status:',e.code);break
            else:raise SystemExit('Diagnostic deployment not ready')
          finally:
            req=urllib.request.Request(root+secret_path+'/LOGIN_DIAGNOSTIC_TOKEN',headers=headers,method='DELETE')
            try:
              with urllib.request.urlopen(req,timeout=20) as response:print('Private diagnostic token removed:',response.status)
            except urllib.error.HTTPError as e:print('Token cleanup HTTP status:',e.code)
          PY
