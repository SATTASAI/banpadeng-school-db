name: diag tail (temporary)
on:
  push:
    branches: [diag-api-hang]
permissions:
  contents: read
jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
    steps:
      - name: tail while calling API
        shell: bash
        run: |
          set +e
          {
          for p in /api/students /api/overview /api/academic-periods /api/staff /api/students /api/overview /api/auth/me; do
            echo "== $p $(curl -s -o /dev/null -w "%{http_code} %{time_total}s" --max-time 60 "https://system.banpadengschool.ac.th$p")"
          done
          } > out.txt 2>&1
          python3 -c "
          L=open('out.txt').read().splitlines()
          print('::warning title=t::'+'%0A'.join(L))
          "
