name: Test school management Worker
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'schema.sql'
      - 'wrangler.jsonc'
      - '.github/workflows/test-worker.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check src/index.js
      - run: node --check src/routes/timetable-sync.js
      - run: node --test tests/*.test.mjs
