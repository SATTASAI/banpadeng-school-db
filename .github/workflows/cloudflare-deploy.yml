name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      WORKER_NAME: banpadeng-school-db
    steps:
      - name: Trigger Cloudflare build for this commit
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"
          auth="Authorization: Bearer $CF_API_TOKEN"

          curl --fail-with-body --silent --show-error \
            --header "$auth" "$api/workers/scripts" > "$RUNNER_TEMP/scripts.json"
          worker_tag=$(python3 - "$RUNNER_TEMP/scripts.json" "$WORKER_NAME" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          match=next((row for row in data.get("result",[]) if row.get("id")==sys.argv[2]),None)
          if not match or not match.get("tag"):
              raise SystemExit(f"::error::ไม่พบ Worker {sys.argv[2]} หรือ Worker ไม่มี tag")
          print(match["tag"])
          PY
          )

          curl --fail-with-body --silent --show-error \
            --header "$auth" "$api/builds/workers/$worker_tag/triggers" > "$RUNNER_TEMP/triggers.json"
          trigger_uuid=$(python3 - "$RUNNER_TEMP/triggers.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          rows=data.get("result",[])
          production=next((row for row in rows if row.get("branch_includes") in (["main"],"main")),None)
          selected=production or (rows[0] if rows else None)
          value=(selected or {}).get("trigger_uuid") or (selected or {}).get("uuid")
          if not value:
              raise SystemExit("::error::ไม่พบ Production build trigger ของ Worker")
          print(value)
          PY
          )

          payload=$(python3 - "$GITHUB_SHA" <<'PY'
          import json, sys
          print(json.dumps({"branch":"main","commit_hash":sys.argv[1]}))
          PY
          )
          curl --fail-with-body --silent --show-error --request POST \
            --header "$auth" --header "Content-Type: application/json" \
            --data "$payload" "$api/builds/triggers/$trigger_uuid/builds" > "$RUNNER_TEMP/build.json"
          build_id=$(python3 - "$RUNNER_TEMP/build.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          result=data.get("result") or {}
          build_id=result.get("build_uuid") or result.get("uuid")
          if not data.get("success") or not build_id:
              raise SystemExit("::error::Cloudflare ไม่รับคำสั่ง build")
          print(build_id)
          PY
          )
          echo "สั่ง Cloudflare build สำเร็จ: $build_id"

          for attempt in $(seq 1 60); do
            curl --fail-with-body --silent --show-error \
              --header "$auth" "$api/builds/builds/$build_id" > "$RUNNER_TEMP/build-status.json"
            outcome=$(python3 - "$RUNNER_TEMP/build-status.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          result=data.get("result") or {}
          print(result.get("build_outcome") or "running")
          PY
            )
            echo "Cloudflare build: $outcome (ครั้งที่ $attempt)"
            if [[ "$outcome" == "success" ]]; then break; fi
            if [[ "$outcome" =~ ^(fail|cancelled|terminated|skipped)$ ]]; then
              curl --fail-with-body --silent --show-error \
                --header "$auth" "$api/builds/builds/$build_id/logs" > "$RUNNER_TEMP/build-logs.json" || true
              python3 - "$RUNNER_TEMP/build-logs.json" <<'PY' || true
          import json, re, sys
          try:
              data=json.load(open(sys.argv[1],encoding="utf-8"))
          except Exception:
              raise SystemExit(0)
          result=data.get("result") or {}
          lines=result.get("lines") or []
          output=[]
          for item in lines:
              if isinstance(item,str): message=item
              elif isinstance(item,dict): message=str(item.get("message") or item.get("line") or item.get("text") or item)
              else: message=str(item)
              message=re.sub(r'(?i)(authorization|token|secret|password)(\s*[:=]\s*)\S+',r'\1\2[REDACTED]',message)
              output.append(message[:1000])
          print("--- Cloudflare build log (ท้ายรายการ) ---")
          print("\n".join(output[-120:]))
          PY
              echo "::error::Cloudflare build จบด้วยสถานะ $outcome"
              exit 1
            fi
            sleep 10
          done
          if [[ "$outcome" != "success" ]]; then
            echo "::error::Cloudflare build ใช้เวลานานเกิน 10 นาที"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --header "$auth" "$api/workers/scripts/$WORKER_NAME/deployments?per_page=1" > "$RUNNER_TEMP/deployment.json"
          python3 - "$RUNNER_TEMP/deployment.json" "$GITHUB_SHA" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          deployments=(data.get("result") or {}).get("deployments") or []
          if not deployments:
              raise SystemExit("::error::ไม่พบ deployment หลัง build สำเร็จ")
          active=deployments[0]
          print(f"Cloudflare deployment สำเร็จ: {active.get('id')}")
          print(f"เวลา deploy (UTC): {active.get('created_on')}")
          print(f"GitHub commit: {sys.argv[2]}")
          PY
